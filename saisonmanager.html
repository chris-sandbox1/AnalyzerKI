  staticView = v;
  document.getElementById('static-view-scorerteams').classList.toggle('active', v === 'scorerteams');
  document.getElementById('static-view-kader').classList.toggle('active', v === 'kader');
  if (v === 'kader' && staticDaten && !staticDaten.team_rosters && !teamRostersLaed) {
    ladeTeamRosters();
  } else {
    renderStaticAlltime();
  }
}

async function ladeTeamRosters() {
  teamRostersLaed = true;
  document.getElementById('content-static').innerHTML =
    '<div class="lade-info"><div class="spinner"></div><span>Lade Team-Kader-Daten…</span></div>';
  try {
    const rosters = await fetchJSON('data/team_rosters.json');
    staticDaten.team_rosters = rosters;
    teamRostersGeladen = true;
    renderStaticAlltime();
  } catch(e) {
    document.getElementById('content-static').innerHTML =
      `<div class="error-box">team_rosters.json nicht erreichbar.<br><small>${e.message || e}</small></div>`;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// TAB 6: Team-Kader-Ansicht
// ─────────────────────────────────────────────────────────────────────────────
function renderStaticKader() {
  const el = document.getElementById('content-static');
  const rosters = staticDaten?.team_rosters;
  if (!rosters) {
    el.innerHTML = '<div class="error-box">team_rosters nicht in alltime.json vorhanden.<br><small>Bitte <b>python tools/alltime.py</b> neu ausführen.</small></div>';
    return;
  }

  // ── Team-Suche ────────────────────────────────────────────────────────────
  const teamNames = Object.keys(rosters).sort();
  const suche = staticKaderSuche.trim().toLowerCase();
  const gefilterte = suche
    ? teamNames.filter(n => n.toLowerCase().includes(suche))
    : teamNames;

  const hatAuswahl = staticKaderTeams.size > 0;

  // ── Spieler über alle gewählten Teams zusammenführen (merge by player_id) ─
  let kaderInfo = '';
  if (hatAuswahl) {
    const merged = new Map(); // player_id → merged stats
    const verbSet = new Set();

    for (const teamName of staticKaderTeams) {
      const roster = rosters[teamName] || [];
      for (const p of roster) {
        (p.verbaende || []).forEach(v => verbSet.add(v));
        if (!merged.has(p.player_id)) {
          merged.set(p.player_id, {
            player_id:    p.player_id,
            first_name:   p.first_name,
            last_name:    p.last_name,
            verbaende:    new Set(p.verbaende || []),
            spiele:       0, tore:  0, assists: 0,
            strafminuten: 0, p2:    0, p2and2:  0,
            p5:           0, p10:   0, ms:      0,
          });
        }
        const m = merged.get(p.player_id);
        m.first_name   = p.first_name || m.first_name;
        m.last_name    = p.last_name  || m.last_name;
        m.spiele       += p.spiele       || 0;
        m.tore         += p.tore         || 0;
        m.assists      += p.assists      || 0;
        m.strafminuten += p.strafminuten || 0;
        m.p2           += p.p2           || 0;
        m.p2and2       += p.p2and2       || 0;
        m.p5           += p.p5           || 0;
        m.p10          += p.p10          || 0;
        m.ms           += p.ms           || 0;
        (p.verbaende || []).forEach(v => m.verbaende.add(v));
      }
    }

    // punkte berechnen + Sets finalisieren
    const alle = [...merged.values()].map(m => ({
      ...m,
      verbaende: [...m.verbaende].sort(),
      punkte: m.tore + m.assists,
    }));

    const verbaende = [...verbSet].sort();

    // Verband-Filter
    let gefiltert = alle;
    if (staticKaderVerband !== 'alle') {
      gefiltert = alle.filter(p => p.verbaende.includes(staticKaderVerband));
    }

    // Sortieren
    gefiltert = [...gefiltert].sort((a, b) => {
      const sp = x => x.spiele || 1;
      if (staticKaderSort === 'pkt_sp') return b.punkte/sp(b) - a.punkte/sp(a);
      if (staticKaderSort === 'g_sp')   return b.tore/sp(b)   - a.tore/sp(a);
      if (staticKaderSort === 'a_sp')   return b.assists/sp(b) - a.assists/sp(a);
      if (staticKaderSort === 'pim_sp') return b.strafminuten/sp(b) - a.strafminuten/sp(a);
      return (b[staticKaderSort] || 0) - (a[staticKaderSort] || 0);
    });

    const gesamtKader = gefiltert.length;
    gefiltert = gefiltert.slice((staticKaderSeite - 1) * PAGE_SIZE, staticKaderSeite * PAGE_SIZE);

    const kHdr = (key, label, title='') =>
      `<th class="${staticKaderSort===key?'at-sort-active':''}" onclick="setStaticKaderSort('${key}')"${title?` title="${title}"`:''}>${label}</th>`;

    const colCount = 7 + (staticStrafenDetails ? 5 : 0) + (staticPerGame ? 4 : 0);
    const rosterZeilen = gefiltert.map((p, i) => {
      const name = `${p.first_name} ${p.last_name}`;
      const sp   = p.spiele || 1;
      const vb   = p.verbaende.join(', ') || '—';
      return `<tr>
        <td class="at-rank">${i+1}</td>
        <td class="at-name">${esc(name)}</td>
        <td class="at-team" title="${esc(vb)}">${esc(vb.length > 35 ? vb.slice(0,33)+'…' : vb)}</td>
        <td>${p.spiele}</td>
        <td>${p.tore}</td>
        <td>${p.assists}</td>
        <td class="at-pkt">${p.punkte}</td>
        ${staticStrafenDetails
          ? `<td>${p.p2||0}</td><td>${p.p2and2||0}</td><td>${p.p5||0}</td><td>${p.p10||0}</td><td>${p.ms||0}</td>`
          : ''}
        <td>${p.strafminuten}'</td>
        ${staticPerGame
          ? `<td>${(p.punkte/sp).toFixed(2)}</td><td>${(p.tore/sp).toFixed(2)}</td><td>${(p.assists/sp).toFixed(2)}</td><td>${(p.strafminuten/sp).toFixed(2)}'</td>`
          : ''}
      </tr>`;
    }).join('');

    const vHdr = (v) => {
      const lbl = v === 'alle' ? 'Alle Verbände' : v;
      return `<button class="filter-btn${staticKaderVerband===v?' active':''}" onclick="setStaticKaderVerband('${esc(v)}')">${esc(lbl)}</button>`;
    };
    const verbButtons = [vHdr('alle'), ...verbaende.map(vHdr)].join('');

    kaderInfo = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        ${verbButtons}
        <div class="alltime-sep"></div>
        <button class="filter-btn" id="kader-strafen-btn" onclick="toggleStrafenDetails('static')">Strafen Details</button>
        <button class="filter-btn" id="kader-pergame-btn" onclick="togglePerGame('static')">Pro Spiel</button>
      </div>
      <div class="glass">
        <table class="at-table">
          <thead><tr>
            <th>#</th>
            <th>Spieler</th>
            <th>Verbände</th>
            ${kHdr('spiele','Sp')}
            ${kHdr('tore','G')}
            ${kHdr('assists','A')}
            ${kHdr('punkte','Pkt')}
            ${staticStrafenDetails
              ? `${kHdr('p2',"2'","2-Minuten-Strafen")}${kHdr('p2and2','2+2','2+2-Minuten-Strafen')}${kHdr('p5',"5'","5-Minuten-Strafen")}${kHdr('p10',"10'","10-Minuten-Strafen")}${kHdr('ms','MS','Matchstrafen')}`
              : ''}
            ${kHdr('strafminuten','PIM')}
            ${staticPerGame
              ? `${kHdr('pkt_sp','Pkt/Sp','Punkte pro Spiel')}${kHdr('g_sp','G/Sp','Tore pro Spiel')}${kHdr('a_sp','A/Sp','Assists pro Spiel')}${kHdr('pim_sp','PIM/Sp','PIM pro Spiel')}`
              : ''}
          </tr></thead>
          <tbody>${rosterZeilen || `<tr><td colspan="${colCount}" style="text-align:center;padding:20px;color:rgba(255,255,255,.3)">Keine Einträge</td></tr>`}</tbody>
        </table>
      </div>
      ${paginierungsHTML(gesamtKader, staticKaderSeite, 'setStaticKaderSeite')}`;
  }

  // ── Titel: Teamnamen oder Anzahl ──────────────────────────────────────────
  const titelTeams = staticKaderTeams.size === 0
    ? ''
    : staticKaderTeams.size === 1
      ? '— ' + esc([...staticKaderTeams][0])
      : `— ${staticKaderTeams.size} Teams kombiniert`;

  // ── Ausgewählte Teams als Tags ────────────────────────────────────────────
  const auswahlTags = staticKaderTeams.size > 0
    ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">
        ${[...staticKaderTeams].map(n =>
          `<span class="kader-tag" onclick="waehleKaderTeam('${esc(n).replace(/'/g,"\\'")}')">
            ${esc(n)} <span class="kader-tag-x">✕</span>
          </span>`).join('')}
        <button class="filter-btn" style="font-size:.7rem;padding:3px 8px"
                onclick="staticKaderTeams.clear();staticKaderVerband='alle';renderStaticKader()">Alle abwählen</button>
       </div>`
    : '';

  // ── Liste ─────────────────────────────────────────────────────────────────
  const listeItems = gefilterte.map(n => {
    const sel = staticKaderTeams.has(n);
    return `<div class="kader-team-item${sel?' kader-team-selected':''}" onclick="waehleKaderTeam('${esc(n).replace(/'/g,"\\'")}')">
      <span class="kader-check">${sel ? '✓' : ''}</span>${esc(n)}
    </div>`;
  }).join('');

  // Focus-Zustand merken
  const hatteSearchFokus = document.activeElement?.id === 'kader-suche';

  el.innerHTML = `
  <div class="alltime-section">
    <div class="alltime-section-title">🏒 Team-Kader ${titelTeams}</div>
    <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">

      <!-- Linke Spalte: Team-Suche + Liste -->
      <div style="min-width:220px;max-width:280px;flex:0 0 250px">
        <input class="alltime-search" type="text" id="kader-suche"
               style="width:100%;box-sizing:border-box;margin-bottom:6px"
               placeholder="Team suchen…" value="${esc(staticKaderSuche)}"
               oninput="staticKaderSuche=this.value;renderStaticKader()">
        ${auswahlTags}
        <div class="glass" style="max-height:420px;overflow-y:auto;padding:4px 0">
          ${listeItems || '<div style="padding:10px;color:rgba(255,255,255,.3);font-size:.8rem">Keine Teams gefunden</div>'}
        </div>
      </div>

      <!-- Rechte Spalte: kombinierte Tabelle -->
      <div style="flex:1;min-width:300px">
        ${hatAuswahl
          ? kaderInfo
          : '<div style="color:rgba(255,255,255,.35);padding:20px 0;font-size:.85rem">← Ein oder mehrere Teams aus der Liste auswählen</div>'}
      </div>
    </div>
  </div>`;

  // Focus wiederherstellen
  if (hatteSearchFokus) {
    const inp = document.getElementById('kader-suche');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }

  // Toggle-Buttons syncen
  document.getElementById('kader-strafen-btn')?.classList.toggle('active', staticStrafenDetails);
  document.getElementById('kader-pergame-btn')?.classList.toggle('active', staticPerGame);
}

function waehleKaderTeam(name) {
  if (staticKaderTeams.has(name)) {
    staticKaderTeams.delete(name);
  } else {
    staticKaderTeams.add(name);
    staticKaderVerband = 'alle';
  }
  staticKaderSeite = 1;
  renderStaticKader();
}

function setStaticKaderVerband(v) {
  staticKaderVerband = v;
  staticKaderSeite = 1;
  renderStaticKader();
}

function setStaticKaderSort(key) {
  staticKaderSort = key;
  staticKaderSeite = 1;
  renderStaticKader();
}

// Pagination-Setter
// ─────────────────────────────────────────────────────────────────────────────
function setAlltimeSpielerSeite(s) { alltimeSpielerSeite = s; renderAlltimeSpieler(); }
function setAlltimeTeamSeite(s)    { alltimeTeamSeite    = s; renderAlltimeTeams(); }
function setStaticSpielerSeite(s)  { staticSpielerSeite  = s; renderStaticAlltime(); }
function setStaticTeamSeite(s)     { staticTeamSeite     = s; renderStaticAlltime(); }

// Spiel-Detail-Ansicht
// ─────────────────────────────────────────────────────────────────────────────

function zeigSpielplan() {
  document.getElementById('spielplan-liste').style.display = '';
  document.getElementById('spielplan-detail').style.display = 'none';
}

async function zeigSpielDetail(gameId) {
  document.getElementById('spielplan-liste').style.display = 'none';
  const detailEl = document.getElementById('spielplan-detail');
  const contentEl = document.getElementById('content-spiel-detail');
  detailEl.style.display = '';
  contentEl.innerHTML = '<div class="lade-info"><div class="spinner"></div><span>Lade Spieldaten…</span></div>';
  try {
    const g = await fetchJSON(`${API_BASE}/api/v2/games/${gameId}.json`);
    contentEl.innerHTML = renderSpielDetail(g);
  } catch(e) {
    contentEl.innerHTML = `<div class="error-box">Fehler beim Laden: ${e.message}</div>`;
  }
}

function renderSpielDetail(g) {
  const CA = 'var(--color-a)', CB = 'var(--color-b)';
  const r = g.result || {};
  const hg = r.home_goals ?? '–';
  const gg = r.guest_goals ?? '–';
  const postfix = r.postfix?.short ? `<div class="sd-score-postfix">${esc(r.postfix.short)}</div>` : '';

  // ── Drittel ──
  const hP = r.home_goals_period || [];
  const gP = r.guest_goals_period || [];
  const periodLabels = ['1. Drittel','2. Drittel','3. Drittel','Verlängerung'];
  const activePeriods = periodLabels.filter((_, i) => hP[i] !== undefined || gP[i] !== undefined);
  const periodRows = `
    <tr>
      <td style="color:${CA}">${esc(g.home_team_name)}</td>
      ${activePeriods.map((_, i) => `<td>${hP[i] ?? 0}</td>`).join('')}
      <td class="sd-period-total">${hg}</td>
    </tr>
    <tr>
      <td style="color:${CB}">${esc(g.guest_team_name)}</td>
      ${activePeriods.map((_, i) => `<td>${gP[i] ?? 0}</td>`).join('')}
      <td class="sd-period-total">${gg}</td>
    </tr>`;

  // ── Events: Timeline ──
  const events = (g.events || []).slice().sort((a, b) => a.sortkey > b.sortkey ? 1 : -1);

  function penaltyClass(penType) {
    if (!penType) return 'sd-ptype-2';
    if (penType === 'penalty_2') return 'sd-ptype-2';
    if (['penalty_2and2','penalty_5','penalty_10'].includes(penType)) return 'sd-ptype-mid';
    return 'sd-ptype-ms'; // penalty_match, penalty_ms_*
  }
  function penaltyIcon(penType) {
    if (!penType) return '🟨';
    if (penType === 'penalty_2') return '🟨';
    if (['penalty_2and2','penalty_5','penalty_10'].includes(penType)) return '🟧';
    return '🟥';
  }

  // Spieler-Lookup: trikot_number → name (für Assists)
  const homePlayers = {};
  const guestPlayers = {};
  (g.players?.home || []).forEach(p => { homePlayers[p.trikot_number] = `${p.player_firstname} ${p.player_name}`; });
  (g.players?.guest || []).forEach(p => { guestPlayers[p.trikot_number] = `${p.player_firstname} ${p.player_name}`; });

  // Straftyp-Fallback wenn penalty_type_string fehlt
  const PEN_LABEL = {
    penalty_2:     '2 Minuten',
    penalty_2and2: '2+2 Minuten',
    penalty_5:     '5 Minuten',
    penalty_10:    '10 Minuten',
    penalty_match: 'Matchstrafe',
    penalty_ms_tech: 'Matchstrafe (techn.)',
    penalty_ms_full: 'Matchstrafe (voll)',
    penalty_ms1:   'Matchstrafe 1',
    penalty_ms2:   'Matchstrafe 2',
  };

  const timelineRows = events.map(e => {
    const isHome = e.event_team === 'home';
    const cls = isHome ? 'sd-event-home' : 'sd-event-guest';
    const playerLookup = isHome ? homePlayers : guestPlayers;
    const teamLabel = isHome ? esc(g.home_team_name) : esc(g.guest_team_name);
    const hasNumber = e.number != null && e.number !== '';
    const playerName = hasNumber ? (playerLookup[e.number] || '') : '';

    let icon, mainText, subText, scoreText = '';
    if (e.event_type === 'goal') {
      icon = '⚽';
      mainText = hasNumber ? `#${e.number}${playerName ? ' ' + esc(playerName) : ''}` : teamLabel;
      const assistName = e.assist ? (playerLookup[e.assist] || '') : null;
      subText = assistName ? `Assist: #${e.assist} ${esc(assistName)}` : (e.goal_type_string || '');
      scoreText = `${e.home_goals}:${e.guest_goals}`;
    } else {
      icon = penaltyIcon(e.penalty_type);
      mainText = hasNumber ? `#${e.number}${playerName ? ' ' + esc(playerName) : ''}` : teamLabel;
      const penTypeStr = e.penalty_type_string || PEN_LABEL[e.penalty_type] || '';
      subText = [penTypeStr, e.penalty_reason_string].filter(Boolean).join(' · ');
      // Bankstrafe: kein Spieler → Grund besonders hervorheben
      if (!hasNumber && !subText) subText = 'Bankstrafe';
    }

    return `<div class="sd-event ${cls}">
      <span class="sd-event-time">P${e.period} ${esc(e.time)}</span>
      <span class="sd-event-icon">${icon}</span>
      <div class="sd-event-info">
        <span class="sd-event-main">${mainText}</span>
        ${subText ? `<span class="sd-event-sub">${esc(subText)}</span>` : ''}
      </div>
      <span class="sd-event-score">${scoreText}</span>
    </div>`;
  }).join('');

  // ── Strafen-Übersicht ──
  const penalties = events.filter(e => e.event_type === 'penalty');
  const homePens = penalties.filter(e => e.event_team === 'home');
  const guestPens = penalties.filter(e => e.event_team === 'guest');

  function penRows(pens, playerLookup, teamName) {
    if (!pens.length) return '<div style="color:rgba(255,255,255,.25);font-size:.72rem;padding:6px 0">Keine Strafen</div>';
    return pens.map(e => {
      const hasNr = e.number != null && e.number !== '';
      const lookedUp = hasNr ? (playerLookup[e.number] || '') : '';
      const playerLabel = hasNr ? `#${e.number}${lookedUp ? ' ' + esc(lookedUp) : ''}` : esc(teamName || '–');
      const cls = penaltyClass(e.penalty_type);
      return `<div class="sd-penalty-row">
        <span class="sd-penalty-time">P${e.period} ${esc(e.time)}</span>
        <span class="sd-penalty-type ${cls}">${esc(e.penalty_type_string || PEN_LABEL[e.penalty_type] || '?')}</span>
        <div>
          <span class="sd-penalty-player">${playerLabel}</span>
          ${e.penalty_reason_string ? `<div class="sd-penalty-reason">${esc(e.penalty_reason_string)}</div>` : (!hasNr ? '<div class="sd-penalty-reason">Bankstrafe</div>' : '')}
        </div>
      </div>`;
    }).join('');
  }

  // ── Kader & Aufstellung ──
  const posLabels = {
    goal: 'Torwart', defender1: 'Verteidiger 1', defender2: 'Verteidiger 2',
    center: 'Mitte', forward1: 'Stürmer 1', forward2: 'Stürmer 2'
  };
  const posOrder = ['goal','defender1','defender2','center','forward1','forward2'];

  function mvpSet(awards) {
    const s = new Set();
    (awards || []).forEach(a => { if (a.award === 'mvp') s.add(a.trikot_number); });
    return s;
  }

  function rosterCol(startingPlayers, allPlayers, awards, teamColor) {
    const mvps = mvpSet(awards);
    const startingNrs = new Set((startingPlayers || []).map(p => p.trikot_number));

    // Startaufstellung nach posOrder
    const startMap = {};
    (startingPlayers || []).forEach(p => { startMap[p.position] = p; });
    const startRows = posOrder.map(pos => {
      const p = startMap[pos];
      if (!p) return '';
      const isMvp = mvps.has(p.trikot_number);
      return `<div class="sd-player-row sd-starter-row">
        <span class="sd-pos-label">${posLabels[pos]}</span>
        <span class="sd-player-nr">#${p.trikot_number}</span>
        <span class="sd-player-name">${esc(p.player_firstname)} ${esc(p.player_name)}</span>
        ${isMvp ? '<span class="sd-player-mvp" title="MVP">🏆</span>' : ''}
      </div>`;
    }).join('');

    // Alle anderen Spieler
    const others = (allPlayers || [])
      .filter(p => !startingNrs.has(p.trikot_number))
      .sort((a, b) => a.trikot_number - b.trikot_number);
    const otherRows = others.map(p => {
      const isMvp = mvps.has(p.trikot_number);
      return `<div class="sd-player-row">
        <span class="sd-player-nr">#${p.trikot_number}</span>
        <span class="sd-player-name">${esc(p.player_firstname)} ${esc(p.player_name)}</span>
        ${isMvp ? '<span class="sd-player-mvp" title="MVP">🏆</span>' : ''}
      </div>`;
    }).join('');

    return `
      ${startRows ? `<div class="sd-lineup-title">Startaufstellung</div>${startRows}` : ''}
      ${otherRows ? `<div class="sd-lineup-title" style="margin-top:10px">Weitere Spieler</div>${otherRows}` : ''}
    `;
  }

  // ── Schiedsrichter ──
  const refs = (g.nominated_referees || g.referees || []);
  const refStr = Array.isArray(refs) ? refs.join(' · ') : String(refs);

  // ── Datum formatieren ──
  const datumStr = g.date ? new Date(g.date).toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'}) : '';

  // ── VOD-Button ──
  const vodBtn = g.vod_link
    ? `<a href="${esc(g.vod_link)}" target="_blank" rel="noopener" class="sd-vod-btn">▶ VOD ansehen</a>`
    : '';

  return `
    <button class="sd-back-btn" onclick="zeigSpielplan()">← Spielplan</button>

    <!-- Score Hero -->
    <div class="glass sd-hero">
      <div class="sd-hero-team">
        <img class="sd-hero-logo" src="${esc(g.home_team_logo || '')}" alt="" onerror="this.style.display='none'">
        <div class="sd-hero-name" style="color:${CA}">${esc(g.home_team_name)}</div>
      </div>
      <div class="sd-hero-mid">
        <div class="sd-score">
          <span class="sd-score-num" style="color:${CA};text-shadow:0 0 40px rgba(74,222,128,.4)">${hg}</span>
          <span class="sd-score-sep">:</span>
          <span class="sd-score-num" style="color:${CB};text-shadow:0 0 40px rgba(251,146,60,.4)">${gg}</span>
        </div>
        ${postfix}
        <div class="sd-meta">
          ${datumStr}${g.game_day != null ? ` · Spieltag ${typeof g.game_day === 'object' ? (g.game_day.number ?? '') : g.game_day}` : ''}${g.arena_short ? ` · ${esc(g.arena_short)}` : ''}
          ${g.audience ? `<br>${g.audience} Zuschauer` : ''}
        </div>
        ${vodBtn}
        ${refStr ? `<div class="sd-refs">SR: ${esc(refStr)}</div>` : ''}
      </div>
      <div class="sd-hero-team">
        <img class="sd-hero-logo" src="${esc(g.guest_team_logo || '')}" alt="" onerror="this.style.display='none'">
        <div class="sd-hero-name" style="color:${CB}">${esc(g.guest_team_name)}</div>
      </div>
    </div>

    <!-- Drittel -->
    ${activePeriods.length ? `
    <div class="sd-section-title">Tore pro Drittel</div>
    <div class="glass" style="padding:12px 16px;margin-bottom:4px">
      <table class="sd-period-table">
        <thead><tr>
          <th></th>
          ${activePeriods.map(l => `<th>${esc(l)}</th>`).join('')}
          <th>Gesamt</th>
        </tr></thead>
        <tbody>${periodRows}</tbody>
      </table>
    </div>` : ''}

    <!-- Spielverlauf -->
    ${events.length ? `
    <div class="sd-section-title">Spielverlauf</div>
    <div class="glass" style="padding:10px 8px;margin-bottom:4px">
      <div class="sd-timeline">${timelineRows}</div>
    </div>` : ''}

    <!-- Strafen -->
    ${penalties.length ? `
    <div class="sd-section-title">Strafzeiten</div>
    <div class="glass" style="padding:14px 16px;margin-bottom:4px">
      <div class="sd-penalty-cols">
        <div>
          <div class="sd-penalty-col-title" style="color:${CA}">${esc(g.home_team_name)}</div>
          ${penRows(homePens, homePlayers, g.home_team_name)}
        </div>
        <div>
          <div class="sd-penalty-col-title" style="color:${CB}">${esc(g.guest_team_name)}</div>
          ${penRows(guestPens, guestPlayers, g.guest_team_name)}
        </div>
      </div>
    </div>` : ''}

    <!-- Kader -->
    <div class="sd-section-title">Kader &amp; Aufstellung</div>
    <div class="glass" style="padding:14px 16px;margin-bottom:4px">
      <div class="sd-roster-cols">
        <div>
          <div class="sd-roster-col-title" style="color:${CA}">${esc(g.home_team_name)}</div>
          ${rosterCol(g.starting_players?.home, g.players?.home, g.awards?.home, CA)}
        </div>
        <div>
          <div class="sd-roster-col-title" style="color:${CB}">${esc(g.guest_team_name)}</div>
          ${rosterCol(g.starting_players?.guest, g.players?.guest, g.awards?.guest, CB)}
        </div>
      </div>
    </div>
  `;
}

// ─────────────────────────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────────────────────────
ladeLigen();
</script>
</body>
</html>
