    const rosters = await fetchJSON('data/team_rosters.json');
    staticDaten.team_rosters = rosters;
    teamRostersGeladen = true;
    renderStaticAlltime();
  } catch(e) {
    document.getElementById('content-static').innerHTML =
      `<div class="error-box">team_rosters.json nicht erreichbar.<br><small>${e.message || e}</small></div>`;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// TAB 6: Team-Kader-Ansicht
// ─────────────────────────────────────────────────────────────────────────────
function renderStaticKader() {
  const el = document.getElementById('content-static');
  const rosters = staticDaten?.team_rosters;
  if (!rosters) {
    el.innerHTML = '<div class="error-box">team_rosters nicht in alltime.json vorhanden.<br><small>Bitte <b>python tools/alltime.py</b> neu ausführen.</small></div>';
    return;
  }

  // ── Team-Suche ────────────────────────────────────────────────────────────
  const teamNames = Object.keys(rosters).sort();
  const suche = staticKaderSuche.trim().toLowerCase();
  const gefilterte = suche
    ? teamNames.filter(n => n.toLowerCase().includes(suche))
    : teamNames;

  const hatAuswahl = staticKaderTeams.size > 0;

  // ── Spieler über alle gewählten Teams zusammenführen (merge by player_id) ─
  let kaderInfo = '';
  if (hatAuswahl) {
    const merged = new Map(); // player_id → merged stats
    const verbSet = new Set();

    for (const teamName of staticKaderTeams) {
      const roster = rosters[teamName] || [];
      for (const p of roster) {
        (p.verbaende || []).forEach(v => verbSet.add(v));
        if (!merged.has(p.player_id)) {
          merged.set(p.player_id, {
            player_id:    p.player_id,
            first_name:   p.first_name,
            last_name:    p.last_name,
            verbaende:    new Set(p.verbaende || []),
            spiele:       0, tore:  0, assists: 0,
            strafminuten: 0, p2:    0, p2and2:  0,
            p5:           0, p10:   0, ms:      0,
          });
        }
        const m = merged.get(p.player_id);
        m.first_name   = p.first_name || m.first_name;
        m.last_name    = p.last_name  || m.last_name;
        m.spiele       += p.spiele       || 0;
        m.tore         += p.tore         || 0;
        m.assists      += p.assists      || 0;
        m.strafminuten += p.strafminuten || 0;
        m.p2           += p.p2           || 0;
        m.p2and2       += p.p2and2       || 0;
        m.p5           += p.p5           || 0;
        m.p10          += p.p10          || 0;
        m.ms           += p.ms           || 0;
        (p.verbaende || []).forEach(v => m.verbaende.add(v));
      }
    }

    // punkte berechnen + Sets finalisieren
    const alle = [...merged.values()].map(m => ({
      ...m,
      verbaende: [...m.verbaende].sort(),
      punkte: m.tore + m.assists,
    }));

    const verbaende = [...verbSet].sort();

    // Verband-Filter
    let gefiltert = alle;
    if (staticKaderVerband !== 'alle') {
      gefiltert = alle.filter(p => p.verbaende.includes(staticKaderVerband));
    }

    // Sortieren
    gefiltert = [...gefiltert].sort((a, b) => {
      const sp = x => x.spiele || 1;
      if (staticKaderSort === 'pkt_sp') return b.punkte/sp(b) - a.punkte/sp(a);
      if (staticKaderSort === 'g_sp')   return b.tore/sp(b)   - a.tore/sp(a);
      if (staticKaderSort === 'a_sp')   return b.assists/sp(b) - a.assists/sp(a);
      if (staticKaderSort === 'pim_sp') return b.strafminuten/sp(b) - a.strafminuten/sp(a);
      return (b[staticKaderSort] || 0) - (a[staticKaderSort] || 0);
    });

    const gesamtKader = gefiltert.length;
    gefiltert = gefiltert.slice((staticKaderSeite - 1) * PAGE_SIZE, staticKaderSeite * PAGE_SIZE);

    const kHdr = (key, label, title='') =>
      `<th class="${staticKaderSort===key?'at-sort-active':''}" onclick="setStaticKaderSort('${key}')"${title?` title="${title}"`:''}>${label}</th>`;

    const colCount = 7 + (staticStrafenDetails ? 5 : 0) + (staticPerGame ? 4 : 0);
    const rosterZeilen = gefiltert.map((p, i) => {
      const name = `${p.first_name} ${p.last_name}`;
      const sp   = p.spiele || 1;
      const vb   = p.verbaende.join(', ') || '—';
      return `<tr>
        <td class="at-rank">${i+1}</td>
        <td class="at-name">${esc(name)}</td>
        <td class="at-team" title="${esc(vb)}">${esc(vb.length > 35 ? vb.slice(0,33)+'…' : vb)}</td>
        <td>${p.spiele}</td>
        <td>${p.tore}</td>
        <td>${p.assists}</td>
        <td class="at-pkt">${p.punkte}</td>
        ${staticStrafenDetails
          ? `<td>${p.p2||0}</td><td>${p.p2and2||0}</td><td>${p.p5||0}</td><td>${p.p10||0}</td><td>${p.ms||0}</td>`
          : ''}
        <td>${p.strafminuten}'</td>
        ${staticPerGame
          ? `<td>${(p.punkte/sp).toFixed(2)}</td><td>${(p.tore/sp).toFixed(2)}</td><td>${(p.assists/sp).toFixed(2)}</td><td>${(p.strafminuten/sp).toFixed(2)}'</td>`
          : ''}
      </tr>`;
    }).join('');

    const vHdr = (v) => {
      const lbl = v === 'alle' ? 'Alle Verbände' : v;
      return `<button class="filter-btn${staticKaderVerband===v?' active':''}" onclick="setStaticKaderVerband('${esc(v)}')">${esc(lbl)}</button>`;
    };
    const verbButtons = [vHdr('alle'), ...verbaende.map(vHdr)].join('');

    kaderInfo = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        ${verbButtons}
        <div class="alltime-sep"></div>
        <button class="filter-btn" id="kader-strafen-btn" onclick="toggleStrafenDetails('static')">Strafen Details</button>
        <button class="filter-btn" id="kader-pergame-btn" onclick="togglePerGame('static')">Pro Spiel</button>
      </div>
      <div class="glass">
        <table class="at-table">
          <thead><tr>
            <th>#</th>
            <th>Spieler</th>
            <th>Verbände</th>
            ${kHdr('spiele','Sp')}
            ${kHdr('tore','G')}
            ${kHdr('assists','A')}
            ${kHdr('punkte','Pkt')}
            ${staticStrafenDetails
              ? `${kHdr('p2',"2'","2-Minuten-Strafen")}${kHdr('p2and2','2+2','2+2-Minuten-Strafen')}${kHdr('p5',"5'","5-Minuten-Strafen")}${kHdr('p10',"10'","10-Minuten-Strafen")}${kHdr('ms','MS','Matchstrafen')}`
              : ''}
            ${kHdr('strafminuten','PIM')}
            ${staticPerGame
              ? `${kHdr('pkt_sp','Pkt/Sp','Punkte pro Spiel')}${kHdr('g_sp','G/Sp','Tore pro Spiel')}${kHdr('a_sp','A/Sp','Assists pro Spiel')}${kHdr('pim_sp','PIM/Sp','PIM pro Spiel')}`
              : ''}
          </tr></thead>
          <tbody>${rosterZeilen || `<tr><td colspan="${colCount}" style="text-align:center;padding:20px;color:rgba(255,255,255,.3)">Keine Einträge</td></tr>`}</tbody>
        </table>
      </div>
      ${paginierungsHTML(gesamtKader, staticKaderSeite, 'setStaticKaderSeite')}`;
  }

  // ── Titel: Teamnamen oder Anzahl ──────────────────────────────────────────
  const titelTeams = staticKaderTeams.size === 0
    ? ''
    : staticKaderTeams.size === 1
      ? '— ' + esc([...staticKaderTeams][0])
      : `— ${staticKaderTeams.size} Teams kombiniert`;

  // ── Ausgewählte Teams als Tags ────────────────────────────────────────────
  const auswahlTags = staticKaderTeams.size > 0
    ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">
        ${[...staticKaderTeams].map(n =>
          `<span class="kader-tag" onclick="waehleKaderTeam('${esc(n).replace(/'/g,"\\'")}')">
            ${esc(n)} <span class="kader-tag-x">✕</span>
          </span>`).join('')}
        <button class="filter-btn" style="font-size:.7rem;padding:3px 8px"
                onclick="staticKaderTeams.clear();staticKaderVerband='alle';renderStaticKader()">Alle abwählen</button>
       </div>`
    : '';

  // ── Liste ─────────────────────────────────────────────────────────────────
  const listeItems = gefilterte.map(n => {
    const sel = staticKaderTeams.has(n);
    return `<div class="kader-team-item${sel?' kader-team-selected':''}" onclick="waehleKaderTeam('${esc(n).replace(/'/g,"\\'")}')">
      <span class="kader-check">${sel ? '✓' : ''}</span>${esc(n)}
    </div>`;
  }).join('');

  // Focus-Zustand merken
  const hatteSearchFokus = document.activeElement?.id === 'kader-suche';

  el.innerHTML = `
  <div class="alltime-section">
    <div class="alltime-section-title">🏒 Team-Kader ${titelTeams}</div>
    <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">

      <!-- Linke Spalte: Team-Suche + Liste -->
      <div style="min-width:220px;max-width:280px;flex:0 0 250px">
        <input class="alltime-search" type="text" id="kader-suche"
               style="width:100%;box-sizing:border-box;margin-bottom:6px"
               placeholder="Team suchen…" value="${esc(staticKaderSuche)}"
               oninput="staticKaderSuche=this.value;renderStaticKader()">
        ${auswahlTags}
        <div class="glass" style="max-height:420px;overflow-y:auto;padding:4px 0">
          ${listeItems || '<div style="padding:10px;color:rgba(255,255,255,.3);font-size:.8rem">Keine Teams gefunden</div>'}
        </div>
      </div>

      <!-- Rechte Spalte: kombinierte Tabelle -->
      <div style="flex:1;min-width:300px">
        ${hatAuswahl
          ? kaderInfo
          : '<div style="color:rgba(255,255,255,.35);padding:20px 0;font-size:.85rem">← Ein oder mehrere Teams aus der Liste auswählen</div>'}
      </div>
    </div>
  </div>`;

  // Focus wiederherstellen
  if (hatteSearchFokus) {
    const inp = document.getElementById('kader-suche');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }

  // Toggle-Buttons syncen
  document.getElementById('kader-strafen-btn')?.classList.toggle('active', staticStrafenDetails);
  document.getElementById('kader-pergame-btn')?.classList.toggle('active', staticPerGame);
}

function waehleKaderTeam(name) {
  if (staticKaderTeams.has(name)) {
    staticKaderTeams.delete(name);
  } else {
    staticKaderTeams.add(name);
    staticKaderVerband = 'alle';
  }
  staticKaderSeite = 1;
  renderStaticKader();
}

function setStaticKaderVerband(v) {
  staticKaderVerband = v;
  staticKaderSeite = 1;
  renderStaticKader();
}

function setStaticKaderSort(key) {
  staticKaderSort = key;
  staticKaderSeite = 1;
  renderStaticKader();
}

function setDetailScorerSort(key) { detailScorerSort = key; renderDetail(); }
function toggleDetailStrafenDetails() { detailStrafenDetails = !detailStrafenDetails; renderDetail(); }
function toggleDetailPerGame() { detailPerGame = !detailPerGame; renderDetail(); }

// ─────────────────────────────────────────────────────────────────────────────
// Pagination-Setter
// ─────────────────────────────────────────────────────────────────────────────
function setAlltimeSpielerSeite(s) { alltimeSpielerSeite = s; renderAlltimeSpieler(); }
function setAlltimeTeamSeite(s)    { alltimeTeamSeite    = s; renderAlltimeTeams(); }
function setAlltimeKaderSeite(s)   { alltimeKaderSeite   = s; renderAlltimeKader(); }
function setStaticSpielerSeite(s)  { staticSpielerSeite  = s; renderStaticAlltime(); }
function setStaticTeamSeite(s)     { staticTeamSeite     = s; renderStaticAlltime(); }
function setStaticKaderSeite(s)    { staticKaderSeite    = s; renderStaticKader(); }

// ─────────────────────────────────────────────────────────────────────────────
// Spiel-Detail-Ansicht
// ─────────────────────────────────────────────────────────────────────────────

function zeigSpielplan() {
  document.getElementById('spielplan-liste').style.display = '';
  document.getElementById('spielplan-detail').style.display = 'none';
  // Wenn Detail aus Turnierbaum geöffnet wurde → zurück zum Turnierbaum
  if (vorherTab && vorherTab !== 'spielplan') {
    const ziel = vorherTab;
    vorherTab = null;
    zeigeTab(ziel);
  }
}

async function zeigSpielDetail(gameId) {
  // Tab merken, dann zum Spielplan wechseln (Detail lebt dort)
  vorherTab = aktiverTab;
  if (aktiverTab !== 'spielplan') zeigeTab('spielplan');
  document.getElementById('spielplan-liste').style.display = 'none';
  const detailEl = document.getElementById('spielplan-detail');
  const contentEl = document.getElementById('content-spiel-detail');
  detailEl.style.display = '';
  contentEl.innerHTML = '<div class="lade-info"><div class="spinner"></div><span>Lade Spieldaten…</span></div>';
  try {
    const g = await fetchJSON(`${API_BASE}/api/v2/games/${gameId}.json`);
    contentEl.innerHTML = renderSpielDetail(g);
  } catch(e) {
    contentEl.innerHTML = `<div class="error-box">Fehler beim Laden: ${e.message}</div>`;
  }
}

function renderSpielDetail(g) {
  const CA = 'var(--color-a)', CB = 'var(--color-b)';
  const r = g.result || {};
  const hg = r.home_goals ?? '–';
  const gg = r.guest_goals ?? '–';
  const postfix = r.postfix?.short ? `<div class="sd-score-postfix">${esc(r.postfix.short)}</div>` : '';

  // ── Drittel ──
  const hP = r.home_goals_period || [];
  const gP = r.guest_goals_period || [];
  const PERIOD_LABELS = ['1. Drittel','2. Drittel','3. Drittel','Verlängerung','Penaltyschießen'];
  const activePeriods = PERIOD_LABELS.filter((_, i) => hP[i] !== undefined || gP[i] !== undefined);
  const activePeriodIndices = PERIOD_LABELS.map((_, i) => i).filter(i => hP[i] !== undefined || gP[i] !== undefined);

  // ── Drittel-Balken-Vergleich ──
  const totalH = parseInt(hg) || 0;
  const totalG = parseInt(gg) || 0;
  // Alle Balken gegen denselben Maximalwert skalieren (höchste Gesamttorzahl)
  const globalMax = Math.max(totalH, totalG, 1);

  // Rahmenfarbe der Tore-pro-Drittel-Sektion: Gewinner bestimmt die Farbe
  const hatErgebnis = r.home_goals !== undefined && r.guest_goals !== undefined;
  let periodBorderStyle = '';
  if (hatErgebnis && (totalH > 0 || totalG > 0)) {
    if (totalH > totalG) {
      // Grünes Team (Heim, links) gewinnt
      periodBorderStyle = 'border-color:rgba(74,222,128,.45);box-shadow:0 0 22px rgba(74,222,128,.18),inset 0 0 0 0.5px rgba(74,222,128,.10)';
    } else if (totalG > totalH) {
      // Oranges Team (Gast, rechts) gewinnt
      periodBorderStyle = 'border-color:rgba(251,146,60,.40);box-shadow:0 0 22px rgba(251,146,60,.16),inset 0 0 0 0.5px rgba(251,146,60,.08)';
    } else {
      // Unentschieden → neutrales Weiß
      periodBorderStyle = 'border-color:rgba(255,255,255,.22);box-shadow:0 0 18px rgba(255,255,255,.05),inset 0 0 0 0.5px rgba(255,255,255,.08)';
    }
  }

  function statRow(h, ga, label, colH, colG, delay, isTotal) {
    const hw = Math.round(h  / globalMax * 100);
    const gw = Math.round(ga / globalMax * 100);
    const glowH = 'rgba(74,222,128,.35)';
    const glowG = 'rgba(251,146,60,.35)';
    return `<div class="sd-stat-row${isTotal ? ' sd-stat-total' : ''}">
      <div class="sd-stat-left">
        <span class="sd-stat-val" style="color:${colH}">${h}</span>
        <div class="sd-stat-bar-wrap">
          <div class="sd-stat-bar sd-stat-bar-home"
            style="width:${hw}%;background:${colH};box-shadow:0 0 8px ${glowH};animation-delay:${delay}s"></div>
        </div>
      </div>
      <div class="sd-stat-label">${label}</div>
      <div class="sd-stat-right">
        <div class="sd-stat-bar-wrap">
          <div class="sd-stat-bar sd-stat-bar-guest"
            style="width:${gw}%;background:${colG};box-shadow:0 0 8px ${glowG};animation-delay:${delay}s"></div>
        </div>
        <span class="sd-stat-val" style="color:${colG}">${ga}</span>
      </div>
    </div>`;
  }

  const periodTableHTML = activePeriods.length ? `
    <div class="sd-period-header">
      <div class="sd-period-header-home" style="color:${CA}">${esc(g.home_team_name)}</div>
      <div class="sd-period-header-mid"></div>
      <div class="sd-period-header-guest" style="color:${CB}">${esc(g.guest_team_name)}</div>
    </div>
    ${activePeriodIndices.map((idx, n) =>
      statRow(hP[idx] ?? 0, gP[idx] ?? 0,
              PERIOD_LABELS[idx].replace('. Drittel', '. D.').replace('Penaltyschießen','Penalties'),
              CA, CB, 0.08 * (n + 1), false)
    ).join('')}
    ${statRow(totalH, totalG, 'Gesamt', CA, CB,
              0.08 * (activePeriodIndices.length + 1), true)}
  ` : '';

  // ── Events: Timeline ──
  const events = (g.events || []).slice().sort((a, b) => a.sortkey > b.sortkey ? 1 : -1);

  function penaltyClass(penType) {
    if (!penType) return 'sd-ptype-2';
    if (penType === 'penalty_2') return 'sd-ptype-2';
    if (['penalty_2and2','penalty_5','penalty_10'].includes(penType)) return 'sd-ptype-mid';
    return 'sd-ptype-ms'; // penalty_match, penalty_ms_*
  }
  function penaltyIcon(penType) {
    if (!penType) return '🟨';
    if (penType === 'penalty_2') return '🟨';
    if (['penalty_2and2','penalty_5','penalty_10'].includes(penType)) return '🟧';
    return '🟥';
  }

  // Spieler-Lookup: trikot_number → name (für Assists)
  const homePlayers = {};
  const guestPlayers = {};
  (g.players?.home || []).forEach(p => { homePlayers[p.trikot_number] = `${p.player_firstname} ${p.player_name}`; });
  (g.players?.guest || []).forEach(p => { guestPlayers[p.trikot_number] = `${p.player_firstname} ${p.player_name}`; });

  // Straftyp-Fallback wenn penalty_type_string fehlt
  const PEN_LABEL = {
    penalty_2:     '2 Minuten',
    penalty_2and2: '2+2 Minuten',
    penalty_5:     '5 Minuten',
    penalty_10:    '10 Minuten',
    penalty_match: 'Matchstrafe',
    penalty_ms_tech: 'Matchstrafe (techn.)',
    penalty_ms_full: 'Matchstrafe (voll)',
    penalty_ms1:   'Matchstrafe 1',
    penalty_ms2:   'Matchstrafe 2',
  };

  // ── Vertikaler Zeitstrahl: Events nach Drittel gruppieren ──
  const PERIOD_NAMES = { 1: '1. Drittel', 2: '2. Drittel', 3: '3. Drittel', 4: 'Verlängerung', 5: 'Penaltyschießen' };
  const byPeriod = {};
  events.forEach(e => {
    const p = e.period ?? 1;
    if (!byPeriod[p]) byPeriod[p] = [];
    byPeriod[p].push(e);
  });
  const periodNums = Object.keys(byPeriod).map(Number).sort((a, b) => a - b);

  function buildVtlRow(e) {
    const isHome = e.event_team === 'home';
    const playerLookup = isHome ? homePlayers : guestPlayers;
    const teamLabel = isHome ? g.home_team_name : g.guest_team_name;
    const col = isHome ? 'var(--color-a)' : 'var(--color-b)';
    const hasNumber = e.number != null && e.number !== '';
    const playerName = hasNumber ? (playerLookup[e.number] || '') : '';

    let icon, nameStr, subStr = '', scoreStr = '';
    if (e.event_type === 'goal') {
      icon = '⚽';
      nameStr = hasNumber ? `#${e.number}${playerName ? ' ' + esc(playerName) : ''}` : esc(teamLabel);
      const assistName = e.assist ? (playerLookup[e.assist] || '') : null;
      subStr = assistName ? `Assist: #${e.assist} ${esc(assistName)}` : (e.goal_type_string || '');
      scoreStr = `${e.home_goals}:${e.guest_goals}`;
    } else if (e.event_type === 'timeout') {
      icon = '⏱';
      nameStr = esc(teamLabel);
      subStr = 'Timeout';
    } else {
      icon = penaltyIcon(e.penalty_type);
      nameStr = hasNumber ? `#${e.number}${playerName ? ' ' + esc(playerName) : ''}` : esc(teamLabel);
      const penTypeStr = e.penalty_type_string || PEN_LABEL[e.penalty_type] || '';
      subStr = [penTypeStr, e.penalty_reason_string].filter(Boolean).join(' · ');
      if (!hasNumber && !subStr) subStr = 'Bankstrafe';
    }

    const content = `
      <div class="sd-vtl-event-name">${icon} ${nameStr}</div>
      ${subStr ? `<div class="sd-vtl-event-sub">${esc(subStr)}</div>` : ''}
      <div class="sd-vtl-event-time">${esc(e.time || '')}</div>`;

    const homeSide  = isHome  ? `<div class="sd-vtl-home-side">${content}</div>` : `<div></div>`;
    const guestSide = !isHome ? `<div class="sd-vtl-guest-side">${content}</div>` : `<div></div>`;

    return `<div class="sd-vtl-row">
      ${homeSide}
      <div class="sd-vtl-center">
        <div class="sd-vtl-dot" style="background:${col};color:${col}"></div>
        ${scoreStr ? `<div class="sd-vtl-score">${scoreStr}</div>` : ''}
      </div>
      ${guestSide}
    </div>`;
  }

  let vtlHTML = '<div class="sd-vtl">';
  periodNums.forEach(p => {
    vtlHTML += `<div class="sd-vtl-period-sep"><span class="sd-vtl-period-name">${PERIOD_NAMES[p] || 'Periode ' + p}</span></div>`;
    vtlHTML += byPeriod[p].map(buildVtlRow).join('');
  });
  vtlHTML += '</div>';

  // ── Tore-Übersicht ──
  const goals = events.filter(e => e.event_type === 'goal');
  const homeGoals  = goals.filter(e => e.event_team === 'home');
  const guestGoals = goals.filter(e => e.event_team === 'guest');

  function goalRows(gs, playerLookup) {
    if (!gs.length) return '<div style="color:rgba(255,255,255,.25);font-size:.72rem;padding:6px 0">Keine Tore</div>';
    return gs.map(e => {
      const hasNr    = e.number != null && e.number !== '';
      const scorer   = hasNr ? (playerLookup[e.number] || '') : '';
      const scorerLabel = hasNr ? `#${e.number}${scorer ? ' ' + esc(scorer) : ''}` : '–';
      const assistName  = e.assist ? (playerLookup[e.assist] || '') : null;
      const assistLabel = assistName !== null
        ? `#${e.assist}${assistName ? ' ' + esc(assistName) : ''}`
        : null;
      const typeLabel = e.goal_type_string || '';
      return `<div class="sd-penalty-row">
        <span class="sd-penalty-time">P${e.period} ${esc(e.time)}</span>
        <span class="sd-goal-score">${e.home_goals}:${e.guest_goals}</span>
        <div>
          <span class="sd-penalty-player">${scorerLabel}</span>
          ${assistLabel ? `<div class="sd-penalty-reason">Assist: ${assistLabel}</div>` : ''}
          ${typeLabel   ? `<div class="sd-penalty-reason">${esc(typeLabel)}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  // ── Strafen-Übersicht ──
  const penalties = events.filter(e => e.event_type === 'penalty');
  const homePens = penalties.filter(e => e.event_team === 'home');
  const guestPens = penalties.filter(e => e.event_team === 'guest');

  function penRows(pens, playerLookup, teamName) {
    if (!pens.length) return '<div style="color:rgba(255,255,255,.25);font-size:.72rem;padding:6px 0">Keine Strafen</div>';
    return pens.map(e => {
      const hasNr = e.number != null && e.number !== '';
      const lookedUp = hasNr ? (playerLookup[e.number] || '') : '';
      const playerLabel = hasNr ? `#${e.number}${lookedUp ? ' ' + esc(lookedUp) : ''}` : esc(teamName || '–');
      const cls = penaltyClass(e.penalty_type);
      return `<div class="sd-penalty-row">
        <span class="sd-penalty-time">P${e.period} ${esc(e.time)}</span>
        <span class="sd-penalty-type ${cls}">${esc(e.penalty_type_string || PEN_LABEL[e.penalty_type] || '?')}</span>
        <div>
          <span class="sd-penalty-player">${playerLabel}</span>
          ${e.penalty_reason_string ? `<div class="sd-penalty-reason">${esc(e.penalty_reason_string)}</div>` : (!hasNr ? '<div class="sd-penalty-reason">Bankstrafe</div>' : '')}
        </div>
      </div>`;
    }).join('');
  }

  // ── Kader & Aufstellung ──
  const posLabels = {
    goal: 'Torwart', defender1: 'Verteidiger 1', defender2: 'Verteidiger 2',
    center: 'Center', forward1: 'Flügel 1', forward2: 'Flügel 2'
  };
  const posAbbr = {
    goal: 'TW', defender1: 'V1', defender2: 'V2',
    center: 'C', forward1: 'F1', forward2: 'F2'
  };
  const posOrder = ['goal','defender1','defender2','center','forward1','forward2'];

  function mvpSet(awards) {
    const s = new Set();
    (awards || []).forEach(a => { if (a.award === 'mvp') s.add(a.trikot_number); });
    return s;
  }

  function rosterCol(startingPlayers, allPlayers, awards, teamColor) {
    const mvps = mvpSet(awards);
    const startingNrs = new Set((startingPlayers || []).map(p => p.trikot_number));

    // Startaufstellung nach posOrder
    const startMap = {};
    (startingPlayers || []).forEach(p => { startMap[p.position] = p; });
    const startRows = posOrder.map(pos => {
      const p = startMap[pos];
      if (!p) return '';
      const isMvp = mvps.has(p.trikot_number);
      return `<div class="sd-player-row sd-starter-row">
        <span class="sd-pos-label"><span class="pos-long">${posLabels[pos]}</span><span class="pos-abbr">${posAbbr[pos]}</span></span>
        <span class="sd-player-nr">#${p.trikot_number}</span>
        <span class="sd-player-name">${esc(p.player_firstname)} ${esc(p.player_name)}</span>
        ${isMvp ? '<span class="sd-player-mvp" title="MVP">🏆</span>' : ''}
      </div>`;
    }).join('');

    // Alle anderen Spieler
    const others = (allPlayers || [])
      .filter(p => !startingNrs.has(p.trikot_number))
      .sort((a, b) => a.trikot_number - b.trikot_number);
    const otherRows = others.map(p => {
      const isMvp = mvps.has(p.trikot_number);
      return `<div class="sd-player-row">
        <span class="sd-player-nr">#${p.trikot_number}</span>
        <span class="sd-player-name">${esc(p.player_firstname)} ${esc(p.player_name)}</span>
        ${isMvp ? '<span class="sd-player-mvp" title="MVP">🏆</span>' : ''}
      </div>`;
    }).join('');

    return `
      ${startRows ? `<div class="sd-lineup-title">Startaufstellung</div>${startRows}` : ''}
      ${otherRows ? `<div class="sd-lineup-title" style="margin-top:10px">Weitere Spieler</div>${otherRows}` : ''}
    `;
  }

  // ── Schiedsrichter ──
  const refs = (g.nominated_referees || g.referees || []);
  const refStr = Array.isArray(refs) ? refs.join(' / ') : (refs ? String(refs) : '');

  // ── Datum formatieren ──
  const datumStr = g.date ? new Date(g.date).toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'}) : '';

  // ── Spielinfos ──
  const gameDay = g.game_day != null
    ? (typeof g.game_day === 'object' ? (g.game_day.number ?? '') : g.game_day)
    : null;
  const infoRows = [
    g.league_name                    && ['Liga',           esc(g.league_name)],
    g.game_number                    && ['Spielnummer',    esc(g.game_number)],
    g.date                           && ['Datum',          datumStr.replace(/^\w+, /, '')],  // ohne Wochentag
    g.start_time                     && ['Spielbeginn',    esc(g.start_time) + ' Uhr'],
    (g.arena || g.arena_short)       && ['Halle',          esc(g.arena || g.arena_short)],
    g.arena_address                  && ['Adresse',        esc(g.arena_address)],
    g.audience                       && ['Zuschauer',      esc(g.audience)],
    gameDay                          && ['Spieltag',       esc(gameDay)],
    refStr                           && ['Schiedsrichter', esc(refStr)],
  ].filter(Boolean);

  const infoTableHTML = infoRows.length ? `
    <table class="sd-info-table">
      ${infoRows.map(([label, val]) => `
        <tr>
          <td class="sd-info-label">${label}</td>
          <td class="sd-info-value">${val}</td>
        </tr>`).join('')}
    </table>` : '';

  // ── Live-Status ──
  const isGameLive = g.started === true && !(g.ended === true);
  const liveBadgeSD = isGameLive
    ? `<div class="sd-live-badge"><span class="live-dot"></span> LIVE</div>`
    : '';

  // ── Stream-Button (nur wenn live oder noch nicht gespielt) ──
  const streamBtnSD = g.live_stream_link
    ? `<a href="${esc(g.live_stream_link)}" target="_blank" rel="noopener" class="stream-btn" style="margin-top:4px">▶ Live ansehen</a>`
    : '';

  // ── VOD-Button ──
  const vodBtn = g.vod_link
    ? `<a href="${esc(g.vod_link)}" target="_blank" rel="noopener" class="sd-vod-btn">▶ VOD ansehen</a>`
    : '';

  return `
    <button class="sd-back-btn" onclick="zeigSpielplan()">← ${vorherTab === 'tabelle' ? (getSpielplanModus() !== 'liga' ? 'Turnierbaum' : 'Tabelle') : 'Spielplan'}</button>

    <!-- Score Hero -->
    <div class="sd-hero">
      <div class="sd-hero-team">
        <img class="sd-hero-logo" src="${esc(g.home_team_logo || '')}" alt="" onerror="this.style.display='none'">
        <div class="sd-hero-name" style="color:${CA}">${esc(g.home_team_name)}</div>
      </div>
      <div class="sd-hero-mid">
        <div class="sd-score">
          <span class="sd-score-num" style="color:${CA};text-shadow:0 0 40px rgba(74,222,128,.4)">${hg}</span>
          <span class="sd-score-sep">:</span>
          <span class="sd-score-num" style="color:${CB};text-shadow:0 0 40px rgba(251,146,60,.4)">${gg}</span>
        </div>
        ${postfix}
        ${liveBadgeSD}
        <div class="sd-meta">
          ${datumStr}${g.game_day != null ? ` · Spieltag ${typeof g.game_day === 'object' ? (g.game_day.number ?? '') : g.game_day}` : ''}${g.arena_short ? ` · ${esc(g.arena_short)}` : ''}
          ${g.audience ? `<br>${g.audience} Zuschauer` : ''}
        </div>
        ${streamBtnSD}
        ${vodBtn}
        ${refStr ? `<div class="sd-refs">SR: ${esc(refStr)}</div>` : ''}
      </div>
      <div class="sd-hero-team">
        <img class="sd-hero-logo" src="${esc(g.guest_team_logo || '')}" alt="" onerror="this.style.display='none'">
        <div class="sd-hero-name" style="color:${CB}">${esc(g.guest_team_name)}</div>
      </div>
    </div>

    <!-- Drittel -->
    ${periodTableHTML ? `
    <div class="sd-section-title">Tore pro Drittel</div>
    <div class="sd-period-wrap"${periodBorderStyle ? ` style="${periodBorderStyle}"` : ''}>
      ${periodTableHTML}
    </div>` : ''}

    <!-- Spielverlauf -->
    ${events.length ? `
    <div class="sd-section-title">Spielverlauf</div>
    <div class="glass" style="padding:10px 8px;margin-bottom:4px">
      ${vtlHTML}
    </div>` : ''}

    <!-- Tore & Assists -->
    ${goals.length ? `
    <div class="sd-section-title">Tore &amp; Assists</div>
    <div class="glass" style="padding:14px 16px;margin-bottom:4px">
      <div class="sd-penalty-cols">
        <div>
          <div class="sd-penalty-col-title" style="color:${CA}">${esc(g.home_team_name)}</div>
          ${goalRows(homeGoals, homePlayers)}
        </div>
        <div>
          <div class="sd-penalty-col-title" style="color:${CB}">${esc(g.guest_team_name)}</div>
          ${goalRows(guestGoals, guestPlayers)}
        </div>
      </div>
    </div>` : ''}

    <!-- Strafen -->
    ${penalties.length ? `
    <div class="sd-section-title">Strafzeiten</div>
    <div class="glass" style="padding:14px 16px;margin-bottom:4px">
      <div class="sd-penalty-cols">
        <div>
          <div class="sd-penalty-col-title" style="color:${CA}">${esc(g.home_team_name)}</div>
          ${penRows(homePens, homePlayers, g.home_team_name)}
        </div>
        <div>
          <div class="sd-penalty-col-title" style="color:${CB}">${esc(g.guest_team_name)}</div>
          ${penRows(guestPens, guestPlayers, g.guest_team_name)}
        </div>
      </div>
    </div>` : ''}

    <!-- Kader -->
    <div class="sd-section-title">Kader &amp; Aufstellung</div>
    <div class="glass" style="padding:14px 16px;margin-bottom:4px">
      <div class="sd-roster-cols">
        <div>
          <div class="sd-roster-col-title" style="color:${CA}">${esc(g.home_team_name)}</div>
          ${rosterCol(g.starting_players?.home, g.players?.home, g.awards?.home, CA)}
        </div>
        <div>
          <div class="sd-roster-col-title" style="color:${CB}">${esc(g.guest_team_name)}</div>
          ${rosterCol(g.starting_players?.guest, g.players?.guest, g.awards?.guest, CB)}
        </div>
      </div>
    </div>

    <!-- Spielinfos -->
    ${infoTableHTML ? `
    <div class="sd-section-title">Spielinfos</div>
    <div class="glass" style="padding:12px 16px;margin-bottom:4px">
      ${infoTableHTML}
    </div>` : ''}
  `;
}

function ladeOverviewSettings() {
  try {
    const s = localStorage.getItem('fiq-overview-settings');
    if (s) overviewSettings = { verbandFilter: [], meinTeam: null, ...JSON.parse(s) };
  } catch {}
}

function speichereOverviewSettings() {
  localStorage.setItem('fiq-overview-settings', JSON.stringify(overviewSettings));
}

async function ladeOverview() {
  if (overviewGeladen) { renderOverview(); return; }
  const el = document.getElementById('content-overview');
  if (!el) return;

  // Warten bis alleligen durch ladeLigen() befüllt wurden
  if (!alleligen.length) {
    el.innerHTML = '<div class="lade-info"><div class="spinner"></div><span>Warte auf Liga-Daten…</span></div>';
    await new Promise(resolve => {
      const check = setInterval(() => { if (alleligen.length) { clearInterval(check); resolve(); } }, 200);
    });
  }

  // Nur Ligen der aktuellen Saison (höchste season-Nummer)
  const maxSeason = Math.max(...alleligen.map(l => parseInt(l.season) || 0));
  const aktuelleligen = alleligen.filter(l => parseInt(l.season) === maxSeason);

  let fertig = 0;
  const total = aktuelleligen.length;
  el.innerHTML = `<div class="lade-info"><div class="spinner"></div><span id="ov-progress">Lade Spielpläne 0/${total}…</span></div>`;

  const promises = aktuelleligen.map(l =>
    fetchJSON(`${API_BASE}/api/v2/leagues/${l.id}/schedule.json`)
      .then(spiele => {
        fertig++;
        const prog = document.getElementById('ov-progress');
        if (prog) prog.textContent = `Lade Spielpläne ${fertig}/${total}…`;
        return { liga: l, spiele: Array.isArray(spiele) ? spiele : [] };
      })
      .catch(() => { fertig++; return null; })
  );

  overviewDaten = (await Promise.all(promises)).filter(Boolean);
  overviewGeladen = true;
  renderOverview();
}

// Datum YYYY-MM-DD → "Sa, 19. April"
function formatDatumLang(dateStr) {
  if (!dateStr) return '–';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'long' });
}

// Spiele-Array → {datum: [spiel, ...]}  (Reihenfolge bleibt erhalten)
function gruppiereNachDatum(spiele) {
  const g = {};
  spiele.forEach(s => {
    const d = s.date || '?';
    if (!g[d]) g[d] = [];
    g[d].push(s);
  });
  return g;
}

// Einzelne Spiel-Karte als HTML-String
function ovKarte(s, gepinnt) {
  const live = s.started && !s.ended;
  const verg = !!s.ended;
  const hLogo = logoUrl(s.home_team_logo_small || s.home_team_logo);
  const gLogo = logoUrl(s.guest_team_logo_small || s.guest_team_logo);
  const hLogoEl = hLogo
    ? `<img src="${hLogo}" class="ov-karte-logo" onerror="this.style.display='none'" alt="">`
    : `<div class="ov-karte-logo-ph"></div>`;
  const gLogoEl = gLogo
    ? `<img src="${gLogo}" class="ov-karte-logo" onerror="this.style.display='none'" alt="">`
    : `<div class="ov-karte-logo-ph"></div>`;

  let scoreHtml;
  if (live) {
    scoreHtml = `<div class="ov-karte-score live">
      <span class="live-badge" style="font-size:.58rem;padding:2px 6px"><span class="live-dot" style="width:5px;height:5px"></span>LIVE</span>
      <span>${s.result?.home_goals ?? '?'}:${s.result?.guest_goals ?? '?'}</span>
    </div>`;
  } else if (verg && s.result) {
    scoreHtml = `<div class="ov-karte-score played">${s.result.home_goals}:${s.result.guest_goals}</div>`;
  } else {
    const uhr = verg ? '–' : (s.time || '–');
    scoreHtml = `<div class="ov-karte-score future">${verg ? '–:–' : uhr}</div>`;
  }

  const datumStr = (verg || live) ? '' : `<div class="ov-karte-datum">${formatDatum(s.date)}</div>`;
  const gepinntLabel = gepinnt ? `<div class="ov-pinned-label">⭐ Mein Team</div>` : '';
  const liveCls   = live    ? ' ov-karte-live'   : '';
  const pinnedCls = gepinnt ? ' ov-karte-pinned' : '';

  return `<div class="ov-karte${liveCls}${pinnedCls}" onclick="zeigSpielDetail(${s.game_id})">
    ${gepinntLabel}
    <div class="ov-karte-team">${hLogoEl}<span class="ov-karte-name">${esc(s.home_team_name)}</span></div>
    ${scoreHtml}
    <div class="ov-karte-team">${gLogoEl}<span class="ov-karte-name">${esc(s.guest_team_name)}</span></div>
    ${datumStr}
    <div class="ov-karte-liga">${esc(s._liga?.name || '')}</div>
  </div>`;
}

// Top-5-Tabelle für die Sidebar (nutzt die aktuell geladene Ligatabelle)
function bautSidebarTabelle() {
  if (!tabelle || !tabelle.length) return '<div class="ov-leer">Keine Tabellendaten.</div>';
  const top5 = [...tabelle].sort((a, b) => a.position - b.position).slice(0, 5);
  const rows = top5.map(t => {
    const logo = logoUrl(t.team_logo_small || t.team_logo);
    const logoEl = logo
      ? `<img src="${logo}" style="width:15px;height:15px;object-fit:contain;border-radius:2px;margin-right:5px;vertical-align:middle" onerror="this.style.display='none'" alt="">`
      : '';
    const posCls = t.position === 1 ? 'pos-1' : t.position === 2 ? 'pos-2' : t.position === 3 ? 'pos-3' : '';
    return `<tr onclick="zeigeTeamDetail(${t.team_id})" style="cursor:pointer">
      <td style="padding:6px 4px;text-align:center"><span class="t-pos ${posCls}" style="font-size:.7rem">${t.position}</span></td>
      <td style="padding:6px 4px;font-size:.74rem;font-weight:500">${logoEl}${esc(t.team_name)}</td>
      <td style="padding:6px 4px;text-align:right;font-weight:800;font-size:.78rem">${t.points}</td>
    </tr>`;
  }).join('');
  const ligaName = alleligen.find(l => l.id === aktiveLigaId)?.name || '';
  return `<div style="font-size:.62rem;color:rgba(255,255,255,.28);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">${esc(ligaName)}</div>
    <table style="width:100%;border-collapse:collapse"><tbody>${rows}</tbody></table>
    <button class="ov-alle-btn" style="margin-top:8px;display:block" onclick="zeigeTab('tabelle')">Vollständige Tabelle →</button>`;
}

function renderOverview() {
  const el = document.getElementById('content-overview');
  if (!el) return;
  ladeOverviewSettings();

  const heute = new Date().toISOString().slice(0, 10);

  // Verbands-Filter anwenden
  const versteckt = new Set(overviewSettings.verbandFilter || []);
  const gefiltert = overviewDaten.filter(d => !versteckt.has(d.liga.game_operation));

  // Alle Spiele flach, mit Liga als _liga-Property
  const alleSpiele = gefiltert.flatMap(({liga, spiele}) =>
    spiele.map(s => ({ ...s, _liga: liga }))
  );

  const istLive  = s => !!s.started && !s.ended;
  const meinTeam = overviewSettings.meinTeam || null;

  // ── Block 1: Live & Heute ──
  const seenIds = new Set();
  const block1 = [];

  // Gepinnte Team-Spiele zuerst (zukünftig, noch nicht heute)
  if (meinTeam) {
    alleSpiele
      .filter(s => !s.ended && s.date > heute &&
        (s.home_team_name === meinTeam || s.guest_team_name === meinTeam))
      .sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1)
      .slice(0, 3)
      .forEach(s => { seenIds.add(s.game_id); block1.push({ s, gepinnt: true }); });
  }
  // Live + Heute (dedup)
  alleSpiele
    .filter(s => istLive(s) || s.date === heute)
    .sort((a, b) => {
      if (istLive(a) && !istLive(b)) return -1;
      if (!istLive(a) && istLive(b)) return 1;
      return (a.time || '') < (b.time || '') ? -1 : 1;
    })
    .forEach(s => {
      if (seenIds.has(s.game_id)) return;
      seenIds.add(s.game_id);
      block1.push({ s, gepinnt: false });
    });

  // ── Block 2: Alle kommenden Spiele, aufsteigend ──
  const naechsteAll = alleSpiele
    .filter(s => s.date > heute && !s.ended && !istLive(s))
    .sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1);
  const naechste5 = naechsteAll.slice(0, 5);
  const naechsteGruppen = gruppiereNachDatum(naechsteAll);

  // ── Block 3: Alle vergangenen Spiele, neueste zuerst ──
  const letzteAll = alleSpiele
    .filter(s => !!s.ended)
    .sort((a, b) => (a.date || '') > (b.date || '') ? -1 : 1);
  const letzte5 = letzteAll.slice(0, 5);
  const letzteGruppen = gruppiereNachDatum(letzteAll); // neueste zuerst (Einfüge-Reihenfolge)

  // ── Block 4: Nach Verband ──
  const verbände = [...new Set(gefiltert.map(d => d.liga.game_operation))];
  verbände.sort((a, b) => {
    if (a === 'Floorball Deutschland') return -1;
    if (b === 'Floorball Deutschland') return 1;
    return a.localeCompare(b, 'de');
  });

  // ── HTML zusammenbauen ──
  const settingsBtn = `<button class="ov-settings-btn" onclick="toggleOverviewSettings()" title="Einstellungen">⚙</button>`;

  let html = `<div class="ov-layout"><div class="ov-main">`;

  // Block 1: Live & Heute
  html += `<div class="ov-block">
    <div class="ov-block-header">
      <span class="ov-block-title">🔴 Live &amp; Heute${meinTeam ? ' · ⭐ ' + esc(meinTeam) : ''}</span>
      ${settingsBtn}
    </div>`;
  if (block1.length) {
    html += `<div class="ov-scroll-row">`;
    block1.forEach(({s, gepinnt}) => { html += ovKarte(s, gepinnt); });
    html += `</div>`;
  } else {
    html += `<div class="ov-leer">Keine Spiele heute.</div>`;
  }
  html += `</div>`;

  // Block 2 + 3 nebeneinander (Desktop: 2 Spalten, Mobile: gestackt)
  html += `<div class="ov-b2b3-grid">`;

  // Block 2: Nächste Spiele
  html += `<div class="ov-block">
    <div class="ov-block-header"><span class="ov-block-title">Nächste Spiele</span></div>`;
  if (naechste5.length) {
    // Preview: 5 Karten
    html += `<div id="ov-b2-preview">
      <div class="ov-scroll-row">`;
    naechste5.forEach(s => { html += ovKarte(s, false); });
    html += `</div>`;
    if (naechsteAll.length > 5) {
      html += `<button class="ov-mehr-btn" onclick="ovToggleMehr('ov-b2-preview','ov-b2-full')">Mehr anzeigen →</button>`;
    }
    html += `</div>`; // preview
    // Full: alle, gruppiert nach Datum
    if (naechsteAll.length > 5) {
      html += `<div id="ov-b2-full" style="display:none">`;
      Object.entries(naechsteGruppen).forEach(([datum, spiele]) => {
        html += `<div class="ov-datum-header">${formatDatumLang(datum)}</div><div class="ov-scroll-row">`;
        spiele.forEach(s => { html += ovKarte(s, false); });
        html += `</div>`;
      });
      html += `<button class="ov-mehr-btn" onclick="ovToggleMehr('ov-b2-preview','ov-b2-full')">← Weniger</button>
      </div>`; // full
    }
  } else {
    html += `<div class="ov-leer">Keine weiteren Spiele angesetzt.</div>`;
  }
  html += `</div>`; // ov-block naechste

  // Block 3: Zuletzt gespielt
  html += `<div class="ov-block">
    <div class="ov-block-header"><span class="ov-block-title">Zuletzt gespielt</span></div>`;
  if (letzte5.length) {
    // Preview: 5 Karten
    html += `<div id="ov-b3-preview">
      <div class="ov-scroll-row">`;
    letzte5.forEach(s => { html += ovKarte(s, false); });
    html += `</div>`;
    if (letzteAll.length > 5) {
      html += `<button class="ov-mehr-btn" onclick="ovToggleMehr('ov-b3-preview','ov-b3-full')">Mehr anzeigen →</button>`;
    }
    html += `</div>`; // preview
    // Full: alle, gruppiert nach Datum (neueste zuerst)
    if (letzteAll.length > 5) {
      html += `<div id="ov-b3-full" style="display:none">`;
      Object.entries(letzteGruppen).forEach(([datum, spiele]) => {
        html += `<div class="ov-datum-header">${formatDatumLang(datum)}</div><div class="ov-scroll-row">`;
        spiele.forEach(s => { html += ovKarte(s, false); });
        html += `</div>`;
      });
      html += `<button class="ov-mehr-btn" onclick="ovToggleMehr('ov-b3-preview','ov-b3-full')">← Weniger</button>
      </div>`; // full
    }
  } else {
    html += `<div class="ov-leer">Keine Ergebnisse vorhanden.</div>`;
  }
  html += `</div>`; // ov-block letzte

  html += `</div>`; // ov-b2b3-grid

  // Block 4: Nach Verband (je 2 Spalten: Nächste + Letzte)
  verbände.forEach((vb, vbIdx) => {
    const vbId = 'vb' + vbIdx;
    const vbSpiele = gefiltert
      .filter(d => d.liga.game_operation === vb)
      .flatMap(d => d.spiele.map(s => ({ ...s, _liga: d.liga })));

    const vbNextAll = vbSpiele
      .filter(s => s.date >= heute && !s.ended)
      .sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1);
    const vbLastAll = vbSpiele
      .filter(s => !!s.ended)
      .sort((a, b) => (a.date || '') > (b.date || '') ? -1 : 1);
    const vbNext5 = vbNextAll.slice(0, 5);
    const vbLast5 = vbLastAll.slice(0, 5);

    // Verband überspringen wenn komplett leer
    if (!vbNext5.length && !vbLast5.length) return;

    html += `<div class="ov-block">
      <div class="ov-block-header">
        <span class="ov-block-title">${esc(vb)}</span>
        <button class="ov-alle-btn" onclick="zeigeTab('spielplan')">Alle →</button>
      </div>
      <div class="ov-vb-cols">`;

    // Linke Spalte: Nächste Spiele
    html += `<div class="ov-vb-col">
      <div class="ov-vb-col-title">Nächste Spiele</div>`;
    if (vbNext5.length) {
      html += `<div id="${vbId}-np">
        <div class="ov-scroll-row">`;
      vbNext5.forEach(s => { html += ovKarte(s, false); });
      html += `</div>`;
      if (vbNextAll.length > 5) {
        html += `<button class="ov-mehr-btn" onclick="ovToggleMehr('${vbId}-np','${vbId}-nf')">Mehr →</button>`;
      }
      html += `</div>`; // preview
      if (vbNextAll.length > 5) {
        html += `<div id="${vbId}-nf" style="display:none">
          <div class="ov-scroll-row">`;
        vbNextAll.forEach(s => { html += ovKarte(s, false); });
        html += `</div>
          <button class="ov-mehr-btn" onclick="ovToggleMehr('${vbId}-np','${vbId}-nf')">← Weniger</button>
        </div>`;
      }
    } else {
      html += `<div class="ov-keine-weiteren">Keine weiteren Spiele angesetzt</div>`;
    }
    html += `</div>`; // ov-vb-col links

    // Rechte Spalte: Letzte Spiele
    html += `<div class="ov-vb-col">
      <div class="ov-vb-col-title">Letzte Spiele</div>`;
    if (vbLast5.length) {
      html += `<div id="${vbId}-lp">
        <div class="ov-scroll-row">`;
      vbLast5.forEach(s => { html += ovKarte(s, false); });
      html += `</div>`;
      if (vbLastAll.length > 5) {
        html += `<button class="ov-mehr-btn" onclick="ovToggleMehr('${vbId}-lp','${vbId}-lf')">Mehr →</button>`;
      }
      html += `</div>`; // preview
      if (vbLastAll.length > 5) {
        html += `<div id="${vbId}-lf" style="display:none">
          <div class="ov-scroll-row">`;
        vbLastAll.forEach(s => { html += ovKarte(s, false); });
        html += `</div>
          <button class="ov-mehr-btn" onclick="ovToggleMehr('${vbId}-lp','${vbId}-lf')">← Weniger</button>
        </div>`;
      }
    } else {
      html += `<div class="ov-keine-weiteren">Keine weiteren Ergebnisse</div>`;
    }
    html += `</div>`; // ov-vb-col rechts

    html += `</div></div>`; // ov-vb-cols + ov-block
  });

  html += `</div>`; // ov-main

  // Sidebar (nur Desktop, zeigt Top-5 der aktuell gewählten Liga)
  html += `<div class="ov-sidebar"><div class="glass" style="padding:14px 16px">
    <div class="ov-block-title" style="margin-bottom:10px">Tabelle</div>
    ${bautSidebarTabelle()}
  </div></div>`;

  html += `</div>`; // ov-layout
  el.innerHTML = html;
}

// Mehr anzeigen / Weniger — reine JS show/hide, keine API-Calls
function ovToggleMehr(previewId, fullId) {
  const preview = document.getElementById(previewId);
  const full    = document.getElementById(fullId);
  if (!preview || !full) return;
  const zeige = preview.style.display !== 'none';
  preview.style.display = zeige ? 'none' : '';
  full.style.display    = zeige ? ''     : 'none';
}

// Settings-Panel öffnen/schließen
function toggleOverviewSettings() {
  const panel   = document.getElementById('ov-settings-panel');
  const overlay = document.getElementById('ov-settings-overlay');
  if (!panel || !overlay) return;
  const offen = panel.classList.toggle('offen');
  overlay.classList.toggle('offen', offen);
  if (offen) renderSettingsPanel();
}

function renderSettingsPanel() {
  const panel = document.getElementById('ov-settings-panel');
  if (!panel) return;
  ladeOverviewSettings();

  // Alle Verbände aus den geladenen Daten
  const verbände = [...new Set(overviewDaten.map(d => d.liga.game_operation))].sort();
  const vbRows = verbände.map(vb => {
    const sichtbar = !(overviewSettings.verbandFilter || []).includes(vb);
    return `<label class="liga-check-item">
      <input type="checkbox" ${sichtbar ? 'checked' : ''}
             onchange="toggleOverviewVerband('${vb.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}', this.checked)">
      ${esc(vb)}
    </label>`;
  }).join('');

  // Alle Teams für Mein-Team-Dropdown
  const alleTeams = [...new Set(
    overviewDaten.flatMap(d => d.spiele.flatMap(s => [s.home_team_name, s.guest_team_name]).filter(Boolean))
  )].sort();
  const meinTeam = overviewSettings.meinTeam || '';

  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span style="font-weight:700;font-size:.88rem">⚙ Übersicht-Einstellungen</span>
      <button class="filter-btn" onclick="toggleOverviewSettings()" style="padding:3px 10px">✕</button>
    </div>
    <div class="card-lbl" style="margin-bottom:8px">Verbände anzeigen</div>
    <div style="margin-bottom:16px">${vbRows || '<div class="ov-leer">Keine Daten geladen.</div>'}</div>
    <div class="card-lbl" style="margin-bottom:8px">Mein Team (immer in Block 1)</div>
    <select class="liga-select" style="width:100%" onchange="setMeinTeam(this.value)">
      <option value="">– kein Team gepinnt –</option>
      ${alleTeams.map(t => `<option value="${esc(t)}" ${t === meinTeam ? 'selected' : ''}>${esc(t)}</option>`).join('')}
    </select>
    <div style="font-size:.68rem;color:rgba(255,255,255,.3);margin-top:6px">
      Nächste Spiele dieses Teams erscheinen immer oben — auch wenn nicht heute.
    </div>`;
}

function toggleOverviewVerband(vb, sichtbar) {
  if (!overviewSettings.verbandFilter) overviewSettings.verbandFilter = [];
  if (sichtbar) {
    overviewSettings.verbandFilter = overviewSettings.verbandFilter.filter(v => v !== vb);
  } else {
    if (!overviewSettings.verbandFilter.includes(vb)) overviewSettings.verbandFilter.push(vb);
  }
  speichereOverviewSettings();
  if (overviewGeladen) renderOverview();
}

function setMeinTeam(team) {
  overviewSettings.meinTeam = team || null;
  speichereOverviewSettings();
  if (overviewGeladen) renderOverview();
}

// ─────────────────────────────────────────────────────────────────────────────
// Pull-to-Refresh (nur auf Touch-Geräten)
// ─────────────────────────────────────────────────────────────────────────────
(function() {
  const THRESHOLD = 80; // Pixel Zieh-Distanz zum Auslösen
  let startY = 0, pulling = false;
  const ind = document.getElementById('ptr-indicator');
  if (!ind) return;

  document.addEventListener('touchstart', e => {
    // Nur auslösen wenn ganz oben gescrollt
    if (window.scrollY === 0) {
      startY  = e.touches[0].clientY;
      pulling = true;
    }
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!pulling) return;
    pulling = false;
    const dy = e.changedTouches[0].clientY - startY;
    if (dy >= THRESHOLD) {
      // Indikator kurz anzeigen, dann Daten neu laden
      ind.classList.add('ptr-visible');
      setTimeout(() => {
        ind.classList.remove('ptr-visible');
        datenGeladen = false;
        ladeDaten();
      }, 700);
    }
  });
})();
