<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FloorballIQ – Liga</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4ade80">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FloorballIQ">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    /* ── Reset & Basis ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-a: #4ade80;
      --color-b: #fb923c;
      --bg: #0d0d18;
      --glass-bg: rgba(255,255,255,.04);
      --glass-border: rgba(255,255,255,.09);
      --topbar-h: 54px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: #e2e8f0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      /* overflow-x NICHT auf body/html setzen – bricht position:fixed auf iOS Safari */
    }

    /* ── Hintergrund-Ebene ──────────────────────────────────────────────────── */
    #bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .blob-left {
      width: 420px; height: 420px;
      background: rgba(16,185,129,.32);
      filter: blur(80px);
      left: -60px; top: 10%;
      animation: blob-drift-l 10s ease-in-out infinite alternate;
    }
    .blob-right {
      width: 380px; height: 380px;
      background: rgba(249,115,22,.28);
      filter: blur(75px);
      right: -40px; top: 5%;
      animation: blob-drift-r 12s ease-in-out infinite alternate-reverse;
    }
    .blob-center {
      width: 200px; height: 200px;
      background: rgba(99,102,241,.20);
      filter: blur(60px);
      left: 50%; bottom: 10%;
      transform: translateX(-50%);
      animation: blob-drift-c 8s ease-in-out infinite alternate;
    }

    @keyframes blob-drift-l {
      from { transform: translate(0,0); }
      to   { transform: translate(28px,20px); }
    }
    @keyframes blob-drift-r {
      from { transform: translate(0,0); }
      to   { transform: translate(-20px,28px); }
    }
    @keyframes blob-drift-c {
      from { transform: translateX(-50%) translate(0,0); }
      to   { transform: translateX(-50%) translate(15px,-20px); }
    }

    .corner-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    @keyframes corner-pulse {
      0%   { opacity: .6; transform: scale(1); }
      100% { opacity: 1;  transform: scale(1.15); }
    }

    .scan-lines {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 2px,
        rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 3px
      );
      pointer-events: none;
    }

    .diagonal-split {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        rgba(0,18,8,.5) 0%, rgba(0,18,8,.5) 45%,
        transparent 45%, transparent 55%,
        rgba(18,6,0,.45) 55%, rgba(18,6,0,.45) 100%
      );
    }
    .diagonal-line {
      position: absolute;
      top: -20%; left: 50%;
      width: 1.5px; height: 140%;
      background: rgba(255,255,255,.1);
      transform: rotate(11deg) translateX(-50%);
      transform-origin: top center;
    }

    /* ── Partikel ───────────────────────────────────────────────────────────── */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
    }
    @keyframes float-up {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      15%  { opacity: .8; }
      85%  { opacity: .5; }
      100% { transform: translateY(-220px) translateX(var(--dx)); opacity: 0; }
    }

    /* ── Topbar ─────────────────────────────────────────────────────────────── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      z-index: 100;
      background: rgba(8,8,16,.92);
      border-bottom: 0.5px solid rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
      text-decoration: none;
    }
    .logo-text {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -.02em;
    }
    .logo-text .logo-iq {
      color: var(--color-a);
      border-bottom: 1.5px solid var(--color-a);
      padding-bottom: 1px;
    }

    /* Mobile-Logo: „Floorball" auf Desktop sichtbar, auf Mobile ausgeblendet */
    .logo-full { /* sichtbar auf Desktop — kein extra CSS nötig */ }

    /* Mobile-Dropdowns im Header: global versteckt, auf Mobile eingeblendet */
    #mob-dropdowns { display: none; }

    /* Pull-to-Refresh Indikator */
    #ptr-indicator {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: var(--color-a);
      color: #0d0d18;
      border-radius: 20px;
      padding: 6px 18px;
      font-size: .78rem;
      font-weight: 700;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
      display: none;
    }
    #ptr-indicator.ptr-visible { display: block; opacity: 1; }

    .tabs {
      display: flex;
      gap: 0;
    }
    .tab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: rgba(255,255,255,.35);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .02em;
      padding: 5px 16px;
      border-radius: 0;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
    }
    .tab:hover { color: rgba(255,255,255,.65); }
    .tab.active {
      color: rgba(255,255,255,1);
      border-bottom: 2px solid var(--color-a);
    }

    .hd-space { flex: 1; }

    .btn-topbar {
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.6);
      border-radius: 8px;
      padding: 6px 13px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn-topbar:hover { background: rgba(255,255,255,.1); color: #f1f5f9; }
    .btn-refresh {
      width: 36px; height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    /* ── Tab-Content ────────────────────────────────────────────────────────── */
    .tab-content {
      display: none;
      padding-top: calc(var(--topbar-h) + var(--subbar-h));
      min-height: 100vh;
      position: relative;
      z-index: 5;
    }
    .tab-content.active { display: block; }

    /* ── Glass-Karte ────────────────────────────────────────────────────────── */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(4px);
      border: 0.5px solid var(--glass-border);
      border-radius: 10px;
    }

    /* ── Filter-Buttons ─────────────────────────────────────────────────────── */
    .filters {
      display: flex;
      gap: 8px;
      padding: 14px 20px 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-btn {
      background: rgba(255,255,255,.05);
      border: 0.5px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.45);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn:hover { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.25); }
    .filter-btn.active {
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.3);
      color: #f1f5f9;
    }

    .card-lbl {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.25);
      margin-bottom: 10px;
    }

    /* ── Lade-Spinner ───────────────────────────────────────────────────────── */
    .lade-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 80px 20px;
      color: rgba(255,255,255,.3);
      font-size: .85rem;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,.1);
      border-top-color: var(--color-a);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TAB 1: TABELLE ─────────────────────────────────────────────────────── */
    .tabelle-wrap {
      padding: 18px 20px 24px;
    }
    .tabelle-table {
      width: 100%;
      border-collapse: collapse;
    }
    .tabelle-table th {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.25);
      padding: 8px 10px;
      text-align: right;
      border-bottom: 0.5px solid rgba(255,255,255,.07);
    }
    .tabelle-table th:first-child,
    .tabelle-table th:nth-child(2) { text-align: left; }
    .tabelle-table td {
      padding: 9px 10px;
      font-size: .8rem;
      text-align: right;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
    }
    .tabelle-table td:first-child { text-align: center; width: 32px; }
    .tabelle-table td:nth-child(2) { text-align: left; }
    .tabelle-table tr:last-child td { border-bottom: none; }
    .tabelle-table tr:hover td { background: rgba(255,255,255,.025); }
    .t-row-klickbar { cursor: pointer; }
    .t-row-klickbar:hover td { background: rgba(255,255,255,.05) !important; }
    .t-row-klickbar:hover .t-name { color: var(--color-a); }

    .t-pos {
      font-size: .72rem;
      color: rgba(255,255,255,.35);
      font-weight: 700;
    }
    .t-team {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .t-logo {
      width: 22px; height: 22px;
      object-fit: contain;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .t-logo-placeholder {
      width: 22px; height: 22px;
      background: rgba(255,255,255,.06);
      border-radius: 3px;
      flex-shrink: 0;
    }
    .t-name {
      font-size: .82rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .t-pkt {
      font-weight: 800;
      color: #f1f5f9;
    }
    .t-diff-pos { color: var(--color-a); }
    .t-diff-neg { color: var(--color-b); }

    /* Schenefeld-Highlight */
    .row-highlight td {
      background: rgba(74,222,128,.05) !important;
    }
    .row-highlight:hover td {
      background: rgba(74,222,128,.09) !important;
    }
    .row-highlight .t-name {
      color: var(--color-a);
      font-weight: 700;
    }
    .row-highlight td:first-child::before {
      content: '';
    }

    /* Positions-Abstufungsfarben */
    .pos-1 { color: #fbbf24 !important; }
    .pos-2 { color: #94a3b8 !important; }
    .pos-3 { color: #92400e !important; }

    /* ── TAB 2: SPIELPLAN ───────────────────────────────────────────────────── */
    .spielplan-wrap {
      padding: 0 20px 24px;
    }

    /* ── Turnierbaum ─────────────────────────────────────────────────────────── */
    .bracket-scroll {
      overflow-x: auto;
      padding: 12px 16px 24px;
      -webkit-overflow-scrolling: touch;
    }
    .bracket {
      display: flex;
      flex-direction: row;
      gap: 16px;
      align-items: flex-start;
      min-width: max-content;
    }
    .bracket-round {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 310px;
      flex-shrink: 0;
    }
    .bracket-round-title {
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
      text-align: center;
      padding: 4px 0 6px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      margin-bottom: 4px;
    }
    /* Best-of-Serie Header */
    .bracket-serie-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 8px;
      margin-bottom: 2px;
      font-size: .76rem;
    }
    .bsh-team {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      color: rgba(255,255,255,.65);
      overflow: hidden;
    }
    .bsh-team.bsh-winner { color: #f1f5f9; font-weight: 800; }
    .bsh-team.bsh-loser  { opacity: .4; }
    .bsh-guest { justify-content: flex-end; flex-direction: row-reverse; }
    .bsh-stand {
      font-size: .72rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,.3);
      white-space: nowrap;
      text-align: center;
    }
    .bsh-stand.decided { color: rgba(255,255,255,.65); }
    .bracket-serie-gap {
      height: 1px;
      background: rgba(255,255,255,.07);
      margin: 4px 0;
      border-radius: 1px;
    }

    /* Spiel-Zeile */
    .bg-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: .8rem;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      background: rgba(255,255,255,.03);
      border: 0.5px solid rgba(255,255,255,.08);
      backdrop-filter: blur(4px);
    }
    .bg-row:hover {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.18);
    }
    .bg-home, .bg-guest {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }
    .bg-guest { flex-direction: row-reverse; justify-content: flex-start; }
    .bg-logo {
      width: 22px; height: 22px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .bg-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(255,255,255,.75);
      font-size: .78rem;
    }
    .bg-score {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: center;
      white-space: nowrap;
      font-size: .82rem;
      padding: 0 5px;
    }
    .bg-score.played { color: #f1f5f9; }
    .bg-score.future { color: rgba(255,255,255,.3); font-weight: 400; }
    .bg-pf { font-size: .64rem; font-weight: 400; color: rgba(255,255,255,.4); }
    .bg-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
    }
    .bg-nr    { font-size: .62rem; color: rgba(255,255,255,.3); }
    .bg-datum { font-size: .62rem; color: rgba(255,255,255,.28); white-space: nowrap; }

    /* Gruppenphase-Grid */
    .gruppe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      padding: 0 16px 16px;
    }
    .gruppe-table-wrap { border-radius: 10px; padding: 10px 12px; }
    .gruppe-title {
      font-size: .65rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: rgba(255,255,255,.4);
      margin-bottom: 8px;
    }
    .gruppe-table { width: 100%; border-collapse: collapse; font-size: .74rem; }
    .gruppe-table th {
      color: rgba(255,255,255,.3); font-size: .6rem; font-weight: 600;
      padding: 2px 4px 5px; text-align: center;
    }
    .gruppe-table th:nth-child(2) { text-align: left; }
    .gruppe-table td { padding: 4px; text-align: center; border-top: 0.5px solid rgba(255,255,255,.05); }
    .gruppe-table td:nth-child(2) { text-align: left; }
    .spieltag-gruppe {
      margin-bottom: 18px;
    }
    .spieltag-header {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.2);
      padding: 14px 0 8px;
    }
    .spiel-item {
      display: grid;
      grid-template-columns: 100px 1fr auto 1fr 80px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      margin-bottom: 4px;
      border-radius: 8px;
    }
    .spiel-item.vergangen {
      opacity: .6;
    }
    .spiel-item.aktuell {
      border-color: rgba(74,222,128,.2) !important;
      background: rgba(74,222,128,.04) !important;
    }
    .spiel-datum {
      font-size: .72rem;
      color: rgba(255,255,255,.4);
      line-height: 1.5;
    }
    .spiel-datum strong {
      display: block;
      font-size: .78rem;
      font-weight: 700;
      color: rgba(255,255,255,.65);
    }
    .spiel-team {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: .8rem;
      font-weight: 500;
    }
    .spiel-team-heim { justify-content: flex-end; }
    .spiel-team-gast { justify-content: flex-start; }
    .spiel-team-logo {
      width: 20px; height: 20px;
      object-fit: contain;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .spiel-mid {
      text-align: center;
      min-width: 80px;
    }
    .spiel-ergebnis {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: -.04em;
      color: #f1f5f9;
    }
    .spiel-postfix {
      font-size: .65rem;
      color: rgba(255,255,255,.3);
      margin-top: 1px;
    }
    .spiel-drittel {
      font-size: .62rem;
      color: rgba(255,255,255,.25);
      margin-top: 2px;
      letter-spacing: .02em;
    }
    .spiel-uhrzeit {
      font-size: .8rem;
      font-weight: 600;
      color: rgba(255,255,255,.55);
    }
    .spiel-arena {
      font-size: .65rem;
      color: rgba(255,255,255,.25);
      margin-top: 1px;
    }
    .schenefeld-highlight .spiel-team-name {
      color: var(--color-a);
      font-weight: 700;
    }

    /* ── TAB 3: SCORER ──────────────────────────────────────────────────────── */
    .scorer-controls {
      display: flex;
      gap: 8px;
      padding: 14px 20px 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .scorer-sep {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,.1);
      margin: 0 4px;
    }
    .scorer-select {
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: .75rem;
      cursor: pointer;
      outline: none;
      max-width: 200px;
    }
    .scorer-select:hover { border-color: rgba(255,255,255,.22); }

    .scorer-wrap {
      padding: 0 20px 24px;
    }
    .scorer-table {
      width: 100%;
      border-collapse: collapse;
    }
    .scorer-table th {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.25);
      padding: 8px 10px;
      text-align: right;
      border-bottom: 0.5px solid rgba(255,255,255,.07);
      cursor: pointer;
      user-select: none;
    }
    .scorer-table th:first-child { text-align: center; width: 32px; cursor: default; }
    .scorer-table th:nth-child(2),
    .scorer-table th:nth-child(3) { text-align: left; cursor: default; }
    .scorer-table th.sort-active { color: var(--color-a); }
    .scorer-table th.sort-active::after { content: ' ▼'; }
    .scorer-table td {
      padding: 9px 10px;
      font-size: .8rem;
      text-align: right;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
    }
    .scorer-table td:first-child { text-align: center; }
    .scorer-table td:nth-child(2),
    .scorer-table td:nth-child(3) { text-align: left; }
    .scorer-table tr:last-child td { border-bottom: none; }
    .scorer-table tr:hover td { background: rgba(255,255,255,.025); }
    .scorer-table tr.row-highlight td { background: rgba(74,222,128,.05) !important; }
    .scorer-table tr.row-highlight:hover td { background: rgba(74,222,128,.09) !important; }
    .scorer-rank {
      font-size: .72rem;
      color: rgba(255,255,255,.3);
      font-weight: 700;
    }
    .scorer-name { font-weight: 600; }
    .scorer-team {
      font-size: .72rem;
      color: rgba(255,255,255,.35);
      white-space: nowrap;
    }
    .scorer-goals { font-weight: 800; color: var(--color-a); }
    .scorer-pkt { font-weight: 800; color: #f1f5f9; }

    /* ── TAB 4: TEAM-DETAIL ─────────────────────────────────────────────────── */
    .detail-controls {
      padding: 14px 20px 0;
    }
    .team-dropdown {
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: .82rem;
      cursor: pointer;
      outline: none;
      min-width: 260px;
    }
    .team-dropdown:hover { border-color: rgba(255,255,255,.22); }

    .detail-wrap {
      padding: 16px 20px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 700px) {
      .detail-wrap { grid-template-columns: 1fr; }
    }
    .detail-full { grid-column: 1 / -1; }

    .detail-card {
      padding: 16px 18px;
    }
    .detail-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
      font-size: .8rem;
    }
    .detail-stat-row:last-child { border-bottom: none; }
    .detail-stat-lbl { color: rgba(255,255,255,.4); }
    .detail-stat-val { font-weight: 700; }

    /* Form-Kugeln */
    .form-strip {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .form-ball {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0;
    }
    .form-W  { background: rgba(74,222,128,.25); color: var(--color-a); }
    .form-OW { background: rgba(74,222,128,.12); color: var(--color-a); border: 1px solid rgba(74,222,128,.3); }
    .form-L  { background: rgba(249,115,22,.22); color: var(--color-b); }
    .form-OL { background: rgba(249,115,22,.10); color: var(--color-b); border: 1px solid rgba(249,115,22,.3); }
    .form-empty { background: rgba(255,255,255,.05); color: rgba(255,255,255,.2); }

    /* Team-Spiele Tabelle */
    .team-spiele-table {
      width: 100%;
      border-collapse: collapse;
    }
    .team-spiele-table th {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.25);
      padding: 6px 8px;
      text-align: left;
      border-bottom: 0.5px solid rgba(255,255,255,.07);
    }
    .team-spiele-table th:last-child { text-align: right; }
    .team-spiele-table td {
      padding: 7px 8px;
      font-size: .76rem;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
    }
    .team-spiele-table td:last-child { text-align: right; }
    .team-spiele-table tr:last-child td { border-bottom: none; }
    .team-spiele-table tr:hover td { background: rgba(255,255,255,.02); }
    .res-win  { color: var(--color-a); font-weight: 700; }
    .res-loss { color: var(--color-b); font-weight: 700; }
    .res-otwin  { color: var(--color-a); font-weight: 600; opacity: .7; }
    .res-otloss { color: var(--color-b); font-weight: 600; opacity: .7; }

    /* ── Liga-Auswahlleiste ─────────────────────────────────────────────────── */
    :root { --subbar-h: 44px; }

    #liga-bar {
      position: fixed;
      top: var(--topbar-h);
      left: 0; right: 0;
      height: var(--subbar-h);
      z-index: 90;
      background: rgba(8,8,16,.88);
      border-bottom: 0.5px solid rgba(255,255,255,.06);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
    }

    .liga-bar-lbl {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.22);
      white-space: nowrap;
    }

    .liga-select {
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: .78rem;
      cursor: pointer;
      outline: none;
    }
    .liga-select:hover { border-color: rgba(255,255,255,.22); }
    .liga-select option {
      background-color: #1a1a2e;
      color: #e2e8f0;
    }
    .liga-select:disabled {
      opacity: .35;
      cursor: default;
      pointer-events: none;
    }
    /* Multi-Select Liga-Panel */
    .liga-multiselect-wrap { position: relative; }
    .liga-multiselect-btn {
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      border-radius: 7px;
      padding: 5px 12px;
      font-size: .78rem;
      cursor: pointer;
      white-space: nowrap;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .liga-multiselect-btn:hover { border-color: rgba(255,255,255,.3); }
    .liga-multiselect-btn.active { border-color: var(--color-a); color: var(--color-a); }
    .liga-multiselect-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 200;
      background: #1a1a2e;
      border: 0.5px solid rgba(255,255,255,.15);
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      padding: 8px;
    }
    .liga-multiselect-panel.offen { display: block; }
    .liga-multiselect-search {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255,255,255,.08);
      border: 0.5px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: .75rem;
      outline: none;
      margin-bottom: 6px;
    }
    .liga-multiselect-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .liga-multiselect-list {
      max-height: 280px;
      overflow-y: auto;
    }
    .liga-check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      border-radius: 5px;
      cursor: pointer;
      font-size: .76rem;
      color: rgba(255,255,255,.75);
    }
    .liga-check-item:hover { background: rgba(255,255,255,.06); }
    .liga-check-item input[type=checkbox] { accent-color: var(--color-a); cursor: pointer; }

    .liga-bar-sep {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,.08);
      margin: 0 4px;
    }

    /* ── TAB 5: ALLTIME ─────────────────────────────────────────────────────── */
    .alltime-controls {
      display: flex;
      gap: 8px;
      padding: 14px 20px 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .alltime-search {
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: .75rem;
      outline: none;
      width: 180px;
    }
    .alltime-search::placeholder { color: rgba(255,255,255,.25); }
    .alltime-search:focus { border-color: rgba(255,255,255,.28); }

    .alltime-sep {
      width: 1px; height: 20px;
      background: rgba(255,255,255,.1);
      margin: 0 4px;
    }

    .alltime-section {
      padding: 0 20px 24px;
    }
    .alltime-section-title {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.2);
      padding: 14px 0 8px;
    }

    /* Alltime-Tabellen */
    .at-table {
      width: 100%;
      border-collapse: collapse;
    }
    .at-table th {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.25);
      padding: 8px 10px;
      text-align: right;
      border-bottom: 0.5px solid rgba(255,255,255,.07);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .at-table th:first-child { text-align: center; width: 32px; cursor: default; }
    .at-table th:nth-child(2),
    .at-table th:nth-child(3) { text-align: left; cursor: default; }
    .at-table th.at-sort-active { color: var(--color-a); }
    .at-table th.at-sort-active::after { content: ' ▼'; }
    .at-table td {
      padding: 8px 10px;
      font-size: .78rem;
      text-align: right;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
    }
    .at-table td:first-child { text-align: center; color: rgba(255,255,255,.3); font-weight: 700; }
    .at-table td:nth-child(2) { text-align: left; font-weight: 600; }
    .at-table td:nth-child(3) { text-align: left; font-size: .7rem; color: rgba(255,255,255,.35); }
    .at-table tr:last-child td { border-bottom: none; }
    .at-table tr:hover td { background: rgba(255,255,255,.025); }

    .at-goals  { color: var(--color-a); font-weight: 800; }
    .at-pkt    { color: #f1f5f9; font-weight: 800; }
    .at-diff-pos { color: var(--color-a); }
    .at-diff-neg { color: var(--color-b); }

    /* Team-Kader-Auswahl */
    .kader-team-item {
      padding: 7px 12px;
      font-size: .78rem;
      cursor: pointer;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background .12s;
    }
    .kader-team-item:hover { background: rgba(255,255,255,.06); }
    .kader-team-item:last-child { border-bottom: none; }
    .kader-team-selected {
      color: var(--color-a);
      font-weight: 700;
      background: rgba(16,185,129,.08);
    }
    .kader-check {
      display: inline-block;
      width: 16px;
      color: var(--color-a);
      font-size: .75rem;
      flex-shrink: 0;
    }
    .kader-team-item { display: flex; align-items: center; gap: 4px; }
    .kader-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(16,185,129,.15);
      border: 0.5px solid rgba(16,185,129,.35);
      color: var(--color-a);
      border-radius: 5px;
      padding: 2px 8px;
      font-size: .72rem;
      cursor: pointer;
      transition: background .12s;
    }
    .kader-tag:hover { background: rgba(16,185,129,.28); }
    .kader-tag-x { opacity: .6; font-size: .65rem; }

    /* Geschlechter-Hinweis */
    .gender-hint {
      margin: 8px 20px 0;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(99,102,241,.1);
      border: 0.5px solid rgba(99,102,241,.25);
      font-size: .72rem;
      color: rgba(255,255,255,.5);
    }

    /* ── Fehler-Box ─────────────────────────────────────────────────────────── */
    .error-box {
      margin: 20px;
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(239,68,68,.1);
      border: 0.5px solid rgba(239,68,68,.3);
      font-size: .8rem;
      color: #f87171;
    }

    /* ── Pagination ─────────────────────────────────────────────────────────── */
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px 0 4px;
      font-size: .78rem;
    }
    .pg-btn {
      background: rgba(255,255,255,.07);
      border: 0.5px solid rgba(255,255,255,.15);
      color: #fff;
      border-radius: 6px;
      padding: 5px 14px;
      cursor: pointer;
      font-size: .75rem;
      transition: background .15s;
    }
    .pg-btn:hover:not(:disabled) { background: rgba(255,255,255,.14); }
    .pg-btn:disabled { opacity: .3; cursor: default; }
    .pg-info { color: rgba(255,255,255,.4); }

    /* ── Spiel-Detail ──────────────────────────────────────────────────────── */
    .sd-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.07);
      border: 0.5px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.7);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: .78rem;
      cursor: pointer;
      margin-bottom: 16px;
      transition: background .15s;
    }
    .sd-back-btn:hover { background: rgba(255,255,255,.12); color: #fff; }

    .sd-hero {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      padding: 28px 20px 20px;
      margin-bottom: 12px;
      /* kein Milchglas — direkt auf Aurora */
      background: none;
      border: none;
      backdrop-filter: none;
    }

    .sd-hero-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .sd-hero-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
    }
    .sd-hero-name {
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
    }
    .sd-hero-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .sd-score {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .sd-score-num {
      font-size: 72px;
      font-weight: 900;
      line-height: 1;
      filter: drop-shadow(0 0 4px rgba(255,255,255,.15));
    }
    .sd-score-sep {
      font-size: 48px;
      font-weight: 300;
      color: rgba(255,255,255,.25);
    }
    .sd-score-postfix {
      font-size: .75rem;
      color: rgba(255,255,255,.45);
      margin-top: 2px;
    }
    .sd-meta {
      font-size: .72rem;
      color: rgba(255,255,255,.38);
      text-align: center;
      line-height: 1.6;
    }
    .sd-vod-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239,68,68,.15);
      border: 0.5px solid rgba(239,68,68,.3);
      color: #f87171;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: .74rem;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s;
    }
    .sd-vod-btn:hover { background: rgba(239,68,68,.25); }
    .sd-refs {
      font-size: .68rem;
      color: rgba(255,255,255,.25);
      text-align: center;
      margin-top: 4px;
    }

    .sd-section-title {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
      margin: 16px 0 6px;
    }

    /* Drittel-Balken-Vergleich */
    .sd-period-wrap {
      border-radius: 14px;
      background: var(--glass-bg);
      border: 0.5px solid rgba(74,222,128,.20);
      margin-bottom: 4px;
      padding: 6px 16px 10px;
      box-shadow: 0 0 18px rgba(74,222,128,.08), inset 0 0 0 0.5px rgba(74,222,128,.06);
    }
    .sd-period-header {
      display: grid;
      grid-template-columns: 1fr 100px 1fr;
      gap: 10px;
      padding: 6px 0 8px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      margin-bottom: 4px;
    }
    .sd-period-header-home  { text-align: right;  font-size: .75rem; font-weight: 700; }
    .sd-period-header-mid   { text-align: center; font-size: .65rem; color: rgba(255,255,255,.3); }
    .sd-period-header-guest { text-align: left;   font-size: .75rem; font-weight: 700; }
    .sd-stat-row {
      display: grid;
      grid-template-columns: 1fr 100px 1fr;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 0.5px solid rgba(255,255,255,.05);
    }
    .sd-stat-row:last-child { border-bottom: none; }
    .sd-stat-left {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    .sd-stat-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sd-stat-val {
      font-size: .88rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      min-width: 24px;
    }
    .sd-stat-left  .sd-stat-val { text-align: right; }
    .sd-stat-right .sd-stat-val { text-align: left; }
    .sd-stat-bar-wrap {
      flex: 1;
      height: 5px;
      border-radius: 3px;
      display: flex;
    }
    .sd-stat-left  .sd-stat-bar-wrap { justify-content: flex-end; }
    .sd-stat-right .sd-stat-bar-wrap { justify-content: flex-start; }
    .sd-stat-bar {
      height: 5px;
      border-radius: 3px;
      min-width: 3px;
    }
    .sd-stat-bar-home {
      transform-origin: right center;
      animation: sd-bar-grow .7s cubic-bezier(.4,0,.2,1) both;
    }
    .sd-stat-bar-guest {
      transform-origin: left center;
      animation: sd-bar-grow .7s cubic-bezier(.4,0,.2,1) both;
    }
    @keyframes sd-bar-grow {
      from { transform: scaleX(0); opacity: 0; }
      to   { transform: scaleX(1); opacity: 1; }
    }
    .sd-stat-label {
      text-align: center;
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .06em;
      color: rgba(255,255,255,.3);
      text-transform: uppercase;
    }
    .sd-stat-total .sd-stat-val   { font-size: 1rem; }
    .sd-stat-total .sd-stat-bar   { height: 7px; }
    .sd-stat-total .sd-stat-bar-wrap { height: 7px; }
    .sd-stat-total .sd-stat-label { color: rgba(255,255,255,.5); }

    /* Vertikaler Zeitstrahl */
    .sd-vtl {
      position: relative;
      padding: 0 4px 4px;
    }
    .sd-vtl::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255,255,255,.1);
      transform: translateX(-50%);
      pointer-events: none;
    }
    .sd-vtl-period-sep {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 0 8px;
      position: relative;
      z-index: 1;
    }
    .sd-vtl-period-sep::before,
    .sd-vtl-period-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,.11);
    }
    .sd-vtl-period-name {
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .08em;
      color: rgba(255,255,255,.3);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .sd-vtl-row {
      display: grid;
      grid-template-columns: 1fr 22px 1fr;
      align-items: center;
      position: relative;
      z-index: 1;
      min-height: 42px;
    }
    .sd-vtl-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .sd-vtl-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }
    .sd-vtl-score {
      font-size: .58rem;
      font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,.5);
      font-weight: 700;
      white-space: nowrap;
    }
    .sd-vtl-home-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      padding: 6px 10px 6px 2px;
    }
    .sd-vtl-guest-side {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      padding: 6px 2px 6px 10px;
    }
    .sd-vtl-event-name {
      font-size: .74rem;
      font-weight: 600;
      line-height: 1.35;
    }
    .sd-vtl-event-sub {
      font-size: .65rem;
      color: rgba(255,255,255,.36);
      line-height: 1.3;
    }
    .sd-vtl-event-time {
      font-size: .6rem;
      color: rgba(255,255,255,.26);
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    /* Strafen-Übersicht */
    .sd-penalty-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .sd-penalty-col-title {
      font-size: .72rem;
      font-weight: 700;
      margin-bottom: 6px;
      padding-bottom: 6px;
      border-bottom: 0.5px solid rgba(255,255,255,.08);
    }
    .sd-penalty-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
      font-size: .74rem;
    }
    .sd-penalty-row:last-child { border-bottom: none; }
    .sd-penalty-time { color: rgba(255,255,255,.35); min-width: 36px; font-size: .68rem; }
    .sd-goal-score   { font-size: .7rem; font-weight: 800; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.55); min-width: 32px; }
    .sd-penalty-type { font-size: .7rem; padding: 1px 5px; border-radius: 4px; font-weight: 700; }
    .sd-ptype-2   { background: rgba(234,179,8,.15);  color: #facc15; }
    .sd-ptype-mid { background: rgba(249,115,22,.15); color: #fb923c; }
    .sd-ptype-ms  { background: rgba(239,68,68,.15);  color: #f87171; }
    .sd-penalty-player { font-weight: 600; }
    .sd-penalty-reason { color: rgba(255,255,255,.35); font-size: .68rem; }

    /* Spielinfos-Tabelle */
    .sd-info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .8rem;
    }
    .sd-info-table tr { border-bottom: 0.5px solid rgba(255,255,255,.06); }
    .sd-info-table tr:last-child { border-bottom: none; }
    .sd-info-table td { padding: 8px 4px; vertical-align: top; }
    .sd-info-label {
      color: rgba(255,255,255,.38);
      width: 40%;
      padding-right: 12px;
    }
    .sd-info-value {
      color: #e2e8f0;
      font-weight: 500;
      text-align: right;
    }

    /* Kader */
    .sd-roster-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .sd-roster-col-title {
      font-size: .72rem;
      font-weight: 700;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 0.5px solid rgba(255,255,255,.08);
    }
    .sd-lineup-title {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: rgba(255,255,255,.28);
      margin: 8px 0 4px;
    }
    .sd-player-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: .76rem;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
    }
    .sd-player-row:last-child { border-bottom: none; }
    .sd-player-nr {
      min-width: 26px;
      text-align: right;
      color: rgba(255,255,255,.3);
      font-size: .68rem;
      font-weight: 700;
    }
    .sd-player-name { flex: 1; }
    .sd-player-mvp { color: #fbbf24; font-size: .8rem; }
    .sd-starter-row {
      background: rgba(255,255,255,.04);
      border-radius: 5px;
      padding: 4px 6px;
      margin: 2px 0;
    }
    .sd-pos-label {
      font-size: .62rem;
      color: rgba(255,255,255,.25);
      min-width: 60px;
      flex-shrink: 0;
    }
    /* Kurzversion der Positionsbezeichnung (Mobile) */
    .pos-abbr { display: none; }
    /* Spielername darf abgeschnitten werden */
    .sd-player-name { min-width: 0; }

    /* ── TAB 0: OVERVIEW ───────────────────────────────────────────────────── */
    @media (min-width: 769px) {
      .ov-layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; padding: 16px 20px 24px; align-items: start; }
    }
    @media (max-width: 768px) {
      .ov-layout { display: block; padding: 4px 0 16px; }
      .ov-sidebar { display: none; }
      .ov-karte { width: calc(100vw - 60px); }
    }
    .ov-sidebar {
      position: sticky;
      top: calc(var(--topbar-h) + var(--subbar-h) + 16px);
    }
    .ov-block { margin-bottom: 20px; }
    .ov-block-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px 4px;
    }
    .ov-block-title {
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: rgba(255,255,255,.35);
    }
    .ov-scroll-row {
      display: flex; gap: 10px; overflow-x: auto;
      padding: 6px 20px 12px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .ov-scroll-row::-webkit-scrollbar { display: none; }
    .ov-karte {
      flex-shrink: 0; width: 172px;
      background: var(--glass-bg);
      border: 0.5px solid var(--glass-border);
      border-radius: 10px; padding: 11px 12px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      display: flex; flex-direction: column; gap: 5px;
    }
    .ov-karte:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); }
    .ov-karte-live { border-color: rgba(74,222,128,.35) !important; background: rgba(74,222,128,.04) !important; }
    .ov-karte-pinned { border-color: rgba(251,146,60,.3) !important; }
    .ov-karte-team { display: flex; align-items: center; gap: 6px; }
    .ov-karte-logo { width: 18px; height: 18px; object-fit: contain; border-radius: 2px; flex-shrink: 0; }
    .ov-karte-logo-ph { width: 18px; height: 18px; background: rgba(255,255,255,.07); border-radius: 2px; flex-shrink: 0; }
    .ov-karte-name { font-size: .74rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ov-karte-score { text-align: center; padding: 3px 0; font-size: .9rem; font-weight: 900; letter-spacing: -.02em; }
    .ov-karte-score.played { color: #f1f5f9; }
    .ov-karte-score.future { color: rgba(255,255,255,.45); font-weight: 500; font-size: .78rem; }
    .ov-karte-score.live { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--color-a); font-size: .88rem; }
    .ov-karte-liga { font-size: .62rem; color: rgba(255,255,255,.22); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ov-karte-datum { font-size: .66rem; color: rgba(255,255,255,.28); text-align: center; }
    .ov-datum-header { font-size: .74rem; font-weight: 700; color: rgba(255,255,255,.5); padding: 6px 20px 2px; }
    .ov-leer { padding: 8px 20px 4px; color: rgba(255,255,255,.22); font-size: .8rem; }
    .ov-settings-btn {
      background: rgba(255,255,255,.06); border: 0.5px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.4); border-radius: 7px; padding: 4px 9px;
      font-size: .82rem; cursor: pointer; transition: background .15s; flex-shrink: 0;
    }
    .ov-settings-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
    .ov-alle-btn {
      background: transparent; border: none; color: rgba(74,222,128,.65);
      font-size: .74rem; font-weight: 600; cursor: pointer; padding: 2px 0;
    }
    .ov-alle-btn:hover { color: var(--color-a); }
    .ov-pinned-label {
      font-size: .6rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: var(--color-b); margin-bottom: -2px;
    }
    /* Settings Overlay + Panel */
    #ov-settings-overlay {
      position: fixed; inset: 0; z-index: 149;
      background: rgba(0,0,0,.52); display: none;
    }
    #ov-settings-overlay.offen { display: block; }
    #ov-settings-panel {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 150; background: #1a1a2e;
      border: 0.5px solid rgba(255,255,255,.15); border-radius: 14px;
      width: min(420px, calc(100vw - 32px)); max-height: 75vh;
      overflow-y: auto; padding: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.7); display: none;
    }
    #ov-settings-panel.offen { display: block; }

    /* ── Overview: Block 2+3 nebeneinander (Desktop) ──────────────────────── */
    @media (min-width: 769px) {
      .ov-b2b3-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: start; }
    }

    /* ── Overview: Block 4 Verband-Spalten (Nächste / Letzte) ─────────────── */
    @media (min-width: 769px) {
      .ov-vb-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    }
    .ov-vb-col { min-width: 0; overflow: hidden; }
    .ov-vb-col-title {
      font-size: 9px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: rgba(255,255,255,.28);
      padding: 6px 20px 2px;
    }

    /* ── Mehr-anzeigen Button ─────────────────────────────────────────────── */
    .ov-mehr-btn {
      display: block;
      background: transparent;
      border: 0.5px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.4);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: .73rem;
      font-weight: 600;
      cursor: pointer;
      margin: 2px 20px 10px;
      transition: all .15s;
    }
    .ov-mehr-btn:hover { color: rgba(255,255,255,.75); border-color: rgba(255,255,255,.25); }
    .ov-keine-weiteren {
      padding: 4px 20px 10px;
      color: rgba(255,255,255,.22);
      font-size: .73rem;
      font-style: italic;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       MOBILE  (max-width: 768px)
    ═══════════════════════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {

      /* ── Subbar-Höhe auf 0 (Liga-Bar auf Mobile versteckt) ── */
      :root { --subbar-h: 0px; }

      /* ── Header: einzeilig, Safe-Area-bewusst ──
         --mob-header-content: Höhe des sichtbaren Header-Inhalts (exkl. safe-area).
         min-height + padding-top auf .tab-content nutzen denselben Wert → kein Gap. ── */
      :root { --mob-header-content: 68px; }
      header {
        flex-wrap: nowrap;
        gap: 10px;
        /* Safe Area oben: schiebt Header unter iOS-Statusleiste */
        padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
        align-items: center;
        /* Fixe Mindesthöhe = safe-area + content → kein Gap zur Tab-Content */
        min-height: calc(env(safe-area-inset-top, 0px) + var(--mob-header-content));
        height: auto;
      }
      /* „Floorball" ausblenden – nur „IQ" bleibt sichtbar */
      .logo-full { display: none; }
      /* Refresh-Button ausblenden – Pull-to-Refresh übernimmt */
      .btn-refresh { display: none !important; }
      /* hd-space ausblenden – nicht nötig wenn Dropdowns rechts sind */
      .hd-space { display: none !important; }
      /* Mobile-Dropdowns: rechts vom Logo, vertikal gestapelt */
      #mob-dropdowns {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        min-width: 0;
      }
      #mob-dropdowns .liga-select {
        width: 100%;
        font-size: .74rem;
        padding: 4px 8px;
      }
      /* Tab-Inhalt: exakt Header-Höhe als Abstand oben → nahtlos unter dem Header */
      .tab-content { padding-top: calc(env(safe-area-inset-top, 0px) + var(--mob-header-content)) !important; }
      /* Liga-Bar komplett ausblenden (Dropdowns sind jetzt im Header) */
      #liga-bar { display: none !important; }
      .logo-text { font-size: 14px; }
      .btn-topbar { font-size: .68rem; padding: 5px 8px; }

      /* ── Inhalts-Padding reduzieren ── */
      .tabelle-wrap  { padding: 10px 8px 16px; }
      .spielplan-wrap { padding: 0 8px 16px; }
      .scorer-wrap   { padding: 0 8px 16px; }
      .alltime-section { padding: 0 8px 16px; }
      .filters, .scorer-controls, .alltime-controls { padding: 8px 8px 6px; }
      .detail-controls { padding: 8px 8px 0; }
      .detail-wrap   { padding: 8px 8px 16px; gap: 8px; }

      /* ── Tabellen: horizontal scrollbar, kein Seitenscroll ── */
      .tabelle-wrap .glass,
      .scorer-wrap .glass,
      .alltime-section .glass {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* ── Spalten verstecken ── */
      .col-hide-mob { display: none !important; }

      /* ── Ligatabelle kompakter ── */
      .tabelle-table th,
      .tabelle-table td { padding: 7px 5px; font-size: .74rem; }
      .t-name  { font-size: .76rem; }
      .t-logo, .t-logo-placeholder { width: 18px; height: 18px; }
      .t-team  { gap: 6px; }

      /* ── Scorer kompakter ── */
      .scorer-table th,
      .scorer-table td { padding: 7px 5px; font-size: .74rem; }
      .scorer-name { font-size: .78rem; }

      /* ── Alltime kompakter ── */
      .at-table th,
      .at-table td { padding: 6px 5px; font-size: .74rem; }

      /* ── Spielplan-Zeilen ── */
      .spiel-item {
        grid-template-columns: 62px 1fr auto 1fr;
        gap: 6px;
        padding: 8px 8px;
      }
      .spiel-item-arena { display: none; }   /* Arena-Div ausgeblendet */
      .spiel-datum { font-size: .63rem; }
      .spiel-datum strong { font-size: .68rem; }
      .spiel-team  { font-size: .73rem; gap: 4px; }
      .spiel-team-logo { width: 16px; height: 16px; }
      .spiel-ergebnis { font-size: .95rem; }
      .spiel-mid { min-width: 60px; }

      /* ── Bracket kompakter ── */
      .bracket-round { width: 240px; }
      .bg-row { padding: 7px 8px; gap: 5px; }
      .bg-logo { width: 18px; height: 18px; }
      .bg-name { font-size: .72rem; }

      /* ── Score Hero ── */
      .sd-hero { gap: 8px; padding: 14px 10px 12px; }
      .sd-hero-logo { width: 44px; height: 44px; }
      .sd-hero-name { font-size: .78rem; }
      .sd-hero-team { gap: 6px; }
      .sd-score-num { font-size: 52px; }
      .sd-score-sep { font-size: 36px; }

      /* ── Spieldetail Sektion-Padding ── */
      .sd-period-wrap { padding: 5px 8px 8px; }
      .sd-stat-row { gap: 6px; }
      .sd-stat-val { font-size: .78rem; min-width: 16px; }

      /* ── Team-Dropdown ── */
      .team-dropdown { min-width: 0; width: 100%; }

      /* ── Alltime-Suche ── */
      .alltime-search { width: 140px; }

      /* ── Gruppenphase-Grid ── */
      .gruppe-grid { grid-template-columns: 1fr; padding: 0 8px 12px; }

      /* ── Kader & Aufstellung: Overflow-Schutz ── */
      .sd-roster-cols { gap: 6px; }
      .sd-roster-col-title { font-size: .65rem; }
      .sd-player-row { overflow: hidden; max-width: 100%; }
      .sd-player-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .7rem; }
      .sd-player-nr { min-width: 20px; font-size: .62rem; }
      .sd-pos-label { min-width: 14px; font-size: .58rem; }
      .sd-starter-row { overflow: hidden; }

      /* Positionsbezeichnung kürzen */
      .pos-long { display: none; }
      .pos-abbr { display: inline; }

      /* ── Horizontales Scrollen in Detail-Karten fixen ── */
      .detail-card {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
    }

    /* ── Hintergrund heller im Browser (nicht PWA-Standalone) ────────────────── */
    @media (display-mode: browser) {
      :root { --bg: #141428; }
    }

    /* ── Live-Badge & Stream-Button ──────────────────────────────────────────── */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(74,222,128,.12);
      border: 0.5px solid rgba(74,222,128,.4);
      color: var(--color-a);
      border-radius: 20px;
      padding: 2px 8px;
      font-size: .62rem;
      font-weight: 800;
      letter-spacing: .06em;
      animation: live-blink 1.5s ease-in-out infinite;
    }
    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--color-a);
      flex-shrink: 0;
    }
    @keyframes live-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: .45; }
    }
    .stream-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(74,222,128,.1);
      border: 0.5px solid rgba(74,222,128,.3);
      color: var(--color-a);
      border-radius: 7px;
      padding: 3px 10px;
      font-size: .68rem;
      font-weight: 700;
      text-decoration: none;
      transition: background .15s;
    }
    .stream-btn:hover { background: rgba(74,222,128,.22); }
    .vod-btn-list {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(251,146,60,.1);
      border: 0.5px solid rgba(251,146,60,.3);
      color: var(--color-b);
      border-radius: 7px;
      padding: 3px 10px;
      font-size: .68rem;
      font-weight: 700;
      text-decoration: none;
      transition: background .15s;
    }
    .vod-btn-list:hover { background: rgba(251,146,60,.22); }

    /* Live-Spiel-Item Hervorhebung */
    .spiel-item-live {
      border-color: rgba(74,222,128,.25) !important;
      background: rgba(74,222,128,.04) !important;
    }
    .bg-row-live {
      border-color: rgba(74,222,128,.3) !important;
      background: rgba(74,222,128,.05) !important;
    }

    /* Live-Badge im Score-Hero der Spieldetail-Ansicht */
    .sd-live-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(74,222,128,.15);
      border: 0.5px solid rgba(74,222,128,.45);
      color: var(--color-a);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .07em;
      animation: live-blink 1.4s ease-in-out infinite;
      margin-top: 4px;
    }

    /* Sortierbare Spalten — Cursor + aktive Farbe */
    .tabelle-table th.sort-asc::after  { content: ' ▲'; }
    .tabelle-table th.sort-desc::after { content: ' ▼'; }
    .tabelle-table th.th-sortable { cursor: pointer; user-select: none; }
    .tabelle-table th.th-sortable:hover { color: rgba(255,255,255,.55); }
    .tabelle-table th.sort-active { color: var(--color-a); }

    /* Team-Detail Scorer Controls */
    .detail-scorer-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }
    .detail-scorer-table {
      width: 100%;
      border-collapse: collapse;
    }
    .detail-scorer-table th {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.25);
      padding: 8px 8px;
      text-align: right;
      border-bottom: 0.5px solid rgba(255,255,255,.07);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .detail-scorer-table th:first-child { text-align: center; width: 28px; cursor: default; }
    .detail-scorer-table th:nth-child(2) { text-align: left; cursor: default; }
    .detail-scorer-table th.sort-active { color: var(--color-a); }
    .detail-scorer-table th.sort-active::after { content: ' ▼'; }
    .detail-scorer-table td {
      padding: 8px 8px;
      font-size: .78rem;
      text-align: right;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
    }
    .detail-scorer-table td:first-child { text-align: center; color: rgba(255,255,255,.3); font-size: .72rem; }
    .detail-scorer-table td:nth-child(2) { text-align: left; font-weight: 600; }
    .detail-scorer-table tr:last-child td { border-bottom: none; }
    .detail-scorer-table tr:hover td { background: rgba(255,255,255,.025); }

    /* ── Bottom Navigation Bar (Mobile) ────────────────────────────────────── */
    #bottom-nav { display: none; }

    .bnav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,.32);
      cursor: pointer;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .02em;
      transition: color .15s;
      padding: 6px 0 4px;
      line-height: 1;
    }
    .bnav-item svg { width: 21px; height: 21px; flex-shrink: 0; }
    .bnav-item:hover  { color: rgba(255,255,255,.6); }
    .bnav-item.active { color: var(--color-a); }

    @media (max-width: 768px) {
      /* Top-Tabs ausblenden */
      header .tabs { display: none !important; }

      /* Bottom-Nav einblenden */
      #bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        height: auto;
        min-height: 64px;
        background: rgba(8,8,16,.96);
        border-top: 0.5px solid rgba(255,255,255,.09);
        z-index: 100;
        align-items: stretch;
        backdrop-filter: blur(14px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .bnav-item {
        padding: 8px 0 6px;
        font-size: 10px;
      }
      .bnav-item svg { width: 23px; height: 23px; }

      /* Genug Abstand damit Inhalt nicht unter der Bar verschwindet (inkl. iPhone Home-Indicator) */
      .tab-content { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
    }
  </style>
</head>
<body>

<!-- Hintergrund -->
<div id="bg-layer">
  <div class="aurora-blob blob-left"></div>
  <div class="aurora-blob blob-right"></div>
  <div class="aurora-blob blob-center"></div>
  <div class="scan-lines"></div>
  <div class="diagonal-split"></div>
  <div class="diagonal-line"></div>
  <div class="corner-blob" style="width:220px;height:220px;filter:blur(70px);background:rgba(16,185,129,.16);top:-60px;left:-60px;animation:corner-pulse 5s ease-in-out infinite alternate"></div>
  <div class="corner-blob" style="width:200px;height:200px;filter:blur(65px);background:rgba(249,115,22,.14);top:-50px;right:-50px;animation:corner-pulse 6s ease-in-out infinite alternate-reverse"></div>
  <div class="corner-blob" style="width:170px;height:170px;filter:blur(60px);background:rgba(16,185,129,.11);bottom:-40px;left:-30px;animation:corner-pulse 7s ease-in-out infinite alternate"></div>
  <div class="corner-blob" style="width:180px;height:180px;filter:blur(65px);background:rgba(249,115,22,.11);bottom:-40px;right:-30px;animation:corner-pulse 4s ease-in-out infinite alternate-reverse"></div>
</div>

<!-- Partikel -->
<div id="particles"></div>

<!-- Topbar -->
<header>
  <a class="logo" href="saisonmanager.html">
    <div class="logo-text"><span class="logo-full">Floorball</span><span class="logo-iq">IQ</span></div>
  </a>
  <nav class="tabs">
    <button class="tab"        onclick="zeigeTab('overview')">Übersicht</button>
    <button class="tab active" onclick="zeigeTab('tabelle')">Tabelle</button>
    <button class="tab"        onclick="zeigeTab('spielplan')">Spielplan</button>
    <button class="tab"        onclick="zeigeTab('scorer')">Scorer</button>
    <button class="tab"        onclick="zeigeTab('detail')">Team-Detail</button>
    <button class="tab"        onclick="zeigeTab('alltime')">Alltime</button>
  </nav>
  <div class="hd-space"></div>
  <button class="btn-topbar btn-refresh" onclick="datenGeladen=false;ladeDaten()" title="Aktualisieren">↺</button>
  <!-- Mobile: Verband + Liga direkt im Header (2. Zeile) -->
  <div id="mob-dropdowns">
    <select class="liga-select" id="verband-select-mob" onchange="onVerbandMob()">
      <option>Lädt…</option>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Konstanten
// ─────────────────────────────────────────────────────────────────────────────
const API_BASE = 'https://saisonmanager.de';

// Saison-Nummer → Jahres-Label  (season 17 → "25/26")
// Basis: FBL Season 1 = 2009/10 → Jahr = 2008 + season
function saisonJahr(season) {
  if (!season && season !== 0) return '';
  const n = parseInt(season);
  if (isNaN(n)) return String(season);
  const y = 2008 + n;
  const a = String(y % 100).padStart(2, '0');
  const b = String((y + 1) % 100).padStart(2, '0');
  return `${a}/${b}`;
}

const PAGE_SIZE = 100;

function paginierungsHTML(gesamt, seite, setzeFn) {
  if (gesamt <= PAGE_SIZE) return '';
  const seiten = Math.ceil(gesamt / PAGE_SIZE);
  const von = (seite - 1) * PAGE_SIZE + 1;
  const bis = Math.min(seite * PAGE_SIZE, gesamt);
  return `<div class="pagination-bar">
    <button class="pg-btn" ${seite <= 1 ? 'disabled' : ''} onclick="${setzeFn}(${seite - 1})">← Zurück</button>
    <span class="pg-info">Seite ${seite} / ${seiten} &nbsp;·&nbsp; ${von}–${bis} von ${gesamt}</span>
    <button class="pg-btn" ${seite >= seiten ? 'disabled' : ''} onclick="${setzeFn}(${seite + 1})">Weiter →</button>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
let alleligen    = [];
let aktiveLigaId = 1890;
let tabelle   = [];
let spielplan = [];
let scorer    = [];

let aktiverTab   = 'tabelle';

let spielfilter  = 'alle';
let scorerSort   = 'punkte';
let tabelleSort  = 'position';
let tabelleSortAsc = true;
let tabelleStrafenDetails = false;

let datenGeladen = false;

// Alltime-State (live, per Verband)
let alltimeDaten        = null;
let alltimeGeladen      = false;
let alltimeRohdaten     = null;      // alle geladenen Rohdaten (für Re-Aggregation)
let alltimeLigaFilter     = new Set(); // ausgewählte Liga-IDs; leer = alle (außer noneMode)
let alltimeLigaNoneMode   = false;     // true → leeres Set bedeutet "keine"
let alltimeLigaSuche      = '';

let alltimeSortT   = 'punkte';  // Tabellen-Sortierung

let alltimeView        = 'spieler'; // 'spieler' | 'teams'

// Overview-State

let staticSortT        = 'punkte';

// Team-Kader State (Alltime per Verband)

// Pagination-State

// ─────────────────────────────────────────────────────────────────────────────
// Partikel

// ─────────────────────────────────────────────────────────────────────────────
// Tab-Navigation
// ─────────────────────────────────────────────────────────────────────────────
function zeigeTab(id) {
  aktiverTab = id;
  document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
  const tabIds = ['overview','tabelle','spielplan','scorer','detail','alltime'];
  document.querySelectorAll('header .tab').forEach((b, i) => {
    b.classList.toggle('active', tabIds[i] === id);
  });
  // Bottom-Nav synchronisieren
  document.querySelectorAll('#bottom-nav .bnav-item').forEach((b, i) => {
    b.classList.toggle('active', tabIds[i] === id);
  });
  document.getElementById('tab-' + id)?.classList.add('active');

  // Verband + Liga je nach Tab deaktivieren
  const vSel = document.getElementById('verband-select');
  const lSel = document.getElementById('liga-select');
  const isAlltime  = id === 'alltime';
  const isOverview = id === 'overview';
  vSel.disabled = false;
  lSel.disabled = isAlltime || isOverview;

  // Beim Alltime-Tab: beide Datenquellen laden falls nötig
  if (isAlltime) {
    if (!alltimeGeladen) ladeAlltimeDaten();
    if (!staticGeladen)  ladeStaticAlltime();
  }
  // Beim Overview-Tab: Spielpläne laden falls nötig
  if (isOverview) {
    if (!overviewGeladen) ladeOverview();
    else renderOverview();
  }
}

// Sub-Tab im Alltime-Bereich umschalten
function setAlltimeSubTab(sub) {
  alltimeSubTab = sub;
  document.getElementById('alltime-verband-panel').style.display     = sub === 'verband'     ? '' : 'none';
  document.getElementById('alltime-deutschland-panel').style.display = sub === 'deutschland' ? '' : 'none';
  document.getElementById('alltime-sub-verband').classList.toggle('active', sub === 'verband');
  document.getElementById('alltime-sub-deutschland').classList.toggle('active', sub === 'deutschland');
}

// ─────────────────────────────────────────────────────────────────────────────
// API
// ─────────────────────────────────────────────────────────────────────────────
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
  return r.json();
}

// Alle Ligen laden und Dropdowns befüllen
async function ladeLigen() {
  try {
    alleligen = await fetchJSON(`${API_BASE}/api/v2/leagues.json`);
  } catch (e) {
    console.error('Ligen konnten nicht geladen werden:', e);
    alleligen = [];
  }

  // Einzigartige Verbände — sortiert
  const verbände = [...new Set(alleligen.map(l => l.game_operation))].sort();
  const vSel = document.getElementById('verband-select');
  vSel.innerHTML = verbände.map(v =>
    `<option value="${v}" ${v === 'Floorball Deutschland' ? 'selected' : ''}>${v}</option>`
  ).join('');

  // Mobile-Verband-Select synchronisieren
  const vSelMob = document.getElementById('verband-select-mob');
  if (vSelMob) {
    vSelMob.innerHTML = vSel.innerHTML;
    vSelMob.value     = vSel.value;
  }

  // Liga-Dropdown für Standard-Verband befüllen (wählt automatisch aktuellste)
  befuelleLigaDropdown('Floorball Deutschland');

  // Daten laden
  await ladeDaten();
}

// Liga-Dropdown für gewählten Verband neu befüllen
function befuelleLigaDropdown(verband) {
  const ligen = alleligen
    .filter(l => l.game_operation === verband)
    .sort((a, b) => a.name.localeCompare(b.name, 'de'));
  const lSel = document.getElementById('liga-select');
  lSel.innerHTML = ligen.map(l => {
    const jahr = l.season ? ` (${saisonJahr(l.season)})` : '';
    return `<option value="${l.id}">${l.name}${jahr}</option>`;
  }).join('');

  // Aktuellste Liga vorauswählen: höchste season-Nummer gewinnt
  if (ligen.length) {
    const neueste = ligen.reduce((best, l) =>
      (parseInt(l.season) || 0) > (parseInt(best.season) || 0) ? l : best
    , ligen[0]);
    aktiveLigaId = neueste.id;
    lSel.value   = String(neueste.id);
  }

  // Mobile-Select synchronisieren
  const lSelMob = document.getElementById('liga-select-mob');
  if (lSelMob) {
    lSelMob.innerHTML = lSel.innerHTML;
    lSelMob.value     = lSel.value;
  }
}

// Mobile-Dropdowns: synchronisieren und an Desktop-Funktionen delegieren
function onVerbandMob() {
  const mob = document.getElementById('verband-select-mob');
  const desk = document.getElementById('verband-select');
  if (desk && mob) { desk.value = mob.value; }
  onVerband();
}
function onLigaMob() {
  const mob = document.getElementById('liga-select-mob');
  const desk = document.getElementById('liga-select');

}

// Verband gewechselt
function onVerband() {
  const verband = document.getElementById('verband-select').value;
  // Mobile-Select synchronisieren
  const vSelMob = document.getElementById('verband-select-mob');
  if (vSelMob) vSelMob.value = verband;
  befuelleLigaDropdown(verband);
  // Alltime-Reset: Verband bestimmt die Alltime-Quelle
  alltimeGeladen  = false;
  alltimeDaten    = null;
  alltimeRohdaten   = null;
  alltimeLigaFilter.clear();
  alltimeLigaNoneMode = false;
  alltimeKaderTeams.clear();
  alltimeKaderSuche = '';
  alltimeKaderSeite = 1;
  const spinner  = '<div class="lade-info"><div class="spinner"></div><span>Lädt…</span></div>';
  document.getElementById('content-alltime').innerHTML = spinner;
  document.getElementById('gender-hint').innerHTML = '';
  if (aktiverTab === 'alltime') ladeAlltimeDaten();
  onLiga();
}

// Liga gewechselt
function onLiga() {
  const val = document.getElementById('liga-select').value;
  if (!val) return;
  aktiveLigaId = parseInt(val);
  datenGeladen = false;
  spielfilter  = 'alle';
  // Spinner nur in den liga-spezifischen Tabs (Alltime bleibt unberührt)
  const spinner = '<div class="lade-info"><div class="spinner"></div><span>Lädt…</span></div>';
  ['tabelle','spielplan','scorer','detail'].forEach(id => {
    document.getElementById('content-' + id).innerHTML = spinner;
  });
  ladeDaten();
}

async function ladeDaten() {
  if (datenGeladen) return;
  try {
    [tabelle, spielplan, scorer, ligaMeta] = await Promise.all([
      fetchJSON(`${API_BASE}/api/v2/leagues/${aktiveLigaId}/table.json`),
      fetchJSON(`${API_BASE}/api/v2/leagues/${aktiveLigaId}/schedule.json`),
      fetchJSON(`${API_BASE}/api/v2/leagues/${aktiveLigaId}/scorer.json`),
      fetchJSON(`${API_BASE}/api/v2/leagues/${aktiveLigaId}.json`),
    ]);
    datenGeladen = true;
    befuelleTeamDropdowns();
    renderTabelle();
    renderSpielplan();
    renderScorer();
    renderDetail();
  } catch (e) {
    console.error(e);
    const msg = `<div class="error-box">Fehler beim Laden der Daten: ${e.message}</div>`;
    ['tabelle','spielplan','scorer','detail'].forEach(id => {
      document.getElementById('content-' + id).innerHTML = msg;
    });
  }
}

function getSpielplanModus() {
  if (!ligaMeta || ligaMeta.league_type !== 'cup') return 'liga';
  return ligaMeta.has_preround ? 'cup_gruppe' : 'cup';
}

// ─────────────────────────────────────────────────────────────────────────────
// Hilfsfunktionen
// ─────────────────────────────────────────────────────────────────────────────
function logoUrl(path) {
  if (!path) return null;
  return path.startsWith('http') ? path : API_BASE + path;
}

function logoEl(url, name) {
  if (url) return `<img class="t-logo" src="${url}" alt="${name}" onerror="this.style.display='none'">`;
  return `<div class="t-logo-placeholder"></div>`;
}

function formatDatum(dateStr) {
  if (!dateStr) return '–';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
}

function istVergangen(spiel) {
  return spiel.ended === true || spiel.state === 'ended';
}

function pim(s) {
  return (s.penalty_2 || 0) * 2
       + (s.penalty_2and2 || 0) * 4
       + (s.penalty_5 || 0) * 5
       + (s.penalty_10 || 0) * 10;
}

// ─────────────────────────────────────────────────────────────────────────────
// TAB 1: TABELLE (Liga) oder TURNIERBAUM (Cup)
// ─────────────────────────────────────────────────────────────────────────────
function renderTabelle() {
  const modus = getSpielplanModus();
  // Tab-Beschriftung anpassen
  const tabelleTab = document.querySelector('.tab[onclick*="zeigeTab(\'tabelle\')"]');
  if (tabelleTab) tabelleTab.textContent = (modus !== 'liga') ? 'Turnierbaum' : 'Tabelle';
  if (modus === 'cup')        return renderTurnierbaum();
  if (modus === 'cup_gruppe') return renderGruppenphaseMitKO();

  // Penalty-Aggregation aus Scorer pro Team
  const teamPim = {};
  scorer.forEach(s => {
    const id = s.team_id;
    if (!id) return;
    if (!teamPim[id]) teamPim[id] = { p2:0, p2and2:0, p5:0, p10:0, ms:0, pim:0 };
    const tp = teamPim[id];
    tp.p2     += s.penalty_2     || 0;
    tp.p2and2 += s.penalty_2and2 || 0;
    tp.p5     += s.penalty_5     || 0;
    tp.p10    += s.penalty_10    || 0;
    tp.ms     += (s.penalty_match||0)+(s.penalty_ms_tech||0)+(s.penalty_ms_full||0)+(s.penalty_ms1||0)+(s.penalty_ms2||0);
    tp.pim    += pim(s);
  });

  // Sortierung
  const sorted = [...tabelle].sort((a, b) => {
    const tpA = teamPim[a.team_id] || {};
    const tpB = teamPim[b.team_id] || {};
    let diff = 0;
    if      (tabelleSort === 'position')  diff = a.position - b.position;
    else if (tabelleSort === 'games')     diff = a.games - b.games;
    else if (tabelleSort === 'won')       diff = a.won - b.won;
    else if (tabelleSort === 'won_ot')    diff = a.won_ot - b.won_ot;
    else if (tabelleSort === 'lost_ot')   diff = a.lost_ot - b.lost_ot;
    else if (tabelleSort === 'lost')      diff = a.lost - b.lost;
    else if (tabelleSort === 'goals')     diff = (a.goals_scored - a.goals_received) - (b.goals_scored - b.goals_received);
    else if (tabelleSort === 'diff')      diff = (a.goals_diff ?? 0) - (b.goals_diff ?? 0);
    else if (tabelleSort === 'points')    diff = a.points - b.points;
    else if (tabelleSort === 'pim')       diff = (tpA.pim||0) - (tpB.pim||0);
    else if (tabelleSort === 'p2')        diff = (tpA.p2||0)  - (tpB.p2||0);
    else if (tabelleSort === 'p2and2')    diff = (tpA.p2and2||0) - (tpB.p2and2||0);
    else if (tabelleSort === 'p5')        diff = (tpA.p5||0)  - (tpB.p5||0);
    else if (tabelleSort === 'p10')       diff = (tpA.p10||0) - (tpB.p10||0);
    else if (tabelleSort === 'ms')        diff = (tpA.ms||0)  - (tpB.ms||0);
    return tabelleSortAsc ? diff : -diff;
  });

  function tabSortFn(key) {
    return `tabelleSort==='${key}'?(tabelleSortAsc=!tabelleSortAsc):(tabelleSort='${key}',tabelleSortAsc=false);renderTabelle()`;
  }
  function tabTh(key, label, hint, extraCls) {
    const active = tabelleSort === key;
    const arrow  = active ? (tabelleSortAsc ? ' ▲' : ' ▼') : '';
    const cls = ['th-sortable', active ? 'sort-active' : '', extraCls || ''].filter(Boolean).join(' ');
    const tt  = hint ? ` title="${hint}"` : '';
    return `<th class="${cls}"${tt} onclick="${tabSortFn(key)}">${label}${arrow}</th>`;
  }

  let rows = sorted.map(t => {
    const logo    = logoUrl(t.team_logo_small || t.team_logo);
    const diff    = t.goals_diff;
    const diffCls = diff > 0 ? 't-diff-pos' : diff < 0 ? 't-diff-neg' : '';
    const diffTxt = diff > 0 ? '+' + diff : String(diff);
    const posCls  = t.position === 1 ? 'pos-1' : t.position === 2 ? 'pos-2' : t.position === 3 ? 'pos-3' : '';
    const tp      = teamPim[t.team_id] || {};
    const sp      = t.games || 1;

    return `
    <tr class="t-row-klickbar" onclick="zeigeTeamDetail(${t.team_id})">
      <td><span class="t-pos ${posCls}">${t.position}</span></td>
      <td>
        <div class="t-team">
          ${logoEl(logo, t.team_name)}
          <span class="t-name">${t.team_name}</span>
        </div>
      </td>
      <td>${t.games}</td>
      <td>${t.won}</td>
      <td class="col-hide-mob">${t.won_ot}</td>
      <td class="col-hide-mob">${t.lost_ot}</td>
      <td>${t.lost}</td>
      <td class="col-hide-mob">${t.goals_scored}:${t.goals_received}</td>
      <td class="col-hide-mob ${diffCls}">${diffTxt}</td>
      <td class="t-pkt">${t.points}</td>
      ${tabelleStrafenDetails
        ? `<td class="col-hide-mob">${tp.p2||0}</td><td class="col-hide-mob">${tp.p2and2||0}</td><td class="col-hide-mob">${tp.p5||0}</td><td class="col-hide-mob">${tp.p10||0}</td><td class="col-hide-mob">${tp.ms||0}</td>`
        : ''}
      <td>${tp.pim||0}'</td>
      ${tabellePerGame
        ? `<td class="col-hide-mob">${t.goals_scored ? (t.goals_scored/sp).toFixed(2) : '—'}</td><td class="col-hide-mob">${(((tp.pim||0)/sp)).toFixed(2)}'</td>`
        : ''}
    </tr>`;
  }).join('');

  const hasPimData = scorer.length > 0;

  document.getElementById('content-tabelle').innerHTML = `
  ${hasPimData ? `
  <div class="scorer-controls" style="background:var(--glass-bg);border:0.5px solid var(--glass-border);border-radius:10px 10px 0 0;border-bottom:none;margin-bottom:0">
    <button class="filter-btn ${tabelleStrafenDetails?'active':''}" id="tabelle-strafen-btn" onclick="toggleStrafenDetails('tabelle')">Strafen Details</button>
    <button class="filter-btn ${tabellePerGame?'active':''}" id="tabelle-pergame-btn" onclick="togglePerGame('tabelle')">Pro Spiel</button>
  </div>` : ''}
  <div class="tabelle-wrap">
    <div class="glass" style="${hasPimData?'border-top-left-radius:0;border-top-right-radius:0':''}">
      <table class="tabelle-table">
        <thead>
          <tr>
            ${tabTh('position','#','Platz')}
            <th>Team</th>
            ${tabTh('games','Sp','Spiele')}
            ${tabTh('won','S','Siege')}
            ${tabTh('won_ot','OTS','Overtime-Siege','col-hide-mob')}
            ${tabTh('lost_ot','OTN','Overtime-Niederlagen','col-hide-mob')}
            ${tabTh('lost','N','Niederlagen')}
            ${tabTh('goals','T:G','Tore:Gegentore','col-hide-mob')}
            ${tabTh('diff','Diff','Tordifferenz','col-hide-mob')}
            ${tabTh('points','Pkt','Punkte')}
            ${tabelleStrafenDetails
              ? `${tabTh('p2',"2'",'2-Minuten-Strafen','col-hide-mob')}${tabTh('p2and2','2+2','2+2-Minuten-Strafen','col-hide-mob')}${tabTh('p5',"5'",'5-Minuten-Strafen','col-hide-mob')}${tabTh('p10',"10'",'10-Minuten-Strafen','col-hide-mob')}${tabTh('ms','MS','Matchstrafen','col-hide-mob')}`
              : ''}
            ${tabTh('pim','PIM','Strafminuten gesamt')}
            ${tabellePerGame
              ? `<th class="col-hide-mob" title="Tore pro Spiel">T/Sp</th><th class="col-hide-mob" title="Strafminuten pro Spiel">PIM/Sp</th>`
              : ''}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}
