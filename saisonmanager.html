<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FloorballIQ – Liga</title>
  <style>
    /* ── Reset & Basis ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --color-a: #4ade80;
      --color-b: #fb923c;
      --bg: #080810;
      --glass-bg: rgba(255,255,255,.04);
      --glass-border: rgba(255,255,255,.09);
      --topbar-h: 54px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: #e2e8f0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* ── Hintergrund-Ebene ──────────────────────────────────────────────────── */
    #bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .blob-left {
      width: 420px; height: 420px;
      background: rgba(16,185,129,.22);
      filter: blur(80px);
      left: -60px; top: 10%;
      animation: blob-drift-l 10s ease-in-out infinite alternate;
    }
    .blob-right {
      width: 380px; height: 380px;
      background: rgba(249,115,22,.20);
      filter: blur(75px);
      right: -40px; top: 5%;
      animation: blob-drift-r 12s ease-in-out infinite alternate-reverse;
    }
    .blob-center {
      width: 200px; height: 200px;
      background: rgba(99,102,241,.14);
      filter: blur(60px);
      left: 50%; bottom: 10%;
      transform: translateX(-50%);
      animation: blob-drift-c 8s ease-in-out infinite alternate;
    }

    @keyframes blob-drift-l {
      from { transform: translate(0,0); }
      to   { transform: translate(28px,20px); }
    }
    @keyframes blob-drift-r {
      from { transform: translate(0,0); }
      to   { transform: translate(-20px,28px); }
    }
    @keyframes blob-drift-c {
      from { transform: translateX(-50%) translate(0,0); }
      to   { transform: translateX(-50%) translate(15px,-20px); }
    }

    .corner-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    @keyframes corner-pulse {
      0%   { opacity: .6; transform: scale(1); }
      100% { opacity: 1;  transform: scale(1.15); }
    }

    .scan-lines {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 2px,
        rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 3px
      );
      pointer-events: none;
    }

    .diagonal-split {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        rgba(0,18,8,.5) 0%, rgba(0,18,8,.5) 45%,
        transparent 45%, transparent 55%,
        rgba(18,6,0,.45) 55%, rgba(18,6,0,.45) 100%
      );
    }
    .diagonal-line {
      position: absolute;
      top: -20%; left: 50%;
      width: 1.5px; height: 140%;
      background: rgba(255,255,255,.1);
      transform: rotate(11deg) translateX(-50%);
      transform-origin: top center;
    }

    /* ── Partikel ───────────────────────────────────────────────────────────── */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
    }
    @keyframes float-up {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      15%  { opacity: .8; }
      85%  { opacity: .5; }
      100% { transform: translateY(-220px) translateX(var(--dx)); opacity: 0; }
    }

    /* ── Topbar ─────────────────────────────────────────────────────────────── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      z-index: 100;
      background: rgba(8,8,16,.92);
      border-bottom: 0.5px solid rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
      text-decoration: none;
    }
    .logo-text {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -.02em;
    }
    .logo-text span {
      color: var(--color-a);
      border-bottom: 1.5px solid var(--color-a);
      padding-bottom: 1px;
    }

    .tabs {
      display: flex;
      gap: 0;
    }
    .tab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: rgba(255,255,255,.35);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .02em;
      padding: 5px 16px;
      border-radius: 0;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
    }
    .tab:hover { color: rgba(255,255,255,.65); }
    .tab.active {
      color: rgba(255,255,255,1);
      border-bottom: 2px solid var(--color-a);
    }

    .hd-space { flex: 1; }

    .btn-topbar {
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.6);
      border-radius: 8px;
      padding: 6px 13px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn-topbar:hover { background: rgba(255,255,255,.1); color: #f1f5f9; }

    /* ── Tab-Content ────────────────────────────────────────────────────────── */
    .tab-content {
      display: none;
      padding-top: calc(var(--topbar-h) + var(--subbar-h));
      min-height: 100vh;
      position: relative;
      z-index: 5;
    }
    .tab-content.active { display: block; }

    /* ── Glass-Karte ────────────────────────────────────────────────────────── */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(4px);
      border: 0.5px solid var(--glass-border);
      border-radius: 10px;
    }

    /* ── Filter-Buttons ─────────────────────────────────────────────────────── */
    .filters {
      display: flex;
      gap: 8px;
      padding: 14px 20px 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-btn {
      background: rgba(255,255,255,.05);
      border: 0.5px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.45);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-btn:hover { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.25); }
    .filter-btn.active {
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.3);
      color: #f1f5f9;
    }

    .card-lbl {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.25);
      margin-bottom: 10px;
    }

    /* ── Lade-Spinner ───────────────────────────────────────────────────────── */
    .lade-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 80px 20px;
      color: rgba(255,255,255,.3);
      font-size: .85rem;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,.1);
      border-top-color: var(--color-a);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── TAB 1: TABELLE ─────────────────────────────────────────────────────── */
    .tabelle-wrap {
      padding: 18px 20px 24px;
    }
    .tabelle-table {
      width: 100%;
      border-collapse: collapse;
    }
    .tabelle-table th {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.25);
      padding: 8px 10px;
      text-align: right;
      border-bottom: 0.5px solid rgba(255,255,255,.07);
    }
    .tabelle-table th:first-child,
    .tabelle-table th:nth-child(2) { text-align: left; }
    .tabelle-table td {
      padding: 9px 10px;
      font-size: .8rem;
      text-align: right;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
    }
    .tabelle-table td:first-child { text-align: center; width: 32px; }
    .tabelle-table td:nth-child(2) { text-align: left; }
    .tabelle-table tr:last-child td { border-bottom: none; }
    .tabelle-table tr:hover td { background: rgba(255,255,255,.025); }

    .t-pos {
      font-size: .72rem;
      color: rgba(255,255,255,.35);
      font-weight: 700;
    }
    .t-team {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .t-logo {
      width: 22px; height: 22px;
      object-fit: contain;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .t-logo-placeholder {
      width: 22px; height: 22px;
      background: rgba(255,255,255,.06);
      border-radius: 3px;
      flex-shrink: 0;
    }
    .t-name {
      font-size: .82rem;
      font-weight: 500;
      white-space: nowrap;
    }
    .t-pkt {
      font-weight: 800;
      color: #f1f5f9;
    }
    .t-diff-pos { color: var(--color-a); }
    .t-diff-neg { color: var(--color-b); }

    /* Schenefeld-Highlight */
    .row-highlight td {
      background: rgba(74,222,128,.05) !important;
    }
    .row-highlight:hover td {
      background: rgba(74,222,128,.09) !important;
    }
    .row-highlight .t-name {
      color: var(--color-a);
      font-weight: 700;
    }
    .row-highlight td:first-child::before {
      content: '';
    }

    /* Positions-Abstufungsfarben */
    .pos-1 { color: #fbbf24 !important; }
    .pos-2 { color: #94a3b8 !important; }
    .pos-3 { color: #92400e !important; }

    /* ── TAB 2: SPIELPLAN ───────────────────────────────────────────────────── */
    .spielplan-wrap {
      padding: 0 20px 24px;
    }
    .spieltag-gruppe {
      margin-bottom: 18px;
    }
    .spieltag-header {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.2);
      padding: 14px 0 8px;
    }
    .spiel-item {
      display: grid;
      grid-template-columns: 100px 1fr auto 1fr 80px;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      margin-bottom: 4px;
      border-radius: 8px;
    }
    .spiel-item.vergangen {
      opacity: .6;
    }
    .spiel-item.aktuell {
      border-color: rgba(74,222,128,.2) !important;
      background: rgba(74,222,128,.04) !important;
    }
    .spiel-datum {
      font-size: .72rem;
      color: rgba(255,255,255,.4);
      line-height: 1.5;
    }
    .spiel-datum strong {
      display: block;
      font-size: .78rem;
      font-weight: 700;
      color: rgba(255,255,255,.65);
    }
    .spiel-team {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: .8rem;
      font-weight: 500;
    }
    .spiel-team-heim { justify-content: flex-end; }
    .spiel-team-gast { justify-content: flex-start; }
    .spiel-team-logo {
      width: 20px; height: 20px;
      object-fit: contain;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .spiel-mid {
      text-align: center;
      min-width: 80px;
    }
    .spiel-ergebnis {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: -.04em;
      color: #f1f5f9;
    }
    .spiel-postfix {
      font-size: .65rem;
      color: rgba(255,255,255,.3);
      margin-top: 1px;
    }
    .spiel-drittel {
      font-size: .62rem;
      color: rgba(255,255,255,.25);
      margin-top: 2px;
      letter-spacing: .02em;
    }
    .spiel-uhrzeit {
      font-size: .8rem;
      font-weight: 600;
      color: rgba(255,255,255,.55);
    }
    .spiel-arena {
      font-size: .65rem;
      color: rgba(255,255,255,.25);
      margin-top: 1px;
    }
    .schenefeld-highlight .spiel-team-name {
      color: var(--color-a);
      font-weight: 700;
    }

    /* ── TAB 3: SCORER ──────────────────────────────────────────────────────── */
    .scorer-controls {
      display: flex;
      gap: 8px;
      padding: 14px 20px 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .scorer-sep {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,.1);
      margin: 0 4px;
    }
    .scorer-select {
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: .75rem;
      cursor: pointer;
      outline: none;
      max-width: 200px;
    }
    .scorer-select:hover { border-color: rgba(255,255,255,.22); }

    .scorer-wrap {
      padding: 0 20px 24px;
    }
    .scorer-table {
      width: 100%;
      border-collapse: collapse;
    }
    .scorer-table th {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.25);
      padding: 8px 10px;
      text-align: right;
      border-bottom: 0.5px solid rgba(255,255,255,.07);
      cursor: pointer;
      user-select: none;
    }
    .scorer-table th:first-child { text-align: center; width: 32px; cursor: default; }
    .scorer-table th:nth-child(2),
    .scorer-table th:nth-child(3) { text-align: left; cursor: default; }
    .scorer-table th.sort-active { color: var(--color-a); }
    .scorer-table th.sort-active::after { content: ' ▼'; }
    .scorer-table td {
      padding: 9px 10px;
      font-size: .8rem;
      text-align: right;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
    }
    .scorer-table td:first-child { text-align: center; }
    .scorer-table td:nth-child(2),
    .scorer-table td:nth-child(3) { text-align: left; }
    .scorer-table tr:last-child td { border-bottom: none; }
    .scorer-table tr:hover td { background: rgba(255,255,255,.025); }
    .scorer-table tr.row-highlight td { background: rgba(74,222,128,.05) !important; }
    .scorer-table tr.row-highlight:hover td { background: rgba(74,222,128,.09) !important; }
    .scorer-rank {
      font-size: .72rem;
      color: rgba(255,255,255,.3);
      font-weight: 700;
    }
    .scorer-name { font-weight: 600; }
    .scorer-team {
      font-size: .72rem;
      color: rgba(255,255,255,.35);
      white-space: nowrap;
    }
    .scorer-goals { font-weight: 800; color: var(--color-a); }
    .scorer-pkt { font-weight: 800; color: #f1f5f9; }

    /* ── TAB 4: TEAM-DETAIL ─────────────────────────────────────────────────── */
    .detail-controls {
      padding: 14px 20px 0;
    }
    .team-dropdown {
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: .82rem;
      cursor: pointer;
      outline: none;
      min-width: 260px;
    }
    .team-dropdown:hover { border-color: rgba(255,255,255,.22); }

    .detail-wrap {
      padding: 16px 20px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 700px) {
      .detail-wrap { grid-template-columns: 1fr; }
    }
    .detail-full { grid-column: 1 / -1; }

    .detail-card {
      padding: 16px 18px;
    }
    .detail-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
      font-size: .8rem;
    }
    .detail-stat-row:last-child { border-bottom: none; }
    .detail-stat-lbl { color: rgba(255,255,255,.4); }
    .detail-stat-val { font-weight: 700; }

    /* Form-Kugeln */
    .form-strip {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .form-ball {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0;
    }
    .form-W  { background: rgba(74,222,128,.25); color: var(--color-a); }
    .form-OW { background: rgba(74,222,128,.12); color: var(--color-a); border: 1px solid rgba(74,222,128,.3); }
    .form-L  { background: rgba(249,115,22,.22); color: var(--color-b); }
    .form-OL { background: rgba(249,115,22,.10); color: var(--color-b); border: 1px solid rgba(249,115,22,.3); }
    .form-empty { background: rgba(255,255,255,.05); color: rgba(255,255,255,.2); }

    /* Team-Spiele Tabelle */
    .team-spiele-table {
      width: 100%;
      border-collapse: collapse;
    }
    .team-spiele-table th {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.25);
      padding: 6px 8px;
      text-align: left;
      border-bottom: 0.5px solid rgba(255,255,255,.07);
    }
    .team-spiele-table th:last-child { text-align: right; }
    .team-spiele-table td {
      padding: 7px 8px;
      font-size: .76rem;
      border-bottom: 0.5px solid rgba(255,255,255,.04);
    }
    .team-spiele-table td:last-child { text-align: right; }
    .team-spiele-table tr:last-child td { border-bottom: none; }
    .team-spiele-table tr:hover td { background: rgba(255,255,255,.02); }
    .res-win  { color: var(--color-a); font-weight: 700; }
    .res-loss { color: var(--color-b); font-weight: 700; }
    .res-otwin  { color: var(--color-a); font-weight: 600; opacity: .7; }
    .res-otloss { color: var(--color-b); font-weight: 600; opacity: .7; }

    /* ── Liga-Auswahlleiste ─────────────────────────────────────────────────── */
    :root { --subbar-h: 44px; }

    #liga-bar {
      position: fixed;
      top: var(--topbar-h);
      left: 0; right: 0;
      height: var(--subbar-h);
      z-index: 90;
      background: rgba(8,8,16,.88);
      border-bottom: 0.5px solid rgba(255,255,255,.06);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
    }

    .liga-bar-lbl {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255,255,255,.22);
      white-space: nowrap;
    }

    .liga-select {
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: .78rem;
      cursor: pointer;
      outline: none;
    }
    .liga-select:hover { border-color: rgba(255,255,255,.22); }
    .liga-select option {
      background-color: #1a1a2e;
      color: #e2e8f0;
    }
    .liga-select:disabled {
      opacity: .35;
      cursor: default;
      pointer-events: none;
    }
    /* Multi-Select Liga-Panel */
    .liga-multiselect-wrap { position: relative; }
    .liga-multiselect-btn {
      background: rgba(255,255,255,.06);
      border: 0.5px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      border-radius: 7px;
      padding: 5px 12px;
      font-size: .78rem;
      cursor: pointer;
      white-space: nowrap;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .liga-multiselect-btn:hover { border-color: rgba(255,255,255,.3); }
    .liga-multiselect-btn.active { border-color: var(--color-a); color: var(--color-a); }
    .liga-multiselect-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 200;
      background: #1a1a2e;
      border: 0.5px solid rgba(255,255,255,.15);
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      padding: 8px;
    }
    .liga-multiselect-panel.offen { display: block; }
    .liga-multiselect-search {
      width: 100%;
      box-sizing: border-box;
      background: rgba(255,255,255,.08);
      border: 0.5px solid rgba(255,255,255,.12);
      color: #e2e8f0;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: .75rem;
      outline: none;
      margin-bottom: 6px;
    }
    .liga-multiselect-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .liga-multiselect-list {
      max-height: 280px;
      overflow-y: auto;
    }
    .liga-check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      border-radius: 5px;
      cursor: pointer;
      font-size: .76rem;
      color: rgba(255,255,255,.75);
    }
    .liga-check-item:hover { background: rgba(255,255,255,.06); }
    .liga-check-item input[type=checkbox] { accent-color: var(--color-a); cursor: pointer; }

    .liga-bar-sep {
      width: 1px;
      height: 18px;

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Konstanten
// ─────────────────────────────────────────────────────────────────────────────
const API_BASE = 'https://saisonmanager.de';

// Saison-Nummer → Jahres-Label  (season 17 → "25/26")
// Basis: FBL Season 1 = 2009/10 → Jahr = 2008 + season
function saisonJahr(season) {
  if (!season && season !== 0) return '';
  const n = parseInt(season);
  if (isNaN(n)) return String(season);
  const y = 2008 + n;
  const a = String(y % 100).padStart(2, '0');
  const b = String((y + 1) % 100).padStart(2, '0');
  return `${a}/${b}`;
}

const PAGE_SIZE = 100;

function paginierungsHTML(gesamt, seite, setzeFn) {
  if (gesamt <= PAGE_SIZE) return '';
  const seiten = Math.ceil(gesamt / PAGE_SIZE);
  const von = (seite - 1) * PAGE_SIZE + 1;
  const bis = Math.min(seite * PAGE_SIZE, gesamt);
  return `<div class="pagination-bar">
    <button class="pg-btn" ${seite <= 1 ? 'disabled' : ''} onclick="${setzeFn}(${seite - 1})">← Zurück</button>
    <span class="pg-info">Seite ${seite} / ${seiten} &nbsp;·&nbsp; ${von}–${bis} von ${gesamt}</span>
    <button class="pg-btn" ${seite >= seiten ? 'disabled' : ''} onclick="${setzeFn}(${seite + 1})">Weiter →</button>
  </div>`;
}

function zeigeTab(id) {
  aktiverTab = id;
  document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('header .tab').forEach((b, i) => {
    const ids = ['tabelle','spielplan','scorer','detail','alltime','static'];

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
  return r.json();
}

// Alle Ligen laden und Dropdowns befüllen
async function ladeLigen() {
  try {
    alleligen = await fetchJSON(`${API_BASE}/api/v2/leagues.json`);
  } catch (e) {
    console.error('Ligen konnten nicht geladen werden:', e);
    alleligen = [];
  }

  // Einzigartige Verbände — sortiert
  const verbände = [...new Set(alleligen.map(l => l.game_operation))].sort();
  const vSel = document.getElementById('verband-select');
  vSel.innerHTML = verbände.map(v =>
    `<option value="${v}" ${v === 'Floorball Deutschland' ? 'selected' : ''}>${v}</option>`
  ).join('');

  // Liga-Dropdown für Standard-Verband befüllen
  befuelleLigaDropdown('Floorball Deutschland');

  // Standard-Liga auf 1. FBL (ID 1890) setzen
  const lSel = document.getElementById('liga-select');
  const opt1890 = [...lSel.options].find(o => o.value === '1890');
  if (opt1890) lSel.value = '1890';

  // Daten laden
  await ladeDaten();
}

// Liga-Dropdown für gewählten Verband neu befüllen
function befuelleLigaDropdown(verband) {
  const ligen = alleligen
    .filter(l => l.game_operation === verband)
    .sort((a, b) => a.name.localeCompare(b.name, 'de'));
  const lSel = document.getElementById('liga-select');
  lSel.innerHTML = ligen.map(l => {
    const jahr = l.season ? ` (${saisonJahr(l.season)})` : '';
    return `<option value="${l.id}">${l.name}${jahr}</option>`;
  }).join('');
  if (ligen.length) aktiveLigaId = ligen[0].id;
}

// Verband gewechselt
function onVerband() {
  const verband = document.getElementById('verband-select').value;
  befuelleLigaDropdown(verband);
  // Alltime-Reset: Verband bestimmt die Alltime-Quelle
  alltimeGeladen  = false;
  alltimeDaten    = null;
  alltimeRohdaten   = null;
  alltimeLigaFilter.clear();
  alltimeLigaNoneMode = false;
  const spinner  = '<div class="lade-info"><div class="spinner"></div><span>Lädt…</span></div>';
  document.getElementById('content-alltime').innerHTML = spinner;
  document.getElementById('gender-hint').innerHTML = '';
  if (aktiverTab === 'alltime') ladeAlltimeDaten();
  onLiga();
}

// Liga gewechselt
function onLiga() {
  const val = document.getElementById('liga-select').value;
  if (!val) return;
  aktiveLigaId = parseInt(val);
  datenGeladen = false;
  spielfilter  = 'alle';
  // Spinner nur in den liga-spezifischen Tabs (Alltime bleibt unberührt)
  const spinner = '<div class="lade-info"><div class="spinner"></div><span>Lädt…</span></div>';
  ['tabelle','spielplan','scorer','detail'].forEach(id => {
    document.getElementById('content-' + id).innerHTML = spinner;
  });
  ladeDaten();
}

async function ladeDaten() {
  if (datenGeladen) return;
  try {
    [tabelle, spielplan, scorer] = await Promise.all([
      fetchJSON(`${API_BASE}/api/v2/leagues/${aktiveLigaId}/table.json`),
      fetchJSON(`${API_BASE}/api/v2/leagues/${aktiveLigaId}/schedule.json`),
      fetchJSON(`${API_BASE}/api/v2/leagues/${aktiveLigaId}/scorer.json`),
    ]);
    datenGeladen = true;
    befuelleTeamDropdowns();
    renderTabelle();
    renderSpielplan();
    renderScorer();
    renderDetail();
  } catch (e) {
    console.error(e);
    const msg = `<div class="error-box">Fehler beim Laden der Daten: ${e.message}</div>`;
    ['tabelle','spielplan','scorer','detail'].forEach(id => {
      document.getElementById('content-' + id).innerHTML = msg;
    });
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Hilfsfunktionen
// ─────────────────────────────────────────────────────────────────────────────
function logoUrl(path) {
  if (!path) return null;
  return path.startsWith('http') ? path : API_BASE + path;
}

function logoEl(url, name) {
  if (url) return `<img class="t-logo" src="${url}" alt="${name}" onerror="this.style.display='none'">`;
  return `<div class="t-logo-placeholder"></div>`;
}

function formatDatum(dateStr) {
  if (!dateStr) return '–';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
}

function istVergangen(spiel) {
  return spiel.ended === true || spiel.state === 'ended';
}

function pim(s) {
  return (s.penalty_2 || 0) * 2
       + (s.penalty_2and2 || 0) * 4
       + (s.penalty_5 || 0) * 5
       + (s.penalty_10 || 0) * 10;
}

    const posCls  = t.position === 1 ? 'pos-1' : t.position === 2 ? 'pos-2' : t.position === 3 ? 'pos-3' : '';

    return `
    <tr>
      <td><span class="t-pos ${posCls}">${t.position}</span></td>
      <td>
        <div class="t-team">
          ${logoEl(logo, t.team_name)}

      <td>${t.games}</td>

function renderSpielplan() {
  const teamFilter = document.getElementById('spielplan-team-filter')?.value || '';
  let spiele = spielplan;

  if (teamFilter) {
    spiele = spiele.filter(s =>
      s.home_team_name === teamFilter || s.guest_team_name === teamFilter
    );
  }

  // Gruppieren nach Spieltag
  const gruppen = {};
  spiele.forEach(s => {
    const key = s.game_day || 0;
    if (!gruppen[key]) gruppen[key] = { label: `${s.game_day}. Spieltag`, datum: s.date, spiele: [] };
    gruppen[key].spiele.push(s);
  });

  const spieltagKeys = Object.keys(gruppen).map(Number).sort((a, b) => a - b);
  const heute = new Date().toISOString().slice(0, 10);

  let html = '<div class="spielplan-wrap">';

  if (spieltagKeys.length === 0) {
    html += '<div class="lade-info" style="padding:60px 0"><span>Keine Spiele gefunden.</span></div>';
  }

  spieltagKeys.forEach(key => {
    const g = gruppen[key];
    html += `<div class="spieltag-gruppe">`;
    html += `<div class="spieltag-header">${g.label} &nbsp;·&nbsp; ${formatDatum(g.datum)}</div>`;

    g.spiele.forEach(s => {
      const verg    = istVergangen(s);
      const heimLogo = logoUrl(s.home_team_small_logo || s.home_team_logo);
      const gastLogo = logoUrl(s.guest_team_small_logo || s.guest_team_logo);

      let mitteHTML;
      if (verg && s.result) {
        const r = s.result;
        const pf = r.postfix ? r.postfix.short : '';
        let drittelStr = '';
        if (r.home_goals_period && r.home_goals_period.length >= 3) {
          const hd = r.home_goals_period;
          const gd = r.guest_goals_period;
          const parts = [0, 1, 2].map(i => `${hd[i]}:${gd[i]}`);
          if (hd[3] > 0 || (gd[3] > 0)) parts.push(`${hd[3]}:${gd[3]}`);
          drittelStr = `<div class="spiel-drittel">${parts.join(' · ')}</div>`;
        }
        mitteHTML = `
          <div class="spiel-ergebnis">${r.home_goals}:${r.guest_goals}</div>
          ${pf ? `<div class="spiel-postfix">${pf}</div>` : ''}
          ${drittelStr}`;
      } else {
        mitteHTML = `
          <div class="spiel-uhrzeit">${s.time || '–'}</div>
          ${s.arena_short ? `<div class="spiel-arena">${s.arena_short}</div>` : ''}`;
      }

      html += `
      <div class="glass spiel-item ${verg ? 'vergangen' : ''}" onclick="zeigSpielDetail(${s.game_id})" style="cursor:pointer">
        <div class="spiel-datum">
          <strong>${formatDatum(s.date)}</strong>
          ${s.time && !verg ? s.time : ''}
        </div>
        <div class="spiel-team spiel-team-heim">
          <span class="spiel-team-name">${s.home_team_name}</span>
          ${heimLogo ? `<img class="spiel-team-logo" src="${heimLogo}" alt="" onerror="this.style.display='none'">` : ''}
        </div>
        <div class="spiel-mid">${mitteHTML}</div>
        <div class="spiel-team spiel-team-gast">
          ${gastLogo ? `<img class="spiel-team-logo" src="${gastLogo}" alt="" onerror="this.style.display='none'">` : ''}
          <span class="spiel-team-name">${s.guest_team_name}</span>
        </div>
        <div style="font-size:.65rem;color:rgba(255,255,255,.2);text-align:right">${s.arena_short || ''}</div>
      </div>`;
    });

    html += `</div>`;
  });

  html += '</div>';
  document.getElementById('content-spielplan').innerHTML = html;
}

function renderScorer() {
  const teamFilter = document.getElementById('scorer-team-filter')?.value || '';
  let data = [...scorer];

  data.sort((a, b) => {

    return (b.goals + b.assists) - (a.goals + a.assists) || b.goals - a.goals;
  });

  const rows = data.map((s, i) => {
    const punkte   = s.goals + s.assists;
    const pimTotal = pim(s);
    const sp       = s.games || 1;
    return `
    <tr>
      <td><span class="scorer-rank">${i + 1}</span></td>
      <td><span class="scorer-name">${s.first_name} ${s.last_name}</span></td>

        ? `<td>${s.penalty_2 || 0}</td><td>${s.penalty_2and2 || 0}</td><td>${s.penalty_5 || 0}</td><td>${s.penalty_10 || 0}</td><td>${(s.penalty_match||0)+(s.penalty_ms_tech||0)+(s.penalty_ms_full||0)+(s.penalty_ms1||0)+(s.penalty_ms2||0)}</td>`
        : ''}
      <td>${pimTotal}'</td>
      ${scorerPerGame
        ? `<td>${(punkte / sp).toFixed(2)}</td><td>${(s.goals / sp).toFixed(2)}</td><td>${(s.assists / sp).toFixed(2)}</td><td>${(pimTotal / sp).toFixed(2)}'</td>`
        : ''}
    </tr>`;
  }).join('');

  document.getElementById('content-scorer').innerHTML = `

    <div class="glass">

        <thead>

            <th>A</th>

            ${scorerStrafenDetails
              ? `<th title="2-Minuten-Strafen">2'</th><th title="2+2-Minuten-Strafen">2+2</th><th title="5-Minuten-Strafen">5'</th><th title="10-Minuten-Strafen">10'</th><th title="Matchstrafen">MS</th>`
              : ''}
            <th title="Strafminuten gesamt">PIM</th>
            ${scorerPerGame
              ? `<th title="Punkte pro Spiel">Pkt/Sp</th><th title="Tore pro Spiel">G/Sp</th><th title="Assists pro Spiel">A/Sp</th><th title="PIM pro Spiel">PIM/Sp</th>`
              : ''}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
function renderDetail() {
  const sel = document.getElementById('detail-team-select');
  const teamId = parseInt(sel?.value || 0);
  const teamRow = tabelle.find(t => t.team_id === teamId);
  if (!teamRow) return;

  // Team-Spiele aus Spielplan
  const teamSpiele = spielplan.filter(s =>
    s.home_team_id === teamId || s.guest_team_id === teamId ||
    s.home_team_name === teamRow.team_name ||
    s.guest_team_name === teamRow.team_name
  ).sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  const gespielt = teamSpiele.filter(istVergangen);

  // Bilanz
  let heimS = 0, heimN = 0, heimSp = 0;
  let ausS  = 0, ausN  = 0, ausSp  = 0;
  let formListe = []; // 'W','OW','L','OL'

  gespielt.forEach(s => {
    const heimTeam = s.home_team_id === teamId || s.home_team_name === teamRow.team_name;
    const r = s.result;
    if (!r) return;
    const hg = r.home_goals;
    const gg = r.guest_goals;
    const ot = r.overtime || (r.postfix && r.postfix.short && r.postfix.short !== '');

    let win, winOT;
    if (heimTeam) {
      heimSp++;
      win   = hg > gg;
      winOT = ot;
      if (win && !winOT) heimS++;
      else if (!win && !winOT) heimN++;
    } else {
      ausSp++;
      win   = gg > hg;
      winOT = ot;
      if (win && !winOT) ausS++;
      else if (!win && !winOT) ausN++;
    }

    if (win && !winOT) formListe.push('W');
    else if (win && winOT) formListe.push('OW');
    else if (!win && winOT) formListe.push('OL');
    else formListe.push('L');
  });

  const letzten5 = formListe.slice(-5);
  while (letzten5.length < 5) letzten5.unshift(null);

  const formHTML = letzten5.map(f => {
    if (!f) return `<div class="form-ball form-empty">–</div>`;
    const labels = { W: 'S', OW: 'OT', L: 'N', OL: 'OT' };
    return `<div class="form-ball form-${f}">${labels[f]}</div>`;
  }).join('');

  // Team-Scorer
  const teamScorer = scorer
    .filter(s => s.team_id === teamId || s.team_name === teamRow.team_name)
    .sort((a, b) => (b.goals + b.assists) - (a.goals + a.assists) || b.goals - a.goals);

  const scorerRows = teamScorer.map((s, i) => `
    <tr>
      <td style="color:rgba(255,255,255,.3)">${i+1}</td>
      <td>${s.first_name} ${s.last_name}</td>
      <td style="text-align:right;font-weight:700;color:var(--color-a)">${s.goals}</td>
      <td style="text-align:right">${s.assists}</td>
      <td style="text-align:right;font-weight:700">${s.goals + s.assists}</td>
      <td style="text-align:right;color:rgba(255,255,255,.4)">${pim(s)}'</td>
    </tr>`).join('');

  // Spiele-Tabelle (letzte 10 gespielt)
  const letzteSpiele = [...gespielt].slice(-10).reverse();
  const spieleRows = letzteSpiele.map(s => {
    const heimTeam = s.home_team_id === teamId || s.home_team_name === teamRow.team_name;
    const r = s.result;
    if (!r) return '';
    const hg = r.home_goals, gg = r.guest_goals;
    const win = heimTeam ? hg > gg : gg > hg;
    const ot  = r.overtime || (r.postfix && r.postfix.short);
    const resCls = win ? (ot ? 'res-otwin' : 'res-win') : (ot ? 'res-otloss' : 'res-loss');
    const gegner  = heimTeam ? s.guest_team_name : s.home_team_name;
    const haSign  = heimTeam ? 'H' : 'A';
    const ergebnis = heimTeam ? `${hg}:${gg}` : `${gg}:${hg}`;
    const pf = ot && r.postfix ? ` ${r.postfix.short}` : '';
    return `
    <tr>
      <td style="color:rgba(255,255,255,.3)">${formatDatum(s.date)}</td>
      <td style="color:rgba(255,255,255,.35);font-size:.68rem">${haSign}</td>
      <td>${gegner}</td>
      <td class="${resCls}">${ergebnis}${pf}</td>
    </tr>`;
  }).join('');

  const logo = logoUrl(teamRow.team_logo || teamRow.team_logo_small);

  document.getElementById('content-detail').innerHTML = `
  <div class="detail-wrap">

    <!-- Übersicht-Karte -->
    <div class="glass detail-card">
      <div class="card-lbl">Saison-Bilanz</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        ${logo ? `<img style="width:32px;height:32px;object-fit:contain" src="${logo}" alt="" onerror="this.style.display='none'">` : ''}
        <span style="font-size:1rem;font-weight:700">${teamRow.team_name}</span>
      </div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">Spiele</span><span class="detail-stat-val">${teamRow.games}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">Siege</span><span class="detail-stat-val" style="color:var(--color-a)">${teamRow.won}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">OT-Siege</span><span class="detail-stat-val" style="color:var(--color-a);opacity:.7">${teamRow.won_ot}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">OT-Niederlagen</span><span class="detail-stat-val" style="color:var(--color-b);opacity:.7">${teamRow.lost_ot}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">Niederlagen</span><span class="detail-stat-val" style="color:var(--color-b)">${teamRow.lost}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">Tore</span><span class="detail-stat-val">${teamRow.goals_scored}:${teamRow.goals_received}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">Tordifferenz</span><span class="detail-stat-val ${teamRow.goals_diff >= 0 ? 't-diff-pos' : 't-diff-neg'}">${teamRow.goals_diff > 0 ? '+' : ''}${teamRow.goals_diff}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">Punkte</span><span class="detail-stat-val" style="font-size:1.1rem">${teamRow.points}</span></div>
    </div>

    <!-- Heimsieg/Auswärtsbilanz + Form -->
    <div>
      <div class="glass detail-card" style="margin-bottom:14px">
        <div class="card-lbl">Heim / Auswärts</div>
        <div class="detail-stat-row"><span class="detail-stat-lbl">Heim: Siege</span><span class="detail-stat-val">${heimS} / ${heimSp}</span></div>
        <div class="detail-stat-row"><span class="detail-stat-lbl">Heim: Niederlagen</span><span class="detail-stat-val">${heimN} / ${heimSp}</span></div>
        <div class="detail-stat-row"><span class="detail-stat-lbl">Auswärts: Siege</span><span class="detail-stat-val">${ausS} / ${ausSp}</span></div>
        <div class="detail-stat-row"><span class="detail-stat-lbl">Auswärts: Niederlagen</span><span class="detail-stat-val">${ausN} / ${ausSp}</span></div>
      </div>
      <div class="glass detail-card">
        <div class="card-lbl">Formkurve (letzte 5)</div>
        <div class="form-strip">${formHTML}</div>
        <div style="font-size:.68rem;color:rgba(255,255,255,.25);margin-top:8px">S = Sieg · OT = Overtime · N = Niederlage</div>
      </div>
    </div>

    <!-- Letzte Spiele -->
    <div class="glass detail-card detail-full">
      <div class="card-lbl">Letzte Spiele</div>
      ${letzteSpiele.length === 0 ? '<div style="color:rgba(255,255,255,.3);font-size:.8rem">Noch keine Spiele gespielt.</div>' : `
      <table class="team-spiele-table">
        <thead><tr><th>Datum</th><th>H/A</th><th>Gegner</th><th style="text-align:right">Ergebnis</th></tr></thead>
        <tbody>${spieleRows}</tbody>
      </table>`}
    </div>

    <!-- Scorer -->
    <div class="glass detail-card detail-full">
      <div class="card-lbl">Scorer</div>
      ${teamScorer.length === 0 ? '<div style="color:rgba(255,255,255,.3);font-size:.8rem">Keine Scorer-Daten.</div>' : `
      <table class="scorer-table">
        <thead><tr><th>#</th><th>Spieler</th><th>G</th><th>A</th><th>Pkt</th><th>PIM</th></tr></thead>
        <tbody>${scorerRows}</tbody>
      </table>`}
    </div>

  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// TAB 5: ALLTIME
// ─────────────────────────────────────────────────────────────────────────────

function istDamen(ligaName) {
  return /damen|frauen/i.test(ligaName);
}

// Alle Saisons aller Ligen des aktiven Verbands — dedupliziert nach id
function getAktivVerbandSaisons() {
  const verband = document.getElementById('verband-select')?.value || '';
  if (!verband) return [];
  const seen = new Set();
  return alleligen.filter(l => {
    if (l.game_operation !== verband || seen.has(l.id)) return false;
    seen.add(l.id);
    return true;
  });
}

// Alltime-Daten parallel laden
async function ladeAlltimeDaten() {
  if (alltimeGeladen) return;
  const saisons = getAktivVerbandSaisons();
  if (!saisons.length) {
    document.getElementById('content-alltime').innerHTML =
      '<div class="error-box">Keine Saisons für diese Liga gefunden.</div>';
    return;
  }

  // Fortschritts-Anzeige
  document.getElementById('content-alltime').innerHTML =
    `<div class="lade-info"><div class="spinner"></div><span id="alltime-progress">Lade Saison 0/${saisons.length}…</span></div>`;

  let fertig = 0, fehler = 0;
  const BATCH = 10; // max. gleichzeitige Anfragen → verhindert Rate-Limiting
  try {
    const ergebnisse = [];
    for (let i = 0; i < saisons.length; i += BATCH) {
      const batch = saisons.slice(i, i + BATCH);
      const batchResults = await Promise.all(
        batch.map(s =>
          Promise.all([
            fetchJSON(`${API_BASE}/api/v2/leagues/${s.id}/scorer.json`).catch(() => { fehler++; return []; }),
            fetchJSON(`${API_BASE}/api/v2/leagues/${s.id}/table.json`).catch(() => { fehler++; return []; }),
          ]).then(([sc, ta]) => {
            fertig++;
            const el = document.getElementById('alltime-progress');
            if (el) el.textContent = `Lade Saison ${fertig}/${saisons.length}…`;
            return { ligaId: s.id, saison: s.season || String(s.id), ligaName: s.name, scorer: sc, table: ta };
          })
        )
      );
      ergebnisse.push(...batchResults);
    }
    if (fehler > 0) console.warn(`Alltime: ${fehler} Requests fehlgeschlagen (von ${saisons.length * 2} gesamt)`);

    alltimeRohdaten = ergebnisse;
    alltimeGeladen  = true;
    alltimeLigaFilter.clear();
    aggregiereUndRenderAlltime();
    renderAlltimeLigaPanel();
  } catch (e) {
    console.error(e);
    document.getElementById('content-alltime').innerHTML =
      `<div class="error-box">Fehler beim Laden: ${e.message}</div>`;
  }
}

// Re-Aggregation mit aktivem Ligen-Filter (kein neuer Fetch)
function aggregiereUndRenderAlltime() {
  if (!alltimeRohdaten) return;
  const gefiltert = (alltimeLigaFilter.size === 0 && !alltimeLigaNoneMode)
    ? alltimeRohdaten
    : alltimeRohdaten.filter(e => alltimeLigaFilter.has(e.ligaId));
  alltimeDaten = aggregiereAlltime(gefiltert);
  alltimeSpielerSeite = 1;
  alltimeTeamSeite    = 1;
  renderAlltime();
  aktualisiereLigaBtn();
}

function aktualisiereLigaBtn() {
  const btn = document.getElementById('alltime-liga-btn');
  if (!btn) return;
  const n = alltimeLigaFilter.size;
  if (n === 0 && alltimeLigaNoneMode) {
    btn.textContent = 'Keine Ligen ▾';
    btn.classList.add('active');
  } else if (n === 0) {
    btn.textContent = 'Alle Ligen ▾';
    btn.classList.remove('active');
  } else {
    btn.textContent = `${n} Liga${n > 1 ? 'en' : ''} ▾`;
    btn.classList.add('active');
  }
}

function toggleAlltimeLigaPanel(e) {
  if (e) e.stopPropagation();
  alltimeLigaPanelOffen = !alltimeLigaPanelOffen;
  const panel = document.getElementById('alltime-liga-panel');
  if (panel) panel.classList.toggle('offen', alltimeLigaPanelOffen);
  if (alltimeLigaPanelOffen) {
    const inp = document.getElementById('alltime-liga-suche');
    if (inp) inp.focus();
  }
}

// Panel außerhalb schließen
document.addEventListener('click', e => {
  if (alltimeLigaPanelOffen && !document.getElementById('alltime-liga-wrap')?.contains(e.target)) {
    alltimeLigaPanelOffen = false;
    document.getElementById('alltime-liga-panel')?.classList.remove('offen');
  }
});

function renderAlltimeLigaPanel() {
  const list = document.getElementById('alltime-liga-list');
  if (!list || !alltimeRohdaten) return;
  const suche = alltimeLigaSuche.trim().toLowerCase();

  // Eindeutige Ligen aus Rohdaten extrahieren (id + name + saison)
  const ligas = [];
  const seen = new Set();
  for (const e of alltimeRohdaten) {
    if (!seen.has(e.ligaId)) {
      seen.add(e.ligaId);
      ligas.push({ id: e.ligaId, name: e.ligaName, saison: e.saison });
    }
  }
  // Nach Name sortieren, dann Saison absteigend
  ligas.sort((a, b) => a.name.localeCompare(b.name, 'de') || (parseInt(b.saison)||0) - (parseInt(a.saison)||0));

  const gefiltert = suche ? ligas.filter(l => l.name.toLowerCase().includes(suche)) : ligas;

  list.innerHTML = gefiltert.map(l => {
    const checked = !alltimeLigaNoneMode && (alltimeLigaFilter.size === 0 || alltimeLigaFilter.has(l.id));
    const jahr = l.saison ? ` <span style="color:rgba(255,255,255,.35);font-size:.7rem">${saisonJahr(l.saison)}</span>` : '';
    return `<label class="liga-check-item">
      <input type="checkbox" ${checked ? 'checked' : ''}
             onchange="onAlltimeLigaToggle(${l.id}, this.checked)">
      ${esc(l.name)}${jahr}
    </label>`;
  }).join('');
}

function onAlltimeLigaToggle(id, checked) {
  if (checked) {
    // Aus noneMode: einfach diese Liga hinzufügen
    alltimeLigaNoneMode = false;
    alltimeLigaFilter.add(id);
    // Aus "alle"-Modus: erst alle sammeln, dann diesen lassen
  } else {
    // Aus "alle"-Modus: erst alle IDs füllen, dann diese entfernen
    if (alltimeLigaFilter.size === 0 && !alltimeLigaNoneMode) {
      if (!alltimeRohdaten) return;
      new Set(alltimeRohdaten.map(e => e.ligaId)).forEach(i => alltimeLigaFilter.add(i));
    }
    alltimeLigaFilter.delete(id);
    // Letzten entfernt → noneMode
    if (alltimeLigaFilter.size === 0) alltimeLigaNoneMode = true;
  }
  // Wenn wieder alle ausgewählt: zurück auf "alle"-Modus
  const uniqueIds = new Set(alltimeRohdaten?.map(e => e.ligaId) || []);
  if (!alltimeLigaNoneMode && alltimeLigaFilter.size >= uniqueIds.size &&
      [...uniqueIds].every(i => alltimeLigaFilter.has(i))) {
    alltimeLigaFilter.clear();
    alltimeLigaNoneMode = false;
  }
  aggregiereUndRenderAlltime();
  renderAlltimeLigaPanel();
}

function alltimeLigaAlleAuswaehlen() {
  alltimeLigaFilter.clear();
  alltimeLigaNoneMode = false;
  aggregiereUndRenderAlltime();
  renderAlltimeLigaPanel();
}

function alltimeLigaKeineAuswaehlen() {
  alltimeLigaFilter.clear();
  alltimeLigaNoneMode = true;
  alltimeDaten = aggregiereAlltime([]);
  alltimeSpielerSeite = 1;
  alltimeTeamSeite    = 1;
  renderAlltime();
  aktualisiereLigaBtn();
  renderAlltimeLigaPanel();
}

// Aggregation: scorer + table über alle Saisons zusammenführen
// Teams werden nach team_name (normalisiert) aggregiert, nicht nach team_id —
// da die API pro Saison neue IDs vergibt, würden sonst Vereine mehrfach auftauchen.
function aggregiereAlltime(ergebnisse) {
  const spielerMap     = {};
  const teamMap        = {}; // key: team_name.trim() (normalisiert)
  const teamPenaltyMap = {}; // key: team_name.trim() (aus scorer.json)

  ergebnisse.forEach(({ saison, ligaName, scorer: sc, table: ta }) => {
    const gender = istDamen(ligaName) ? 'damen' : 'herren';

    // ── Spieler + Team-Strafen aus Scorer ────────────────────────────────────
    (sc || []).forEach(s => {
      const key = s.player_id;
      if (!key) return;
      if (!spielerMap[key]) {
        spielerMap[key] = {
          player_id:  key,
          first_name: s.first_name,
          last_name:  s.last_name,
          games: 0, goals: 0, assists: 0, pim: 0,
          p2: 0, p2and2: 0, p5: 0, p10: 0, ms: 0,
          teams:      new Set(),
          ligaGender: gender,
        };
      }
      const sp = spielerMap[key];
      sp.first_name = s.first_name;
      sp.last_name  = s.last_name;
      sp.games   += (s.games         || 0);
      sp.goals   += (s.goals         || 0);
      sp.assists += (s.assists        || 0);
      sp.pim     += pim(s);
      sp.p2      += (s.penalty_2     || 0);
      sp.p2and2  += (s.penalty_2and2 || 0);
      sp.p5      += (s.penalty_5     || 0);
      sp.p10     += (s.penalty_10    || 0);
      sp.ms      += (s.penalty_match || 0) + (s.penalty_ms_tech || 0) +
                    (s.penalty_ms_full || 0) + (s.penalty_ms1 || 0) + (s.penalty_ms2 || 0);
      if (s.team_name) sp.teams.add(s.team_name);

      // Team-Strafen nach team_name akkumulieren (teamMap noch nicht vollständig)
      const tname = (s.team_name || '').trim();
      if (tname) {
        if (!teamPenaltyMap[tname])
          teamPenaltyMap[tname] = { p2:0, p2and2:0, p5:0, p10:0, ms:0, pim:0 };
        const tp = teamPenaltyMap[tname];
        tp.p2    += (s.penalty_2     || 0);
        tp.p2and2+= (s.penalty_2and2 || 0);
        tp.p5    += (s.penalty_5     || 0);
        tp.p10   += (s.penalty_10    || 0);
        tp.ms    += (s.penalty_match || 0) + (s.penalty_ms_tech || 0) +
                    (s.penalty_ms_full || 0) + (s.penalty_ms1 || 0) + (s.penalty_ms2 || 0);
        tp.pim   += pim(s);
      }
    });

    // ── Teams aus table.json — nach team_name aggregieren ────────────────────
    (ta || []).forEach(t => {
      const tname = (t.team_name || '').trim();
      if (!tname) return;

      if (!teamMap[tname]) {
        teamMap[tname] = {
          team_name:  tname,
          team_logo:  t.team_logo_small || t.team_logo,
          saisons:    0, games: 0, won: 0, won_ot: 0,
          lost_ot:    0, lost: 0,
          goals_scored: 0, goals_received: 0, points: 0,
          pim: 0, p2: 0, p2and2: 0, p5: 0, p10: 0, ms: 0,
          ligaGender: gender,
          bestSaison: null, // beste Einzelsaison (nach Punkten)
        };
      }
      const tm = teamMap[tname];
      // Logo aktualisieren wenn vorhanden
      if (t.team_logo_small || t.team_logo) tm.team_logo = t.team_logo_small || t.team_logo;

      tm.saisons        += 1;
      tm.games          += (t.games          || 0);
      tm.won            += (t.won            || 0);
      tm.won_ot         += (t.won_ot         || 0);
      tm.lost_ot        += (t.lost_ot        || 0);
      tm.lost           += (t.lost           || 0);
      tm.goals_scored   += (t.goals_scored   || 0);
      tm.goals_received += (t.goals_received || 0);
      tm.points         += (t.points         || 0);

      // Beste Einzelsaison festhalten
      const snap = {
        points:         t.points          || 0,
        games:          t.games           || 0,
        won:            t.won             || 0,
        won_ot:         t.won_ot          || 0,
        lost_ot:        t.lost_ot         || 0,
        lost:           t.lost            || 0,
        goals_scored:   t.goals_scored    || 0,
        goals_received: t.goals_received  || 0,
        goals_diff:     (t.goals_scored||0) - (t.goals_received||0),
        ligaName:       ligaName,
        saison:         saison,
      };
      if (!tm.bestSaison || snap.points > tm.bestSaison.points) {
        tm.bestSaison = snap;
      }
    });
  });

  // Strafen-Daten in teamMap eintragen
  Object.entries(teamPenaltyMap).forEach(([tname, pen]) => {
    const tm = teamMap[tname];
    if (!tm) return;
    tm.p2    += pen.p2;
    tm.p2and2+= pen.p2and2;
    tm.p5    += pen.p5;
    tm.p10   += pen.p10;
    tm.ms    += pen.ms;
    tm.pim   += pen.pim;
  });

  // Maps → Arrays
  const spieler = Object.values(spielerMap).map(s => ({
    ...s,
    punkte: s.goals + s.assists,
    teams:  [...s.teams].join(', '),
  }));
  const teams = Object.values(teamMap).map(t => ({
    ...t,
    goals_diff: t.goals_scored - t.goals_received,
  }));

  return { spieler, teams };
}

// Haupt-Render: routet je nach alltimeView
function renderAlltime() {
  if (!alltimeDaten) return;

  // Geschlechter-Info-Zeile aktualisieren
  const saisons   = getAktivVerbandSaisons();
  const verband   = document.getElementById('verband-select')?.value || '';
  const anzHerren = saisons.filter(s => !istDamen(s.name)).length;
  const anzDamen  = saisons.filter(s =>  istDamen(s.name)).length;
  const hint = document.getElementById('gender-hint');
  hint.innerHTML = `<div class="gender-hint">
    ${verband} &nbsp;·&nbsp; ${saisons.length} Saisons
    &nbsp;·&nbsp; ${anzHerren} Herren &nbsp;·&nbsp; ${anzDamen} Damen
  </div>`;

  if (alltimeView === 'teams') {
    renderAlltimeTeams();
  } else {
    renderAlltimeSpieler();
  }
}

function renderAlltimeSpieler() {
  const suche = alltimeSuche.toLowerCase();

  let spieler = alltimeDaten.spieler;
  if (alltimeGender !== 'alle') spieler = spieler.filter(s => s.ligaGender === alltimeGender);
  if (suche) spieler = spieler.filter(s =>
    `${s.first_name} ${s.last_name}`.toLowerCase().includes(suche) ||
    s.teams.toLowerCase().includes(suche)
  );
  spieler = [...spieler].sort((a, b) => {
    const sp = x => x.games || 1;
    if (alltimeSortS === 'tore')    return b.goals         - a.goals;
    if (alltimeSortS === 'assists') return b.assists        - a.assists;
    if (alltimeSortS === 'spiele')  return b.games          - a.games;
    if (alltimeSortS === 'pim')     return (b.pim||0)       - (a.pim||0);
    if (alltimeSortS === 'p2')      return (b.p2||0)        - (a.p2||0);
    if (alltimeSortS === 'p2and2')  return (b.p2and2||0)    - (a.p2and2||0);
    if (alltimeSortS === 'p5')      return (b.p5||0)        - (a.p5||0);
    if (alltimeSortS === 'p10')     return (b.p10||0)       - (a.p10||0);
    if (alltimeSortS === 'ms')      return (b.ms||0)        - (a.ms||0);
    if (alltimeSortS === 'pkt_sp')  return b.punkte/sp(b)   - a.punkte/sp(a);
    if (alltimeSortS === 'g_sp')    return b.goals/sp(b)    - a.goals/sp(a);
    if (alltimeSortS === 'a_sp')    return b.assists/sp(b)  - a.assists/sp(a);
    if (alltimeSortS === 'pim_sp')  return (b.pim||0)/sp(b) - (a.pim||0)/sp(a);
    return b.punkte - a.punkte || b.goals - a.goals;
  });

  const gesamtSpieler = spieler.length;
  spieler = spieler.slice((alltimeSpielerSeite - 1) * PAGE_SIZE, alltimeSpielerSeite * PAGE_SIZE);

  const sHdr = (key, label, title) => {
    const tt = title ? ` title="${title}"` : '';
    return `<th class="${alltimeSortS === key ? 'at-sort-active' : ''}" onclick="setAlltimeSortS('${key}')"${tt}>${label}</th>`;
  };

  const rows = spieler.map((s, i) => {

function setAlltimeTeamMode(mode) {

function renderAlltimeTeams() {
  const suche = alltimeSuche.toLowerCase();

  let teams = alltimeDaten.teams;
  if (alltimeGender !== 'alle') teams = teams.filter(t => t.ligaGender === alltimeGender);
  if (suche) teams = teams.filter(t => t.team_name.toLowerCase().includes(suche));

  // Mode-Toggle HTML (wird in den Titel eingebettet)
  const modeToggle = `
    <span style="margin-left:auto;display:inline-flex;gap:6px;font-size:.75rem;font-weight:400">
      <button class="filter-btn${alltimeTeamMode==='total'?' active':''}" style="padding:3px 10px;font-size:.72rem" onclick="setAlltimeTeamMode('total')">Gesamt</button>
      <button class="filter-btn${alltimeTeamMode==='best'?' active':''}"  style="padding:3px 10px;font-size:.72rem" onclick="setAlltimeTeamMode('best')">Beste Saison</button>
    </span>`;

  if (alltimeTeamMode === 'best') {
    renderAlltimeTeamsBest(teams, modeToggle);
  } else {
    renderAlltimeTeamsTotal(teams, modeToggle);
  }
}

// ── Gesamt-Ansicht ────────────────────────────────────────────────────────────
function renderAlltimeTeamsTotal(teams, modeToggle) {
  const gesamtTeams = teams.length;
  teams = [...teams].sort((a, b) => {
    const sp = x => x.games || 1;
    if (alltimeSortT === 'saisons')        return b.saisons          - a.saisons;
    if (alltimeSortT === 'games')          return b.games            - a.games;
    if (alltimeSortT === 'won')            return b.won              - a.won;
    if (alltimeSortT === 'won_ot')         return b.won_ot           - a.won_ot;
    if (alltimeSortT === 'lost_ot')        return b.lost_ot          - a.lost_ot;
    if (alltimeSortT === 'lost')           return b.lost             - a.lost;
    if (alltimeSortT === 'goals_scored')   return b.goals_scored     - a.goals_scored;
    if (alltimeSortT === 'goals_received') return b.goals_received   - a.goals_received;
    if (alltimeSortT === 'diff')           return b.goals_diff       - a.goals_diff;
    if (alltimeSortT === 'pim')            return (b.pim||0)         - (a.pim||0);
    if (alltimeSortT === 'p2')             return (b.p2||0)          - (a.p2||0);
    if (alltimeSortT === 'p2and2')         return (b.p2and2||0)      - (a.p2and2||0);
    if (alltimeSortT === 'p5')             return (b.p5||0)          - (a.p5||0);
    if (alltimeSortT === 'p10')            return (b.p10||0)         - (a.p10||0);
    if (alltimeSortT === 'ms')             return (b.ms||0)          - (a.ms||0);
    if (alltimeSortT === 'pkt_sp')         return b.points/sp(b)     - a.points/sp(a);
    if (alltimeSortT === 't_sp')           return b.goals_scored/sp(b)   - a.goals_scored/sp(a);
    if (alltimeSortT === 'g_sp')           return b.goals_received/sp(b) - a.goals_received/sp(a);
    if (alltimeSortT === 'pim_sp')         return (b.pim||0)/sp(b)   - (a.pim||0)/sp(a);
    return b.points - a.points || b.goals_diff - a.goals_diff;
  });

  teams = teams.slice((alltimeTeamSeite - 1) * PAGE_SIZE, alltimeTeamSeite * PAGE_SIZE);

  const tHdr = (key, label, title) => {
    const tt = title ? ` title="${title}"` : '';
    return `<th class="${alltimeSortT===key?'at-sort-active':''}" onclick="setAlltimeSortT('${key}')"${tt}>${label}</th>`;
  };

  const rows = teams.map((t, i) => {
    const sp      = t.games || 1;
    const diff    = t.goals_diff;
    const diffCls = diff > 0 ? 'at-diff-pos' : diff < 0 ? 'at-diff-neg' : '';
    const diffTxt = diff > 0 ? `+${diff}` : String(diff);
    const logo    = logoUrl(t.team_logo);
    return `<tr>
      <td>${i+1}</td>
      <td><div class="t-team">
        ${logo ? `<img class="t-logo" src="${logo}" alt="" onerror="this.style.display='none'">` : '<div class="t-logo-placeholder"></div>'}
        <span>${t.team_name}</span>
      </div></td>
      <td>${t.saisons}</td>
      <td>${t.games}</td>
      <td>${t.won}</td>
      <td>${t.won_ot}</td>
      <td>${t.lost_ot}</td>
      <td>${t.lost}</td>
      <td>${t.goals_scored}:${t.goals_received}</td>
      <td class="${diffCls}">${diffTxt}</td>
      <td class="at-pkt">${t.points}</td>
      ${alltimeStrafenDetails
        ? `<td>${t.p2||0}</td><td>${t.p2and2||0}</td><td>${t.p5||0}</td><td>${t.p10||0}</td><td>${t.ms||0}</td>`
        : ''}
      <td>${t.pim||0}'</td>
      ${alltimePerGame
        ? `<td>${(t.points/sp).toFixed(2)}</td><td>${(t.goals_scored/sp).toFixed(2)}</td><td>${(t.goals_received/sp).toFixed(2)}</td><td>${((t.pim||0)/sp).toFixed(2)}'</td>`
        : ''}
    </tr>`;
  }).join('');

  const colCount = 12 + (alltimeStrafenDetails ? 5 : 0) + (alltimePerGame ? 4 : 0);

  document.getElementById('content-alltime').innerHTML = `
  <div class="alltime-section">
    <div class="alltime-section-title" style="display:flex;align-items:center">
      Ewige Teamtabelle &nbsp;·&nbsp; ${gesamtTeams} Teams ${modeToggle}
    </div>
    <div class="glass">
      <table class="at-table">
        <thead><tr>
          <th>#</th><th>Team</th>
          ${tHdr('saisons','Sai','Saisons')}
          ${tHdr('games','Sp','Spiele')}
          ${tHdr('won','S','Siege')}
          ${tHdr('won_ot','OTS','OT-Siege')}
          ${tHdr('lost_ot','OTN','OT-Niederlagen')}
          ${tHdr('lost','N','Niederlagen')}
          <th>T:G</th>
          ${tHdr('diff','Diff','Tordifferenz')}
          ${tHdr('punkte','Pkt','Punkte')}
          ${alltimeStrafenDetails
            ? `${tHdr('p2',"2'",'2-Min-Strafen')}${tHdr('p2and2','2+2','2+2-Min-Strafen')}${tHdr('p5',"5'",'5-Min-Strafen')}${tHdr('p10',"10'",'10-Min-Strafen')}${tHdr('ms','MS','Matchstrafen')}`
            : ''}
          ${tHdr('pim','PIM','Strafminuten gesamt')}
          ${alltimePerGame
            ? `${tHdr('pkt_sp','Pkt/Sp','Punkte pro Spiel')}${tHdr('t_sp','T/Sp','Tore pro Spiel')}${tHdr('g_sp','G/Sp','Gegentore pro Spiel')}${tHdr('pim_sp','PIM/Sp','PIM pro Spiel')}`
            : ''}
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="${colCount}" style="text-align:center;padding:20px;color:rgba(255,255,255,.3)">Keine Einträge</td></tr>`}</tbody>
      </table>
    </div>
    ${paginierungsHTML(gesamtTeams, alltimeTeamSeite, 'setAlltimeTeamSeite')}
  </div>`;
}

// ── Beste-Saison-Ansicht ──────────────────────────────────────────────────────
function renderAlltimeTeamsBest(teams, modeToggle) {
  // Nur Teams mit mindestens einer Saison
  teams = teams.filter(t => t.bestSaison);

  const gesamtTeams = teams.length;
  teams = [...teams].sort((a, b) => {
    const bA = a.bestSaison, bB = b.bestSaison;
    if (alltimeTeamBestSort === 'games')          return bB.games          - bA.games;
    if (alltimeTeamBestSort === 'won')            return bB.won            - bA.won;
    if (alltimeTeamBestSort === 'won_ot')         return bB.won_ot         - bA.won_ot;
    if (alltimeTeamBestSort === 'lost_ot')        return bB.lost_ot        - bA.lost_ot;
    if (alltimeTeamBestSort === 'lost')           return bB.lost           - bA.lost;
    if (alltimeTeamBestSort === 'goals_scored')   return bB.goals_scored   - bA.goals_scored;
    if (alltimeTeamBestSort === 'goals_received') return bB.goals_received - bA.goals_received;
    if (alltimeTeamBestSort === 'diff')           return bB.goals_diff     - bA.goals_diff;
    return bB.points - bA.points || bB.goals_diff - bA.goals_diff; // punkte
  });

  teams = teams.slice((alltimeTeamSeite - 1) * PAGE_SIZE, alltimeTeamSeite * PAGE_SIZE);

  const bHdr = (key, label, title) => {
    const tt = title ? ` title="${title}"` : '';
    return `<th class="${alltimeTeamBestSort===key?'at-sort-active':''}" onclick="alltimeTeamBestSort='${key}';renderAlltimeTeamsBest(alltimeDaten?.teams?.filter(t=>t.bestSaison&&(alltimeGender==='alle'||t.ligaGender===alltimeGender)&&(!alltimeSuche||t.team_name.toLowerCase().includes(alltimeSuche.toLowerCase()))),document.querySelector('.at-mode-toggle')?.outerHTML||'')"${tt}>${label}</th>`;
  };

  const rows = teams.map((t, i) => {
    const bs      = t.bestSaison;
    const diff    = bs.goals_diff;
    const diffCls = diff > 0 ? 'at-diff-pos' : diff < 0 ? 'at-diff-neg' : '';
    const diffTxt = diff > 0 ? `+${diff}` : String(diff);
    const logo    = logoUrl(t.team_logo);
    return `<tr>
      <td>${i+1}</td>
      <td><div class="t-team">
        ${logo ? `<img class="t-logo" src="${logo}" alt="" onerror="this.style.display='none'">` : '<div class="t-logo-placeholder"></div>'}
        <span>${t.team_name}</span>
      </div></td>
      <td style="font-size:.72rem;color:rgba(255,255,255,.45);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${bs.ligaName}">${bs.ligaName}</td>
      <td style="font-size:.72rem;color:rgba(255,255,255,.3)">${bs.saison || '—'}</td>
      <td>${bs.games}</td>
      <td>${bs.won}</td>
      <td>${bs.won_ot}</td>
      <td>${bs.lost_ot}</td>
      <td>${bs.lost}</td>
      <td>${bs.goals_scored}:${bs.goals_received}</td>
      <td class="${diffCls}">${diffTxt}</td>
      <td class="at-pkt">${bs.points}</td>
    </tr>`;
  }).join('');

  const bHdrSimple = (key, label, title) => {
    const tt = title ? ` title="${title}"` : '';
    return `<th class="${alltimeTeamBestSort===key?'at-sort-active':''}" onclick="alltimeTeamBestSort='${key}';renderAlltimeTeams()"${tt}>${label}</th>`;
  };

  document.getElementById('content-alltime').innerHTML = `
  <div class="alltime-section">
    <div class="alltime-section-title" style="display:flex;align-items:center">
      Beste Saison je Team &nbsp;·&nbsp; ${gesamtTeams} Teams ${modeToggle}
    </div>
    <div class="glass">
      <table class="at-table">
        <thead><tr>
          <th>#</th><th>Team</th>
          <th title="Liga der besten Saison">Liga</th>
          <th title="Saison">Sai</th>
          ${bHdrSimple('games','Sp','Spiele')}
          ${bHdrSimple('won','S','Siege')}
          ${bHdrSimple('won_ot','OTS','OT-Siege')}
          ${bHdrSimple('lost_ot','OTN','OT-Niederlagen')}
          ${bHdrSimple('lost','N','Niederlagen')}
          <th>T:G</th>
          ${bHdrSimple('diff','Diff','Tordifferenz')}
          ${bHdrSimple('punkte','Pkt','Punkte')}
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="12" style="text-align:center;padding:20px;color:rgba(255,255,255,.3)">Keine Einträge</td></tr>'}</tbody>
      </table>
    </div>
    ${paginierungsHTML(gesamtTeams, alltimeTeamSeite, 'setAlltimeTeamSeite')}
  </div>`;
}

// TAB 6: ALLTIME DEUTSCHLAND — alltime.json laden und anzeigen

async function ladeStaticAlltime() {
  if (staticGeladen) return;
  document.getElementById('content-static').innerHTML =
    '<div class="lade-info"><div class="spinner"></div><span>Lade alltime.json…</span></div>';
  try {
    staticDaten   = await fetchJSON('data/alltime.json');
    staticGeladen = true;
    renderStaticAlltime();
  } catch(e) {
    document.getElementById('content-static').innerHTML =
      `<div class="error-box">
        data/alltime.json nicht erreichbar.<br>
        <small>Fehler: <b>${e.message || e}</b><br><br>
        Mögliche Ursachen:<br>
        1. Seite per Doppelklick geöffnet → bitte über <b>start.py</b> öffnen (http://localhost:8080)<br>
        2. alltime.json noch nicht generiert → <b>python tools/alltime.py</b> ausführen</small>
      </div>`;
  }
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderStaticAlltime() {
  if (!staticDaten) return;
  // Controls je nach View anpassen
  const isKader = staticView === 'kader';
  document.getElementById('static-gender-btns').style.display  = isKader ? 'none' : '';
  document.getElementById('static-toggle-sep').style.display   = isKader ? 'none' : '';
  document.getElementById('static-strafen-btn').style.display  = isKader ? 'none' : '';
  document.getElementById('static-pergame-btn').style.display  = isKader ? 'none' : '';
  document.getElementById('static-suche-sep').style.display    = isKader ? 'none' : '';
  document.getElementById('static-suche').style.display        = isKader ? 'none' : '';
  if (isKader) { renderStaticKader(); return; }
  const suche = staticSuche.trim().toLowerCase();

  // ── Spieler filtern + sortieren ───────────────────────────────────────────
  let spieler = staticDaten.scorer || [];
  if (staticGender !== 'alle') spieler = spieler.filter(s => s.geschlecht === staticGender);
  if (suche) spieler = spieler.filter(s =>
    (s.first_name + ' ' + s.last_name).toLowerCase().includes(suche) ||
    (s.teams || []).some(t => t.toLowerCase().includes(suche))
  );
  spieler = [...spieler].sort((a, b) => {
    const sp = x => x.spiele || 1;
    if (staticSortS === 'pkt_sp') return b.punkte/sp(b)        - a.punkte/sp(a);
    if (staticSortS === 'g_sp')   return b.tore/sp(b)          - a.tore/sp(a);
    if (staticSortS === 'a_sp')   return b.assists/sp(b)       - a.assists/sp(a);
    if (staticSortS === 'pim_sp') return b.strafminuten/sp(b)  - a.strafminuten/sp(a);
    return (b[staticSortS] || 0) - (a[staticSortS] || 0);
  });
  const gesamtStaticSpieler = spieler.length;
  spieler = spieler.slice((staticSpielerSeite - 1) * PAGE_SIZE, staticSpielerSeite * PAGE_SIZE);

  // ── Hilfsfunktion für sortierbare Spaltenköpfe ───────────────────────────
  const sHdr = (key, label) =>
    `<th class="${staticSortS===key?'at-sort-active':''}" onclick="setStaticSortS('${key}')">${label}</th>`;

  // ── Scorer-Zeilen ─────────────────────────────────────────────────────────
  const scorerRows = spieler.map((s, i) => {
    const name    = `${s.first_name} ${s.last_name}`;
    const teamStr = (s.teams || []).join(', ') || '—';
    const sp      = s.spiele || 1;
    return `<tr>
      <td class="at-rank">${i + 1}</td>
      <td class="at-name">${esc(name)}</td>
      <td class="at-team" title="${esc(teamStr)}">${esc(teamStr.length > 40 ? teamStr.slice(0,38)+'…' : teamStr)}</td>
      <td>${s.spiele}</td>
      <td>${s.tore}</td>
      <td>${s.assists}</td>
      <td class="at-pkt">${s.punkte}</td>
      ${staticStrafenDetails
        ? `<td>${s.p2 || 0}</td><td>${s.p2and2 || 0}</td><td>${s.p5 || 0}</td><td>${s.p10 || 0}</td><td>${s.ms || 0}</td>`
        : ''}
      <td>${s.strafminuten}'</td>
      ${staticPerGame
        ? `<td>${(s.punkte / sp).toFixed(2)}</td><td>${(s.tore / sp).toFixed(2)}</td><td>${(s.assists / sp).toFixed(2)}</td><td>${(s.strafminuten / sp).toFixed(2)}'</td>`
        : ''}
    </tr>`;
  }).join('');

  // ── Stand-Info ────────────────────────────────────────────────────────────
  const stand = staticDaten.generiert
    ? `Stand: ${staticDaten.generiert} · ${staticDaten.ligen_gesamt} Ligen`
    : '';

  const scorerColCount = 8 + (staticStrafenDetails ? 5 : 0) + (staticPerGame ? 4 : 0);

  document.getElementById('content-static').innerHTML = `
  <div class="alltime-section">
    <div class="alltime-section-title">
      🇩🇪 Ewige Scorerliste &nbsp;·&nbsp; ${gesamtStaticSpieler} Spieler
      <span style="font-size:.72rem;font-weight:400;color:rgba(255,255,255,.35);margin-left:12px">${stand}</span>
    </div>
    <div class="glass">
      <table class="at-table">
        <thead><tr>
          <th>#</th>
          <th>Spieler</th>
          <th>Team(s)</th>
          ${sHdr('spiele','Sp')}
          ${sHdr('tore','G')}
          ${sHdr('assists','A')}
          ${sHdr('punkte','Pkt')}
          ${staticStrafenDetails
            ? `${sHdr('p2',"2'",'2-Minuten-Strafen')}${sHdr('p2and2','2+2','2+2-Minuten-Strafen')}${sHdr('p5',"5'",'5-Minuten-Strafen')}${sHdr('p10',"10'",'10-Minuten-Strafen')}${sHdr('ms','MS','Matchstrafen (alle Arten)')}`
            : ''}
          ${sHdr('strafminuten','PIM')}
          ${staticPerGame
            ? `${sHdr('pkt_sp','Pkt/Sp','Punkte pro Spiel')}${sHdr('g_sp','G/Sp','Tore pro Spiel')}${sHdr('a_sp','A/Sp','Assists pro Spiel')}${sHdr('pim_sp','PIM/Sp','PIM pro Spiel')}`
            : ''}
        </tr></thead>
        <tbody>${scorerRows || `<tr><td colspan="${scorerColCount}" style="text-align:center;padding:20px;color:rgba(255,255,255,.3)">Keine Einträge</td></tr>`}</tbody>
      </table>
    </div>
    ${paginierungsHTML(gesamtStaticSpieler, staticSpielerSeite, 'setStaticSpielerSeite')}
  </div>`;
}
