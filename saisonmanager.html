/**
 * Baut den Turnierbaum-HTML-String aus einem Spiele-Array.
 * Jede Runde = eine Spalte. Alle Spiele direkt ausgeklappt.
 * Best-of-Serien (gleiche Teams, gleiche Runde) bekommen einen Gruppen-Header.
 */
function baueBracket(spiele, _unused, startRunde = 1) {
  // 1. Runden ermitteln
  const rundenMap = {};
  spiele.forEach(s => {
    const r = s.game_day_number ?? s.game_day ?? 1;
    if (!rundenMap[r]) rundenMap[r] = [];
    rundenMap[r].push(s);
  });
  const rundenNrn = Object.keys(rundenMap).map(Number).sort((a,b) => a - b)
                          .filter(n => n >= startRunde);
  if (!rundenNrn.length) return '<div class="lade-info"><span>Keine Spiele gefunden.</span></div>';

  // 2. Normierter Team-Paar-Key für Serien (nach Name sortiert, IDs oft nicht vorhanden)
  function serienKey(s) {
    return [s.home_team_name || '', s.guest_team_name || ''].sort().join('|||');
  }

  // 3. Spiele einer Runde nach Team-Paar gruppieren
  //    Innerhalb einer Gruppe: nach Datum sortiert
  //    Gruppen-Reihenfolge: nach erstem Spieldatum der Gruppe
  function gruppiereRunde(rSpiele) {
    const map = {};
    const order = [];   // Reihenfolge der Keys beim ersten Auftreten
    rSpiele.forEach(s => {
      const k = serienKey(s);
      if (!map[k]) {
        map[k] = { spiele: [] };
        order.push(k);
      }
      map[k].spiele.push(s);
    });
    // Gruppen nach erstem Auftreten in den Daten sortieren (Einfügungsreihenfolge)
    return order.map(k => map[k]);
  }

  // 4. Serienstand berechnen (für Best-of-Header)
  function serienStand(serie) {
    let hw = 0, gw = 0;
    serie.spiele.forEach(s => {
      if (!istVergangen(s) || !s.result) return;
      const hg = s.result.home_goals ?? 0, gg = s.result.guest_goals ?? 0;
      if (hg > gg) hw++; else if (gg > hg) gw++;
    });
    const n = serie.spiele.length;
    const braucht = Math.ceil((n + 1) / 2);
    const entschieden = hw >= braucht || gw >= braucht;
    return { hw, gw, entschieden, winner: entschieden ? (hw >= braucht ? 'home' : 'guest') : null };
  }

  // 5. Einzelnes Spiel als klickbare Zeile
  function spielZeile(s, serienIdx) {
    const verg   = istVergangen(s);
    const isLive = s.started === true && !verg;
    const hLogo  = logoUrl(s.home_team_small_logo || s.home_team_logo);
    const gLogo  = logoUrl(s.guest_team_small_logo || s.guest_team_logo);
    const hLogoEl = hLogo ? `<img class="bg-logo" src="${hLogo}" alt="" onerror="this.style.display='none'">` : '';
    const gLogoEl = gLogo ? `<img class="bg-logo" src="${gLogo}" alt="" onerror="this.style.display='none'">` : '';

    let scoreHTML;
    if ((verg || isLive) && s.result) {
      const pf = (!isLive && s.result.postfix?.short) ? ` <span class="bg-pf">${s.result.postfix.short}</span>` : '';
      const livePart = isLive ? `<span class="live-badge" style="font-size:.55rem;padding:1px 5px"><span class="live-dot" style="width:4px;height:4px"></span>LIVE</span>` : '';
      scoreHTML = `<div class="bg-score played" style="display:flex;flex-direction:column;align-items:center;gap:1px">${livePart}${s.result.home_goals}:${s.result.guest_goals}${pf}</div>`;
    } else {
      const livePart = isLive ? `<span class="live-badge" style="font-size:.55rem;padding:1px 5px"><span class="live-dot" style="width:4px;height:4px"></span>LIVE</span>` : '';
      scoreHTML = `<div class="bg-score future" style="display:flex;flex-direction:column;align-items:center;gap:1px">${livePart}${s.time || '–'}</div>`;
    }

    const nr = serienIdx != null ? `<span class="bg-nr">Sp.${serienIdx+1}</span>` : '';
    const liveCls = isLive ? ' bg-row-live' : '';

    return `<div class="bg-row${verg ? ' bg-played' : ''}${liveCls}" onclick="zeigSpielDetail(${s.game_id})">
      <div class="bg-home">
        ${hLogoEl}
        <span class="bg-name">${esc(s.home_team_name)}</span>
      </div>
      ${scoreHTML}
      <div class="bg-guest">
        <span class="bg-name">${esc(s.guest_team_name)}</span>
        ${gLogoEl}
      </div>
      <div class="bg-meta">${nr}<span class="bg-datum">${formatDatum(s.date)}</span></div>
    </div>`;
  }

  // 6. HTML aufbauen
  let html = '<div class="bracket-scroll"><div class="bracket">';

  rundenNrn.forEach(nr => {
    const erstesSpiel = rundenMap[nr][0];
    const titelRaw = erstesSpiel?.game_day_title ?? erstesSpiel?.game_day_name ?? `Runde ${nr}`;
    const titel = typeof titelRaw === 'object'
      ? (titelRaw?.title ?? titelRaw?.name ?? `Runde ${nr}`)
      : (titelRaw || `Runde ${nr}`);

    const gruppen = gruppiereRunde(rundenMap[nr]);
    html += `<div class="bracket-round"><div class="bracket-round-title">${esc(titel)}</div>`;

    gruppen.forEach((gruppe, gi) => {
      const istSerie = gruppe.spiele.length > 1;
      // Trennlinie zwischen Serien (nicht vor der ersten)
      if (gi > 0) html += '<div class="bracket-serie-gap"></div>';
      if (istSerie) {
        gruppe.spiele
          .sort((a,b) => (a.date||'') < (b.date||'') ? -1 : 1)
          .forEach((s, i) => { html += spielZeile(s, i); });
      } else {
        html += spielZeile(gruppe.spiele[0], null);
      }
    });

    html += '</div>'; // bracket-round
  });

  html += '</div></div>';
  return html;
}

function renderGruppenphaseMitKO() {
  // Gruppenphase: Runden deren Titel "Gruppe" enthält → Mini-Tabellen
  // KO: alle anderen Runden → Bracket
  const titel = ligaMeta?.game_day_titles || [];

  // game_day_titles ist ein Array von Objekten {game_day_number, title} ODER ein Array von Strings.
  // Hilfsfunktion: Titel für eine Runde korrekt nachschlagen.
  function getTitelFuerRunde(nr) {
    if (!titel.length) return '';
    const erster = titel[0];
    if (typeof erster === 'object' && erster !== null) {
      // Neues Format: [{game_day_number: 1, title: "Gruppe A"}, ...]
      const eintrag = titel.find(e => e.game_day_number === nr);
      return String(eintrag?.title || '');
    }
    // Altes Format: ["Gruppe A", "Runde 1", ...]
    return String(titel[nr - 1] || '');
  }

  // Gruppentabellen aus table.json (haben group_name-Feld)
  const gruppenTab = {};
  (tabelle || []).forEach(t => {
    const g = t.group_name || t.group || 'Gruppe';
    if (!gruppenTab[g]) gruppenTab[g] = [];
    gruppenTab[g].push(t);
  });
  const hatGruppenTab = Object.keys(gruppenTab).length > 0;

  // KO-Runden: game_day_number wo Titel kein "Gruppe" enthält
  const koSpiele = spielplan.filter(s => {
    const nr = s.game_day_number ?? s.game_day ?? 1;
    const t  = getTitelFuerRunde(nr).toLowerCase();
    return !t.includes('gruppe') && !t.includes('group');
  });
  // Gruppenphase-Spiele
  const gruppeSpiele = spielplan.filter(s => {
    const nr = s.game_day_number ?? s.game_day ?? 1;
    const t  = getTitelFuerRunde(nr).toLowerCase();
    return t.includes('gruppe') || t.includes('group');
  });

  let html = '';

  // ── Gruppenphase ──────────────────────────────────────────────────────────
  if (hatGruppenTab) {
    html += '<div class="sd-section-title" style="margin:8px 0 10px">Gruppenphase</div>';
    html += '<div class="gruppe-grid">';
    Object.entries(gruppenTab).sort(([a],[b]) => a.localeCompare(b)).forEach(([gName, teams]) => {
      const sorted = [...teams].sort((a,b) => (a.position||99) - (b.position||99));
      html += `<div class="glass gruppe-table-wrap">
        <div class="gruppe-title">${esc(gName)}</div>
        <table class="gruppe-table">
          <thead><tr><th>#</th><th>Team</th><th>Sp</th><th>P</th><th>Tore</th></tr></thead>
          <tbody>
            ${sorted.map(t => `<tr>
              <td>${t.position || '–'}</td>
              <td>${esc(t.team_name)}</td>
              <td>${t.games ?? '–'}</td>
              <td><strong>${t.points ?? '–'}</strong></td>
              <td style="color:rgba(255,255,255,.45)">${t.goals_scored ?? '–'}:${t.goals_received ?? '–'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    });
    html += '</div>';
  } else if (gruppeSpiele.length) {
    // Fallback: Gruppenphase-Spiele als Liste
    html += '<div class="sd-section-title" style="margin:8px 0 10px">Gruppenphase</div>';
    const tmpSpieler = spielplan;
    spielplan = gruppeSpiele;
    // temporär renderSpielplanLiga in einen div rendern
    const tmp = document.createElement('div');
    tmp.innerHTML = '';
    spielplan = tmpSpieler;
    // einfache Liste reicht
    html += baueBracket(gruppeSpiele, titel, 1);
  }

  // ── KO-Baum ───────────────────────────────────────────────────────────────
  if (koSpiele.length) {
    html += '<div class="sd-section-title" style="margin:16px 0 10px">K.O.-Phase</div>';
    const minKoRunde = Math.min(...koSpiele.map(s => s.game_day_number ?? s.game_day ?? 1));
    html += baueBracket(koSpiele, titel, minKoRunde);
  }

  document.getElementById('content-tabelle').innerHTML = html || '<div class="lade-info"><span>Keine Daten.</span></div>';
}

  } else if (context === 'tabelle') {
    tabelleStrafenDetails = !tabelleStrafenDetails;
    document.getElementById('tabelle-strafen-btn')?.classList.toggle('active', tabelleStrafenDetails);
    renderTabelle();
  } else if (context === 'static') {
    staticStrafenDetails = !staticStrafenDetails;
    document.getElementById('static-strafen-btn')?.classList.toggle('active', staticStrafenDetails);
    renderStaticAlltime();
  }
}

function togglePerGame(context) {
  if (context === 'scorer') {
    scorerPerGame = !scorerPerGame;
    document.getElementById('scorer-pergame-btn')?.classList.toggle('active', scorerPerGame);
    renderScorer();
  } else if (context === 'alltime') {
    alltimePerGame = !alltimePerGame;
    document.getElementById('alltime-pergame-btn')?.classList.toggle('active', alltimePerGame);
    renderAlltime();
  } else if (context === 'tabelle') {
    tabellePerGame = !tabellePerGame;
    document.getElementById('tabelle-pergame-btn')?.classList.toggle('active', tabellePerGame);
    renderTabelle();
  } else if (context === 'static') {
    staticPerGame = !staticPerGame;
    document.getElementById('static-pergame-btn')?.classList.toggle('active', staticPerGame);
    renderStaticAlltime();
  }
}

function renderScorer() {
  const teamFilter = document.getElementById('scorer-team-filter')?.value || '';
  let data = [...scorer];

  if (teamFilter) data = data.filter(s => s.team_name === teamFilter);

  data.sort((a, b) => {
    if (scorerSort === 'tore')    return b.goals - a.goals || (b.goals + b.assists) - (a.goals + a.assists);
    if (scorerSort === 'assists') return b.assists - a.assists || b.goals - a.goals;
    if (scorerSort === 'spiele')  return b.games - a.games;
    if (scorerSort === 'pim')     return pim(b) - pim(a);
    return (b.goals + b.assists) - (a.goals + a.assists) || b.goals - a.goals; // punkte
  });

  const rows = data.map((s, i) => {
    const punkte   = s.goals + s.assists;
    const pimTotal = pim(s);
    const sp       = s.games || 1;
    return `
    <tr>
      <td><span class="scorer-rank">${i + 1}</span></td>
      <td><span class="scorer-name">${s.first_name} ${s.last_name}</span></td>
      <td class="col-hide-mob"><span class="scorer-team">${s.team_name}</span></td>
      <td class="col-hide-mob">${s.games}</td>
      <td class="scorer-goals">${s.goals}</td>
      <td>${s.assists}</td>
      <td class="scorer-pkt">${punkte}</td>
      ${scorerStrafenDetails
        ? `<td>${s.penalty_2 || 0}</td><td>${s.penalty_2and2 || 0}</td><td>${s.penalty_5 || 0}</td><td>${s.penalty_10 || 0}</td><td>${(s.penalty_match||0)+(s.penalty_ms_tech||0)+(s.penalty_ms_full||0)+(s.penalty_ms1||0)+(s.penalty_ms2||0)}</td>`
        : ''}
      <td>${pimTotal}'</td>
      ${scorerPerGame
        ? `<td>${(punkte / sp).toFixed(2)}</td><td>${(s.goals / sp).toFixed(2)}</td><td>${(s.assists / sp).toFixed(2)}</td><td>${(pimTotal / sp).toFixed(2)}'</td>`
        : ''}
    </tr>`;
  }).join('');

  document.getElementById('content-scorer').innerHTML = `
  <div class="scorer-wrap">
    <div class="glass">
      <table class="scorer-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th class="col-hide-mob">Team</th>
            <th class="col-hide-mob ${scorerSort==='spiele'?'sort-active':''}" onclick="setScorerSort('spiele',this)" title="Spiele">Sp</th>
            <th class="${scorerSort==='tore'?'sort-active':''}" onclick="setScorerSort('tore',this)" title="Tore">G</th>
            <th class="${scorerSort==='assists'?'sort-active':''}" onclick="setScorerSort('assists',this)" title="Assists">A</th>
            <th class="${scorerSort==='punkte'?'sort-active':''}" onclick="setScorerSort('punkte',this)" title="Punkte (Tore+Assists)">Pkt</th>
            ${scorerStrafenDetails
              ? `<th title="2-Minuten-Strafen">2'</th><th title="2+2-Minuten-Strafen">2+2</th><th title="5-Minuten-Strafen">5'</th><th title="10-Minuten-Strafen">10'</th><th title="Matchstrafen">MS</th>`
              : ''}
            <th class="${scorerSort==='pim'?'sort-active':''}" onclick="setScorerSort('pim',this)" title="Strafminuten gesamt">PIM</th>
            ${scorerPerGame
              ? `<th title="Punkte pro Spiel">Pkt/Sp</th><th title="Tore pro Spiel">G/Sp</th><th title="Assists pro Spiel">A/Sp</th><th title="PIM pro Spiel">PIM/Sp</th>`
              : ''}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

function renderDetail() {
  const sel = document.getElementById('detail-team-select');
  const teamId = parseInt(sel?.value || 0);
  const teamRow = tabelle.find(t => t.team_id === teamId);
  if (!teamRow) return;

  // Team-Spiele aus Spielplan
  const teamSpiele = spielplan.filter(s =>
    s.home_team_id === teamId || s.guest_team_id === teamId ||
    s.home_team_name === teamRow.team_name ||
    s.guest_team_name === teamRow.team_name
  ).sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  const gespielt = teamSpiele.filter(istVergangen);

  // Bilanz
  let heimS = 0, heimN = 0, heimSp = 0;
  let ausS  = 0, ausN  = 0, ausSp  = 0;
  let formListe = []; // 'W','OW','L','OL'

  gespielt.forEach(s => {
    const heimTeam = s.home_team_id === teamId || s.home_team_name === teamRow.team_name;
    const r = s.result;
    if (!r) return;
    const hg = r.home_goals;
    const gg = r.guest_goals;
    const ot = r.overtime || (r.postfix && r.postfix.short && r.postfix.short !== '');

    let win, winOT;
    if (heimTeam) {
      heimSp++;
      win   = hg > gg;
      winOT = ot;
      if (win && !winOT) heimS++;
      else if (!win && !winOT) heimN++;
    } else {
      ausSp++;
      win   = gg > hg;
      winOT = ot;
      if (win && !winOT) ausS++;
      else if (!win && !winOT) ausN++;
    }

    if (win && !winOT) formListe.push('W');
    else if (win && winOT) formListe.push('OW');
    else if (!win && winOT) formListe.push('OL');
    else formListe.push('L');
  });

  const letzten5 = formListe.slice(-5);
  while (letzten5.length < 5) letzten5.unshift(null);

  const formHTML = letzten5.map(f => {
    if (!f) return `<div class="form-ball form-empty">–</div>`;
    const labels = { W: 'S', OW: 'OT', L: 'N', OL: 'OT' };
    return `<div class="form-ball form-${f}">${labels[f]}</div>`;
  }).join('');

  // Team-Scorer
  let teamScorer = scorer
    .filter(s => s.team_id === teamId || s.team_name === teamRow.team_name);

  teamScorer = [...teamScorer].sort((a, b) => {
    const sp = x => x.games || 1;
    if (detailScorerSort === 'tore')    return b.goals   - a.goals   || (b.goals+b.assists)-(a.goals+a.assists);
    if (detailScorerSort === 'assists') return b.assists - a.assists  || b.goals - a.goals;
    if (detailScorerSort === 'spiele')  return b.games   - a.games;
    if (detailScorerSort === 'pim')     return pim(b)    - pim(a);
    if (detailScorerSort === 'pkt_sp')  return (b.goals+b.assists)/sp(b) - (a.goals+a.assists)/sp(a);
    if (detailScorerSort === 'g_sp')    return b.goals/sp(b)   - a.goals/sp(a);
    if (detailScorerSort === 'a_sp')    return b.assists/sp(b) - a.assists/sp(a);
    if (detailScorerSort === 'pim_sp')  return pim(b)/sp(b)    - pim(a)/sp(a);
    return (b.goals+b.assists) - (a.goals+a.assists) || b.goals - a.goals; // punkte
  });

  const dHdr = (key, label, hint='') => {
    const active = detailScorerSort === key;
    const tt = hint ? ` title="${hint}"` : '';
    return `<th class="${active?'sort-active':''}"${tt} onclick="setDetailScorerSort('${key}')">${label}</th>`;

  const scorerRows = teamScorer.map((s, i) => {

    const ms     = (s.penalty_match||0)+(s.penalty_ms_tech||0)+(s.penalty_ms_full||0)+(s.penalty_ms1||0)+(s.penalty_ms2||0);
    return `<tr>
      <td>${i+1}</td>
      <td>${s.first_name} ${s.last_name}</td>
      <td>${s.games}</td>
      <td style="color:var(--color-a);font-weight:700">${s.goals}</td>
      <td>${s.assists}</td>
      <td style="font-weight:700;color:#f1f5f9">${pkt}</td>
      ${detailStrafenDetails
        ? `<td>${s.penalty_2||0}</td><td>${s.penalty_2and2||0}</td><td>${s.penalty_5||0}</td><td>${s.penalty_10||0}</td><td>${ms}</td>`
        : ''}
      <td>${pimVal}'</td>
      ${detailPerGame
        ? `<td>${(pkt/sp).toFixed(2)}</td><td>${(s.goals/sp).toFixed(2)}</td><td>${(s.assists/sp).toFixed(2)}</td><td>${(pimVal/sp).toFixed(2)}'</td>`
        : ''}
    </tr>`;
  }).join('');

  // Spiele-Tabelle (letzte 10 gespielt)
  const letzteSpiele = [...gespielt].slice(-10).reverse();
  const spieleRows = letzteSpiele.map(s => {
    const heimTeam = s.home_team_id === teamId || s.home_team_name === teamRow.team_name;

    <tr>

      <td style="color:rgba(255,255,255,.35);font-size:.68rem">${haSign}</td>
      <td>${gegner}</td>
      <td class="${resCls}">${ergebnis}${pf}</td>

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        ${logo ? `<img style="width:32px;height:32px;object-fit:contain" src="${logo}" alt="" onerror="this.style.display='none'">` : ''}
        <span style="font-size:1rem;font-weight:700">${teamRow.team_name}</span>
      </div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">Spiele</span><span class="detail-stat-val">${teamRow.games}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">Siege</span><span class="detail-stat-val" style="color:var(--color-a)">${teamRow.won}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">OT-Siege</span><span class="detail-stat-val" style="color:var(--color-a);opacity:.7">${teamRow.won_ot}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">OT-Niederlagen</span><span class="detail-stat-val" style="color:var(--color-b);opacity:.7">${teamRow.lost_ot}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">Niederlagen</span><span class="detail-stat-val" style="color:var(--color-b)">${teamRow.lost}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">Tore</span><span class="detail-stat-val">${teamRow.goals_scored}:${teamRow.goals_received}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">Tordifferenz</span><span class="detail-stat-val ${teamRow.goals_diff >= 0 ? 't-diff-pos' : 't-diff-neg'}">${teamRow.goals_diff > 0 ? '+' : ''}${teamRow.goals_diff}</span></div>
      <div class="detail-stat-row"><span class="detail-stat-lbl">Punkte</span><span class="detail-stat-val" style="font-size:1.1rem">${teamRow.points}</span></div>

        <div class="detail-stat-row"><span class="detail-stat-lbl">Heim: Niederlagen</span><span class="detail-stat-val">${heimN} / ${heimSp}</span></div>
        <div class="detail-stat-row"><span class="detail-stat-lbl">Auswärts: Siege</span><span class="detail-stat-val">${ausS} / ${ausSp}</span></div>
        <div class="detail-stat-row"><span class="detail-stat-lbl">Auswärts: Niederlagen</span><span class="detail-stat-val">${ausN} / ${ausSp}</span></div>

function istDamen(ligaName) {
  return /damen|frauen/i.test(ligaName);
}

// Alle Saisons aller Ligen des aktiven Verbands — dedupliziert nach id
function getAktivVerbandSaisons() {
  const verband = document.getElementById('verband-select')?.value || '';
  if (!verband) return [];
  const seen = new Set();
  return alleligen.filter(l => {
    if (l.game_operation !== verband || seen.has(l.id)) return false;
    seen.add(l.id);
    return true;
  });
}

// Alltime-Daten parallel laden
async function ladeAlltimeDaten() {
  if (alltimeGeladen) return;
  const saisons = getAktivVerbandSaisons();
  if (!saisons.length) {
    document.getElementById('content-alltime').innerHTML =
      '<div class="error-box">Keine Saisons für diese Liga gefunden.</div>';
    return;
  }

  // Fortschritts-Anzeige
  document.getElementById('content-alltime').innerHTML =
    `<div class="lade-info"><div class="spinner"></div><span id="alltime-progress">Lade Saison 0/${saisons.length}…</span></div>`;

  let fertig = 0, fehler = 0;
  const BATCH = 10; // max. gleichzeitige Anfragen → verhindert Rate-Limiting
  try {
    const ergebnisse = [];
    for (let i = 0; i < saisons.length; i += BATCH) {
      const batch = saisons.slice(i, i + BATCH);
      const batchResults = await Promise.all(
        batch.map(s =>
          Promise.all([
            fetchJSON(`${API_BASE}/api/v2/leagues/${s.id}/scorer.json`).catch(() => { fehler++; return []; }),
            fetchJSON(`${API_BASE}/api/v2/leagues/${s.id}/table.json`).catch(() => { fehler++; return []; }),
          ]).then(([sc, ta]) => {
            fertig++;
            const el = document.getElementById('alltime-progress');
            if (el) el.textContent = `Lade Saison ${fertig}/${saisons.length}…`;
            return { ligaId: s.id, saison: s.season || String(s.id), ligaName: s.name, scorer: sc, table: ta };
          })
        )
      );
      ergebnisse.push(...batchResults);
    }
    if (fehler > 0) console.warn(`Alltime: ${fehler} Requests fehlgeschlagen (von ${saisons.length * 2} gesamt)`);

    alltimeRohdaten = ergebnisse;
    alltimeGeladen  = true;
    alltimeLigaFilter.clear();
    aggregiereUndRenderAlltime();
    renderAlltimeLigaPanel();
  } catch (e) {
    console.error(e);
    document.getElementById('content-alltime').innerHTML =
      `<div class="error-box">Fehler beim Laden: ${e.message}</div>`;
  }
}

// Re-Aggregation mit aktivem Ligen-Filter (kein neuer Fetch)
function aggregiereUndRenderAlltime() {
  if (!alltimeRohdaten) return;
  const gefiltert = (alltimeLigaFilter.size === 0 && !alltimeLigaNoneMode)
    ? alltimeRohdaten
    : alltimeRohdaten.filter(e => alltimeLigaFilter.has(e.ligaId));
  alltimeDaten = aggregiereAlltime(gefiltert);
  alltimeSpielerSeite = 1;
  alltimeTeamSeite    = 1;
  renderAlltime();
  aktualisiereLigaBtn();
}

function aktualisiereLigaBtn() {
  const btn = document.getElementById('alltime-liga-btn');
  if (!btn) return;
  const n = alltimeLigaFilter.size;
  if (n === 0 && alltimeLigaNoneMode) {
    btn.textContent = 'Keine Ligen ▾';
    btn.classList.add('active');
  } else if (n === 0) {
    btn.textContent = 'Alle Ligen ▾';
    btn.classList.remove('active');
  } else {
    btn.textContent = `${n} Liga${n > 1 ? 'en' : ''} ▾`;
    btn.classList.add('active');
  }
}

function toggleAlltimeLigaPanel(e) {
  if (e) e.stopPropagation();
  alltimeLigaPanelOffen = !alltimeLigaPanelOffen;
  const panel = document.getElementById('alltime-liga-panel');
  if (panel) panel.classList.toggle('offen', alltimeLigaPanelOffen);
  if (alltimeLigaPanelOffen) {
    const inp = document.getElementById('alltime-liga-suche');
    if (inp) inp.focus();
  }
}

// Panel außerhalb schließen
document.addEventListener('click', e => {
  if (alltimeLigaPanelOffen && !document.getElementById('alltime-liga-wrap')?.contains(e.target)) {
    alltimeLigaPanelOffen = false;
    document.getElementById('alltime-liga-panel')?.classList.remove('offen');
  }
});

function renderAlltimeLigaPanel() {
  const list = document.getElementById('alltime-liga-list');
  if (!list || !alltimeRohdaten) return;
  const suche = alltimeLigaSuche.trim().toLowerCase();

  // Eindeutige Ligen aus Rohdaten extrahieren (id + name + saison)
  const ligas = [];
  const seen = new Set();
  for (const e of alltimeRohdaten) {
    if (!seen.has(e.ligaId)) {
      seen.add(e.ligaId);
      ligas.push({ id: e.ligaId, name: e.ligaName, saison: e.saison });
    }
  }
  // Nach Name sortieren, dann Saison absteigend
  ligas.sort((a, b) => a.name.localeCompare(b.name, 'de') || (parseInt(b.saison)||0) - (parseInt(a.saison)||0));

  const gefiltert = suche ? ligas.filter(l => l.name.toLowerCase().includes(suche)) : ligas;

  list.innerHTML = gefiltert.map(l => {
    const checked = !alltimeLigaNoneMode && (alltimeLigaFilter.size === 0 || alltimeLigaFilter.has(l.id));
    const jahr = l.saison ? ` <span style="color:rgba(255,255,255,.35);font-size:.7rem">${saisonJahr(l.saison)}</span>` : '';
    return `<label class="liga-check-item">
      <input type="checkbox" ${checked ? 'checked' : ''}
             onchange="onAlltimeLigaToggle(${l.id}, this.checked)">
      ${esc(l.name)}${jahr}
    </label>`;
  }).join('');
}

function onAlltimeLigaToggle(id, checked) {
  if (checked) {
    // Aus noneMode: einfach diese Liga hinzufügen
    alltimeLigaNoneMode = false;
    alltimeLigaFilter.add(id);
    // Aus "alle"-Modus: erst alle sammeln, dann diesen lassen
  } else {
    // Aus "alle"-Modus: erst alle IDs füllen, dann diese entfernen
    if (alltimeLigaFilter.size === 0 && !alltimeLigaNoneMode) {
      if (!alltimeRohdaten) return;
      new Set(alltimeRohdaten.map(e => e.ligaId)).forEach(i => alltimeLigaFilter.add(i));
    }
    alltimeLigaFilter.delete(id);
    // Letzten entfernt → noneMode
    if (alltimeLigaFilter.size === 0) alltimeLigaNoneMode = true;
  }
  // Wenn wieder alle ausgewählt: zurück auf "alle"-Modus
  const uniqueIds = new Set(alltimeRohdaten?.map(e => e.ligaId) || []);
  if (!alltimeLigaNoneMode && alltimeLigaFilter.size >= uniqueIds.size &&
      [...uniqueIds].every(i => alltimeLigaFilter.has(i))) {
    alltimeLigaFilter.clear();
    alltimeLigaNoneMode = false;
  }
  aggregiereUndRenderAlltime();
  renderAlltimeLigaPanel();
}

function alltimeLigaAlleAuswaehlen() {
  alltimeLigaFilter.clear();
  alltimeLigaNoneMode = false;
  aggregiereUndRenderAlltime();
  renderAlltimeLigaPanel();
}

function alltimeLigaKeineAuswaehlen() {
  alltimeLigaFilter.clear();
  alltimeLigaNoneMode = true;
  alltimeDaten = aggregiereAlltime([]);
  alltimeSpielerSeite = 1;
  alltimeTeamSeite    = 1;
  renderAlltime();
  aktualisiereLigaBtn();
  renderAlltimeLigaPanel();
}

// Aggregation: scorer + table über alle Saisons zusammenführen
// Teams werden nach team_name (normalisiert) aggregiert, nicht nach team_id —
// da die API pro Saison neue IDs vergibt, würden sonst Vereine mehrfach auftauchen.
function aggregiereAlltime(ergebnisse) {
  const spielerMap     = {};
  const teamMap        = {}; // key: team_name.trim() (normalisiert)
  const teamPenaltyMap = {}; // key: team_name.trim() (aus scorer.json)

  ergebnisse.forEach(({ saison, ligaName, scorer: sc, table: ta }) => {
    const gender = istDamen(ligaName) ? 'damen' : 'herren';

    // ── Spieler + Team-Strafen aus Scorer ────────────────────────────────────
    (sc || []).forEach(s => {
      const key = s.player_id;
      if (!key) return;
      if (!spielerMap[key]) {
        spielerMap[key] = {
          player_id:  key,
          first_name: s.first_name,
          last_name:  s.last_name,
          games: 0, goals: 0, assists: 0, pim: 0,
          p2: 0, p2and2: 0, p5: 0, p10: 0, ms: 0,
          teams:      new Set(),
          ligaGender: gender,
        };
      }
      const sp = spielerMap[key];
      sp.first_name = s.first_name;
      sp.last_name  = s.last_name;
      sp.games   += (s.games         || 0);
      sp.goals   += (s.goals         || 0);
      sp.assists += (s.assists        || 0);
      sp.pim     += pim(s);
      sp.p2      += (s.penalty_2     || 0);
      sp.p2and2  += (s.penalty_2and2 || 0);
      sp.p5      += (s.penalty_5     || 0);
      sp.p10     += (s.penalty_10    || 0);
      sp.ms      += (s.penalty_match || 0) + (s.penalty_ms_tech || 0) +
                    (s.penalty_ms_full || 0) + (s.penalty_ms1 || 0) + (s.penalty_ms2 || 0);
      if (s.team_name) sp.teams.add(s.team_name);

      // Team-Strafen nach team_name akkumulieren (teamMap noch nicht vollständig)
      const tname = (s.team_name || '').trim();
      if (tname) {
        if (!teamPenaltyMap[tname])
          teamPenaltyMap[tname] = { p2:0, p2and2:0, p5:0, p10:0, ms:0, pim:0 };
        const tp = teamPenaltyMap[tname];
        tp.p2    += (s.penalty_2     || 0);
        tp.p2and2+= (s.penalty_2and2 || 0);
        tp.p5    += (s.penalty_5     || 0);
        tp.p10   += (s.penalty_10    || 0);
        tp.ms    += (s.penalty_match || 0) + (s.penalty_ms_tech || 0) +
                    (s.penalty_ms_full || 0) + (s.penalty_ms1 || 0) + (s.penalty_ms2 || 0);
        tp.pim   += pim(s);
      }
    });

    // ── Teams aus table.json — nach team_name aggregieren ────────────────────
    (ta || []).forEach(t => {
      const tname = (t.team_name || '').trim();
      if (!tname) return;

      if (!teamMap[tname]) {
        teamMap[tname] = {
          team_name:  tname,
          team_logo:  t.team_logo_small || t.team_logo,
          saisons:    0, games: 0, won: 0, won_ot: 0,
          lost_ot:    0, lost: 0,
          goals_scored: 0, goals_received: 0, points: 0,
          pim: 0, p2: 0, p2and2: 0, p5: 0, p10: 0, ms: 0,
          ligaGender: gender,
          bestSaison: null, // beste Einzelsaison (nach Punkten)
        };
      }
      const tm = teamMap[tname];
      // Logo aktualisieren wenn vorhanden
      if (t.team_logo_small || t.team_logo) tm.team_logo = t.team_logo_small || t.team_logo;

      tm.saisons        += 1;
      tm.games          += (t.games          || 0);
      tm.won            += (t.won            || 0);
      tm.won_ot         += (t.won_ot         || 0);
      tm.lost_ot        += (t.lost_ot        || 0);
      tm.lost           += (t.lost           || 0);
      tm.goals_scored   += (t.goals_scored   || 0);
      tm.goals_received += (t.goals_received || 0);
      tm.points         += (t.points         || 0);

      // Beste Einzelsaison festhalten
      const snap = {
        points:         t.points          || 0,
        games:          t.games           || 0,
        won:            t.won             || 0,
        won_ot:         t.won_ot          || 0,
        lost_ot:        t.lost_ot         || 0,
        lost:           t.lost            || 0,
        goals_scored:   t.goals_scored    || 0,
        goals_received: t.goals_received  || 0,
        goals_diff:     (t.goals_scored||0) - (t.goals_received||0),
        ligaName:       ligaName,
        saison:         saison,
      };
      if (!tm.bestSaison || snap.points > tm.bestSaison.points) {
        tm.bestSaison = snap;
      }
    });
  });

  // Strafen-Daten in teamMap eintragen
  Object.entries(teamPenaltyMap).forEach(([tname, pen]) => {
    const tm = teamMap[tname];
    if (!tm) return;
    tm.p2    += pen.p2;
    tm.p2and2+= pen.p2and2;
    tm.p5    += pen.p5;
    tm.p10   += pen.p10;
    tm.ms    += pen.ms;
    tm.pim   += pen.pim;
  });

  // Maps → Arrays
  const spieler = Object.values(spielerMap).map(s => ({
    ...s,
    punkte: s.goals + s.assists,
    teams:  [...s.teams].join(', '),
  }));
  const teams = Object.values(teamMap).map(t => ({
    ...t,
    goals_diff: t.goals_scored - t.goals_received,
  }));

  return { spieler, teams };
}

// Haupt-Render: routet je nach alltimeView
function renderAlltime() {
  if (!alltimeDaten) return;

  // Geschlechter-Info-Zeile aktualisieren
  const saisons   = getAktivVerbandSaisons();
  const verband   = document.getElementById('verband-select')?.value || '';
  const anzHerren = saisons.filter(s => !istDamen(s.name)).length;
  const anzDamen  = saisons.filter(s =>  istDamen(s.name)).length;
  const hint = document.getElementById('gender-hint');
  hint.innerHTML = `<div class="gender-hint">
    ${verband} &nbsp;·&nbsp; ${saisons.length} Saisons
    &nbsp;·&nbsp; ${anzHerren} Herren &nbsp;·&nbsp; ${anzDamen} Damen
  </div>`;

  // Strafen/PerGame im Kader-View intern anzeigen → im Topbar ausblenden
  const isKader = alltimeView === 'kader';
  document.getElementById('alltime-strafen-btn')?.style.setProperty('display', isKader ? 'none' : '');
  document.getElementById('alltime-pergame-btn')?.style.setProperty('display', isKader ? 'none' : '');
  // Gender-Buttons + Liga-Dropdown: immer sichtbar (auch im Kader-View)
  document.getElementById('alltime-gender-btns')?.style.setProperty('display', '');
  document.getElementById('alltime-gender-sep') ?.style.setProperty('display', '');
  document.getElementById('alltime-liga-wrap')  ?.style.setProperty('display', '');

  if (alltimeView === 'kader') return renderAlltimeKader();
  if (alltimeView === 'teams') return renderAlltimeTeams();
  renderAlltimeSpieler();
}

function renderAlltimeSpieler() {
  const suche = alltimeSuche.toLowerCase();

  let spieler = alltimeDaten.spieler;
  if (alltimeGender !== 'alle') spieler = spieler.filter(s => s.ligaGender === alltimeGender);
  if (suche) spieler = spieler.filter(s =>
    `${s.first_name} ${s.last_name}`.toLowerCase().includes(suche) ||
    s.teams.toLowerCase().includes(suche)
  );
  spieler = [...spieler].sort((a, b) => {
    const sp = x => x.games || 1;
    if (alltimeSortS === 'tore')    return b.goals         - a.goals;
    if (alltimeSortS === 'assists') return b.assists        - a.assists;
    if (alltimeSortS === 'spiele')  return b.games          - a.games;
    if (alltimeSortS === 'pim')     return (b.pim||0)       - (a.pim||0);
    if (alltimeSortS === 'p2')      return (b.p2||0)        - (a.p2||0);
    if (alltimeSortS === 'p2and2')  return (b.p2and2||0)    - (a.p2and2||0);
    if (alltimeSortS === 'p5')      return (b.p5||0)        - (a.p5||0);
    if (alltimeSortS === 'p10')     return (b.p10||0)       - (a.p10||0);
    if (alltimeSortS === 'ms')      return (b.ms||0)        - (a.ms||0);
    if (alltimeSortS === 'pkt_sp')  return b.punkte/sp(b)   - a.punkte/sp(a);
    if (alltimeSortS === 'g_sp')    return b.goals/sp(b)    - a.goals/sp(a);
    if (alltimeSortS === 'a_sp')    return b.assists/sp(b)  - a.assists/sp(a);
    if (alltimeSortS === 'pim_sp')  return (b.pim||0)/sp(b) - (a.pim||0)/sp(a);
    return b.punkte - a.punkte || b.goals - a.goals;
  });

  const gesamtSpieler = spieler.length;
  spieler = spieler.slice((alltimeSpielerSeite - 1) * PAGE_SIZE, alltimeSpielerSeite * PAGE_SIZE);

  const sHdr = (key, label, title) => {
    const tt = title ? ` title="${title}"` : '';
    return `<th class="${alltimeSortS === key ? 'at-sort-active' : ''}" onclick="setAlltimeSortS('${key}')"${tt}>${label}</th>`;
  };

  const rows = spieler.map((s, i) => {
    const sp = s.games || 1;
    return `<tr>
      <td>${i + 1}</td>
      <td>${s.first_name} ${s.last_name}</td>
      <td>${s.teams}</td>
      <td>${s.games}</td>
      <td class="at-goals">${s.goals}</td>
      <td>${s.assists}</td>
      <td class="at-pkt">${s.punkte}</td>
      ${alltimeStrafenDetails
        ? `<td>${s.p2}</td><td>${s.p2and2}</td><td>${s.p5}</td><td>${s.p10}</td><td>${s.ms}</td>`
        : ''}
      <td>${s.pim}'</td>
      ${alltimePerGame
        ? `<td>${(s.punkte/sp).toFixed(2)}</td><td>${(s.goals/sp).toFixed(2)}</td><td>${(s.assists/sp).toFixed(2)}</td><td>${(s.pim/sp).toFixed(2)}'</td>`
        : ''}
    </tr>`;
  }).join('');

  const colCount = 8 + (alltimeStrafenDetails ? 5 : 0) + (alltimePerGame ? 4 : 0);

  document.getElementById('content-alltime').innerHTML = `
  <div class="alltime-section">
    <div class="alltime-section-title">Ewige Scorerliste &nbsp;·&nbsp; ${gesamtSpieler} Spieler</div>
    <div class="glass">
      <table class="at-table">
        <thead><tr>
          <th>#</th>
          <th>Spieler</th>
          <th>Team(s)</th>
          ${sHdr('spiele','Sp','Spiele')}
          ${sHdr('tore','G','Tore')}
          ${sHdr('assists','A','Assists')}
          ${sHdr('punkte','Pkt','Punkte')}
          ${alltimeStrafenDetails
            ? `${sHdr('p2',"2'",'2-Minuten-Strafen')}${sHdr('p2and2','2+2','2+2-Minuten-Strafen')}${sHdr('p5',"5'",'5-Minuten-Strafen')}${sHdr('p10',"10'",'10-Minuten-Strafen')}${sHdr('ms','MS','Matchstrafen (alle Arten)')}`
            : ''}
          ${sHdr('pim','PIM','Strafminuten')}
          ${alltimePerGame
            ? `${sHdr('pkt_sp','Pkt/Sp','Punkte pro Spiel')}${sHdr('g_sp','G/Sp','Tore pro Spiel')}${sHdr('a_sp','A/Sp','Assists pro Spiel')}${sHdr('pim_sp','PIM/Sp','PIM pro Spiel')}`
            : ''}
        </tr></thead>
        <tbody>${rows || `<tr><td colspan="${colCount}" style="text-align:center;padding:20px;color:rgba(255,255,255,.3)">Keine Einträge</td></tr>`}</tbody>
      </table>
    </div>
    ${paginierungsHTML(gesamtSpieler, alltimeSpielerSeite, 'setAlltimeSpielerSeite')}
  </div>`;
}

    if (alltimeSortT === 'lost_ot')        return b.lost_ot          - a.lost_ot;
    if (alltimeSortT === 'lost')           return b.lost             - a.lost;
    if (alltimeSortT === 'goals_scored')   return b.goals_scored     - a.goals_scored;
    if (alltimeSortT === 'goals_received') return b.goals_received   - a.goals_received;
    if (alltimeSortT === 'diff')           return b.goals_diff       - a.goals_diff;
    if (alltimeSortT === 'pim')            return (b.pim||0)         - (a.pim||0);
    if (alltimeSortT === 'p2')             return (b.p2||0)          - (a.p2||0);
    if (alltimeSortT === 'p2and2')         return (b.p2and2||0)      - (a.p2and2||0);

// ── Beste-Saison-Ansicht ──────────────────────────────────────────────────────
function renderAlltimeTeamsBest(teams, modeToggle) {
  // Nur Teams mit mindestens einer Saison
  teams = teams.filter(t => t.bestSaison);

  const gesamtTeams = teams.length;
  teams = [...teams].sort((a, b) => {
    const bA = a.bestSaison, bB = b.bestSaison;
    if (alltimeTeamBestSort === 'games')          return bB.games          - bA.games;
    if (alltimeTeamBestSort === 'won')            return bB.won            - bA.won;
    if (alltimeTeamBestSort === 'won_ot')         return bB.won_ot         - bA.won_ot;
    if (alltimeTeamBestSort === 'lost_ot')        return bB.lost_ot        - bA.lost_ot;
    if (alltimeTeamBestSort === 'lost')           return bB.lost           - bA.lost;
    if (alltimeTeamBestSort === 'goals_scored')   return bB.goals_scored   - bA.goals_scored;
    if (alltimeTeamBestSort === 'goals_received') return bB.goals_received - bA.goals_received;
    if (alltimeTeamBestSort === 'diff')           return bB.goals_diff     - bA.goals_diff;
    return bB.points - bA.points || bB.goals_diff - bA.goals_diff; // punkte
  });

  teams = teams.slice((alltimeTeamSeite - 1) * PAGE_SIZE, alltimeTeamSeite * PAGE_SIZE);

  const bHdr = (key, label, title) => {
    const tt = title ? ` title="${title}"` : '';
    return `<th class="${alltimeTeamBestSort===key?'at-sort-active':''}" onclick="alltimeTeamBestSort='${key}';renderAlltimeTeamsBest(alltimeDaten?.teams?.filter(t=>t.bestSaison&&(alltimeGender==='alle'||t.ligaGender===alltimeGender)&&(!alltimeSuche||(t.team_name||'').toLowerCase().includes(alltimeSuche.toLowerCase()))),document.querySelector('.at-mode-toggle')?.outerHTML||'')"${tt}>${label}</th>`;
  };

  const rows = teams.map((t, i) => {
    const bs      = t.bestSaison;
    const diff    = bs.goals_diff;

/** Baut team_name → [Spieler] Roster aus den Rohdaten des aktiven Verbands. */
function bauldeAlltimeKaderRosters() {
  const tpMap = {};
  // Liga-Filter anwenden (gleiche Logik wie aggregiereUndRenderAlltime)
  const quelldaten = (!alltimeLigaFilter.size && !alltimeLigaNoneMode)
    ? (alltimeRohdaten || [])
    : (alltimeRohdaten || []).filter(e => alltimeLigaFilter.has(e.ligaId));

  quelldaten.forEach(e => {
    // Gender-Filter
    if (alltimeGender === 'herren' &&  istDamen(e.ligaName)) return;
    if (alltimeGender === 'damen'  && !istDamen(e.ligaName)) return;
    (e.scorer || []).forEach(s => {
      const pid   = s.player_id;
      const tname = (s.team_name || '').trim();
      if (!pid || !tname) return;
      const key = tname + '|||' + pid;
      if (!tpMap[key]) {
        tpMap[key] = {
          player_id: pid,
          first_name: s.first_name || '',
          last_name:  s.last_name  || '',
          team_name:  tname,
          spiele: 0, tore: 0, assists: 0,
          strafminuten: 0, p2: 0, p2and2: 0, p5: 0, p10: 0, ms: 0,
        };
      }
      const tp = tpMap[key];
      tp.first_name    = s.first_name || tp.first_name;
      tp.last_name     = s.last_name  || tp.last_name;
      tp.spiele       += s.games         || 0;
      tp.tore         += s.goals         || 0;
      tp.assists      += s.assists        || 0;
      tp.strafminuten += pim(s);
      tp.p2           += s.penalty_2     || 0;
      tp.p2and2       += s.penalty_2and2 || 0;
      tp.p5           += s.penalty_5     || 0;
      tp.p10          += s.penalty_10    || 0;
      tp.ms           += (s.penalty_match   || 0) + (s.penalty_ms_tech || 0) +
                         (s.penalty_ms_full || 0) + (s.penalty_ms1     || 0) + (s.penalty_ms2 || 0);
    });
  });
  const rosters = {};
  Object.values(tpMap).forEach(tp => {
    tp.punkte = tp.tore + tp.assists;
    if (!rosters[tp.team_name]) rosters[tp.team_name] = [];
    rosters[tp.team_name].push(tp);
  });
  Object.values(rosters).forEach(r => r.sort((a, b) => b.punkte - a.punkte));
  return rosters;
}

function renderAlltimeKader() {
  const el      = document.getElementById('content-alltime');
  const rosters = bauldeAlltimeKaderRosters();
  const teamNames = Object.keys(rosters).sort();
  const suche     = alltimeKaderSuche.trim().toLowerCase();
  const gefilterte = suche
    ? teamNames.filter(n => n.toLowerCase().includes(suche))
    : teamNames;

  const hatAuswahl = alltimeKaderTeams.size > 0;

  // ── Spieler über alle gewählten Teams zusammenführen ───────────────────────
  let kaderInfo = '';
  if (hatAuswahl) {
    const merged = new Map();
    for (const teamName of alltimeKaderTeams) {
      const roster = rosters[teamName] || [];
      for (const p of roster) {
        if (!merged.has(p.player_id)) {
          merged.set(p.player_id, {
            player_id: p.player_id,
            first_name: p.first_name, last_name: p.last_name,
            spiele: 0, tore: 0, assists: 0,
            strafminuten: 0, p2: 0, p2and2: 0, p5: 0, p10: 0, ms: 0,
          });
        }
        const m = merged.get(p.player_id);
        m.first_name    = p.first_name || m.first_name;
        m.last_name     = p.last_name  || m.last_name;
        m.spiele       += p.spiele       || 0;
        m.tore         += p.tore         || 0;
        m.assists      += p.assists      || 0;
        m.strafminuten += p.strafminuten || 0;
        m.p2           += p.p2    || 0;  m.p2and2 += p.p2and2 || 0;
        m.p5           += p.p5    || 0;  m.p10    += p.p10    || 0;
        m.ms           += p.ms    || 0;
      }
    }

    let gefiltert = [...merged.values()].map(m => ({ ...m, punkte: m.tore + m.assists }));
    gefiltert.sort((a, b) => {
      const sp = x => x.spiele || 1;
      if (alltimeKaderSort === 'pkt_sp') return b.punkte/sp(b) - a.punkte/sp(a);
      if (alltimeKaderSort === 'g_sp')   return b.tore/sp(b)   - a.tore/sp(a);
      if (alltimeKaderSort === 'a_sp')   return b.assists/sp(b) - a.assists/sp(a);
      if (alltimeKaderSort === 'pim_sp') return b.strafminuten/sp(b) - a.strafminuten/sp(a);
      return (b[alltimeKaderSort] || 0) - (a[alltimeKaderSort] || 0);
    });

    const gesamt  = gefiltert.length;
    gefiltert = gefiltert.slice((alltimeKaderSeite - 1) * PAGE_SIZE, alltimeKaderSeite * PAGE_SIZE);

    const kHdr = (key, label, title = '') =>
      `<th class="${alltimeKaderSort === key ? 'at-sort-active' : ''}"
           onclick="setAlltimeKaderSort('${key}')"
           ${title ? `title="${title}"` : ''}>${label}</th>`;

    const colCount = 6 + (alltimeStrafenDetails ? 5 : 0) + (alltimePerGame ? 4 : 0);
    const zeilen = gefiltert.map((p, i) => {
      const sp = p.spiele || 1;
      return `<tr>
        <td class="at-rank">${(alltimeKaderSeite - 1) * PAGE_SIZE + i + 1}</td>
        <td class="at-name">${esc(p.first_name + ' ' + p.last_name)}</td>
        <td>${p.spiele}</td>
        <td>${p.tore}</td>
        <td>${p.assists}</td>
        <td class="at-pkt">${p.punkte}</td>
        ${alltimeStrafenDetails
          ? `<td>${p.p2||0}</td><td>${p.p2and2||0}</td><td>${p.p5||0}</td><td>${p.p10||0}</td><td>${p.ms||0}</td>`
          : ''}
        <td>${p.strafminuten}'</td>
        ${alltimePerGame
          ? `<td>${(p.punkte/sp).toFixed(2)}</td><td>${(p.tore/sp).toFixed(2)}</td><td>${(p.assists/sp).toFixed(2)}</td><td>${(p.strafminuten/sp).toFixed(2)}'</td>`
          : ''}
      </tr>`;
    }).join('');

    kaderInfo = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <button class="filter-btn${alltimeStrafenDetails?' active':''}"
                onclick="toggleStrafenDetails('alltime')">Strafen Details</button>
        <button class="filter-btn${alltimePerGame?' active':''}"
                onclick="togglePerGame('alltime')">Pro Spiel</button>
      </div>
      <div class="glass" style="overflow-x:auto">
        <table class="at-table">
          <thead><tr>
            <th>#</th><th>Spieler</th>
            ${kHdr('spiele','Sp')}
            ${kHdr('tore','G')}
            ${kHdr('assists','A')}
            ${kHdr('punkte','Pkt')}
            ${alltimeStrafenDetails
              ? `${kHdr('p2',"2'","2-Minuten-Strafen")}${kHdr('p2and2','2+2')}${kHdr('p5',"5'")}${kHdr('p10',"10'")}${kHdr('ms','MS','Matchstrafen')}`
              : ''}
            ${kHdr('strafminuten','PIM')}
            ${alltimePerGame
              ? `${kHdr('pkt_sp','Pkt/Sp')}${kHdr('g_sp','G/Sp')}${kHdr('a_sp','A/Sp')}${kHdr('pim_sp','PIM/Sp')}`
              : ''}
          </tr></thead>
          <tbody>${zeilen || `<tr><td colspan="${colCount}" style="text-align:center;padding:20px;color:rgba(255,255,255,.3)">Keine Einträge</td></tr>`}</tbody>
        </table>
      </div>
      ${paginierungsHTML(gesamt, alltimeKaderSeite, 'setAlltimeKaderSeite')}`;
  }

  // ── Ausgewählte Teams als Tags ──────────────────────────────────────────────
  const titelTeams = alltimeKaderTeams.size === 0
    ? ''
    : alltimeKaderTeams.size === 1
      ? '— ' + esc([...alltimeKaderTeams][0])
      : `— ${alltimeKaderTeams.size} Teams kombiniert`;

  const auswahlTags = alltimeKaderTeams.size > 0
    ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">
        ${[...alltimeKaderTeams].map(n =>
          `<span class="kader-tag" onclick="waehleAlltimeKaderTeam('${esc(n).replace(/'/g,"\\'")}')">
            ${esc(n)} <span class="kader-tag-x">✕</span>
          </span>`).join('')}
        <button class="filter-btn" style="font-size:.7rem;padding:3px 8px"
                onclick="alltimeKaderTeams.clear();alltimeKaderSeite=1;renderAlltimeKader()">Alle abwählen</button>
      </div>`
    : '';

  const listeItems = gefilterte.map(n => {
    const sel = alltimeKaderTeams.has(n);
    return `<div class="kader-team-item${sel ? ' kader-team-selected' : ''}"
                 onclick="waehleAlltimeKaderTeam('${esc(n).replace(/'/g,"\\'")}')">
      <span class="kader-check">${sel ? '✓' : ''}</span>${esc(n)}
    </div>`;
  }).join('');

  const hatteSearchFokus = document.activeElement?.id === 'alltime-kader-suche';

  el.innerHTML = `
  <div class="alltime-section">
    <div class="alltime-section-title">🏒 Team-Kader ${titelTeams}</div>
    <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">

      <!-- Linke Spalte: Team-Suche + Liste -->
      <div style="min-width:200px;max-width:260px;flex:0 0 230px">
        <input class="alltime-search" type="text" id="alltime-kader-suche"
               style="width:100%;box-sizing:border-box;margin-bottom:6px"
               placeholder="Team suchen…" value="${esc(alltimeKaderSuche)}"
               oninput="alltimeKaderSuche=this.value;alltimeKaderSeite=1;renderAlltimeKader()">
        ${auswahlTags}
        <div class="glass" style="max-height:420px;overflow-y:auto;padding:4px 0">
          ${listeItems || '<div style="padding:10px;color:rgba(255,255,255,.3);font-size:.8rem">Keine Teams gefunden</div>'}
        </div>
      </div>

      <!-- Rechte Spalte: Spieler-Tabelle -->
      <div style="flex:1;min-width:280px">
        ${hatAuswahl
          ? kaderInfo
          : '<div style="color:rgba(255,255,255,.35);padding:20px 0;font-size:.85rem">← Ein oder mehrere Teams aus der Liste auswählen</div>'}
      </div>
    </div>
  </div>`;

  if (hatteSearchFokus) {
    const inp = document.getElementById('alltime-kader-suche');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
}

function waehleAlltimeKaderTeam(name) {
  if (alltimeKaderTeams.has(name)) alltimeKaderTeams.delete(name);
  else alltimeKaderTeams.add(name);
  alltimeKaderSeite = 1;
  renderAlltimeKader();
}

  alltimeKaderSort  = key;
  alltimeKaderSeite = 1;
  renderAlltimeKader();

  if (staticGeladen) return;
  document.getElementById('content-static').innerHTML =
    '<div class="lade-info"><div class="spinner"></div><span>Lade alltime.json…</span></div>';
  try {
    staticDaten   = await fetchJSON('data/alltime.json');
    staticGeladen = true;
    renderStaticAlltime();

    document.getElementById('content-static').innerHTML =
      `<div class="error-box">
        data/alltime.json nicht erreichbar.<br>
        <small>Fehler: <b>${e.message || e}</b><br><br>
        Mögliche Ursachen:<br>
        1. Seite per Doppelklick geöffnet → bitte über <b>start.py</b> öffnen (http://localhost:8080)<br>
        2. alltime.json noch nicht generiert → <b>python tools/alltime.py</b> ausführen</small>
      </div>`;
  }
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderStaticAlltime() {
  if (!staticDaten) return;
  // Controls je nach View anpassen
  const isKader = staticView === 'kader';
  document.getElementById('static-gender-btns').style.display  = isKader ? 'none' : '';
  document.getElementById('static-toggle-sep').style.display   = isKader ? 'none' : '';
  document.getElementById('static-strafen-btn').style.display  = isKader ? 'none' : '';
  document.getElementById('static-pergame-btn').style.display  = isKader ? 'none' : '';
  document.getElementById('static-suche-sep').style.display    = isKader ? 'none' : '';
  document.getElementById('static-suche').style.display        = isKader ? 'none' : '';
  if (isKader) { renderStaticKader(); return; }
  const suche = staticSuche.trim().toLowerCase();

  // ── Spieler filtern + sortieren ───────────────────────────────────────────
  let spieler = staticDaten.scorer || [];
  if (staticGender !== 'alle') spieler = spieler.filter(s => s.geschlecht === staticGender);
  if (suche) spieler = spieler.filter(s =>
    (s.first_name + ' ' + s.last_name).toLowerCase().includes(suche) ||
    (s.teams || []).some(t => (t || '').toLowerCase().includes(suche))
  );
  spieler = [...spieler].sort((a, b) => {
    const sp = x => x.spiele || 1;
    if (staticSortS === 'pkt_sp') return b.punkte/sp(b)        - a.punkte/sp(a);
    if (staticSortS === 'g_sp')   return b.tore/sp(b)          - a.tore/sp(a);
    if (staticSortS === 'a_sp')   return b.assists/sp(b)       - a.assists/sp(a);
    if (staticSortS === 'pim_sp') return b.strafminuten/sp(b)  - a.strafminuten/sp(a);
    return (b[staticSortS] || 0) - (a[staticSortS] || 0);
  });
  const gesamtStaticSpieler = spieler.length;
  spieler = spieler.slice((staticSpielerSeite - 1) * PAGE_SIZE, staticSpielerSeite * PAGE_SIZE);

  // ── Hilfsfunktion für sortierbare Spaltenköpfe ───────────────────────────

    `<th class="${staticSortS===key?'at-sort-active':''}" onclick="setStaticSortS('${key}')">${label}</th>`;

      <td class="at-team" title="${esc(teamStr)}">${esc(teamStr.length > 40 ? teamStr.slice(0,38)+'…' : teamStr)}</td>
      <td>${s.spiele}</td>
      <td>${s.tore}</td>
      <td>${s.assists}</td>
      <td class="at-pkt">${s.punkte}</td>
      ${staticStrafenDetails
        ? `<td>${s.p2 || 0}</td><td>${s.p2and2 || 0}</td><td>${s.p5 || 0}</td><td>${s.p10 || 0}</td><td>${s.ms || 0}</td>`
        : ''}
      <td>${s.strafminuten}'</td>
      ${staticPerGame
        ? `<td>${(s.punkte / sp).toFixed(2)}</td><td>${(s.tore / sp).toFixed(2)}</td><td>${(s.assists / sp).toFixed(2)}</td><td>${(s.strafminuten / sp).toFixed(2)}'</td>`
        : ''}
    </tr>`;
  }).join('');

  // ── Stand-Info ────────────────────────────────────────────────────────────
  const stand = staticDaten.generiert
    ? `Stand: ${staticDaten.generiert} · ${staticDaten.ligen_gesamt} Ligen`
    : '';

  const scorerColCount = 8 + (staticStrafenDetails ? 5 : 0) + (staticPerGame ? 4 : 0);

  document.getElementById('content-static').innerHTML = `
  <div class="alltime-section">
    <div class="alltime-section-title">
      🇩🇪 Ewige Scorerliste &nbsp;·&nbsp; ${gesamtStaticSpieler} Spieler
      <span style="font-size:.72rem;font-weight:400;color:rgba(255,255,255,.35);margin-left:12px">${stand}</span>
    </div>

      <table class="at-table">

          ${sHdr('assists','A')}

            ? `${sHdr('pkt_sp','Pkt/Sp','Punkte pro Spiel')}${sHdr('g_sp','G/Sp','Tore pro Spiel')}${sHdr('a_sp','A/Sp','Assists pro Spiel')}${sHdr('pim_sp','PIM/Sp','PIM pro Spiel')}`
            : ''}
        </tr></thead>
        <tbody>${scorerRows || `<tr><td colspan="${scorerColCount}" style="text-align:center;padding:20px;color:rgba(255,255,255,.3)">Keine Einträge</td></tr>`}</tbody>
      </table>
    </div>
    ${paginierungsHTML(gesamtStaticSpieler, staticSpielerSeite, 'setStaticSpielerSeite')}
  </div>`;
